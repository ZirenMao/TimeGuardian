     原来补画只有一个入口 —— `renderPower` 被挡时顺手排个队（pwRetryAfterHold）；
     可页面是**事件驱动**的（SSE 有事才推、60 秒那条只是保险丝），这 3 秒里
     完全可能一个事件都不来 ⇒ 那份被吞掉的真值成了绝响，卡片就一直停在
     本地乐观值上、也没有任何人来纠正它。现在挂一条定时器，到点自己收尾。 */
  pwSettleSoon();
}
/* 撤掉某个 key 的「在途挡板」。任务跑完时用（见 pollJob 的 done 分支）——
   那一刻服务端已经落过盘，接下来那份快照**必然是新真值**，没有理由再挡。
   ★ 这是「反应时间从 3 秒降到 ~1 秒」的关键一环。 */
function pwRelease(k){
  if (!k) return;
  delete PW_HOLD[k];
  var s = String(k);
  /* 两处「名字对不上」：挡板立的时候用的是另一个串。 */
  if (s.indexOf('shutdown') === 0) delete PW_HOLD['shutdown'];   /* btn-shutdown 记的是它 */
  var w = s.replace(/_(on|off)$/, '');                            /* autostop_30 → autostop */
  if (w && w !== s) delete PW_HOLD[w];
}
/* 挡板到期收尾：先确认窗口真的过去了（这中间又点过就顺延），再**现拉一份真值**。 */
function pwSettleSoon(){
  if (PW_TIMER) clearTimeout(PW_TIMER);
  PW_TIMER = setTimeout(function(){
    PW_TIMER = null;
    if (pwHeldAny()){ pwSettleSoon(); return; }    /* 窗口里又点过 → 顺延一轮 */
    /* ★ 到点一律**现拉一份真值**，不拿内存里那份糊 —— `__pwQueue` 存的那份
       可能是「服务端还没落盘时的旧值」（被挡下来的不一定都是新的），拿它重画
       等于把刚做的本地乐观值又打回去。多一次 /api/status 换一个确定的结果，值。
       ⚠️ `__pwQueue` 只留作排障标记（看看到底吞了哪一份），不参与绘制。 */
    window.__pwQueue = null;
    loadStatus();
  }, PW_HOLD_MS + 60);
}
function pwHeldAny(){
  var t = Date.now(), hit = false;
  for (var k in PW_HOLD){
    if (t - PW_HOLD[k] < PW_HOLD_MS) hit = true;
    else delete PW_HOLD[k];
  }
  return hit;
}
/* ★★★ 2026-10-01（第五十一轮 · 用户第 3 条）——**被 PW_HOLD 吃掉的那一次刷新要补回来**。
   用户原话：「我都把跑完自动关机关了，倒计时还在跑，过了一段时间才关」。

   病根不在守护、也不在「关不关得掉」：守护那一轮读到 `autoShutdown=false` 就绝不会
   关机（实测日志 19:01:00「跑完自动关机」→ 关 之后机器照常活着）。**纯粹是显示**。
   真正的链路是这样的：
     ① 点开关 → 本地先把胶囊翻过去（DOM 立刻是「关」）；
     ② `pwHold('shutdown')` 立起来 → **整卡 3 秒不许重画**；
     ③ 那个短任务 0.5~1 秒就跑完 → `pollJob` 收尾时 `loadStatus()` 拉回一份
        **真值（autoShutdown=false）** —— 可它正好落在②那 3 秒窗口里，被
        `renderPower` 第一句 `if (pwHeldAny()) return;` **吞掉**；
     ④ 此后页面上再没有第二件事去拉数据（现在是**事件驱动**：SSE 有事才推，
        60 秒那条只是保险丝）→ 那盏灯就一直按**旧快照**走秒，直到下一次
        别的事件把整页刷新（可能几十秒后）—— 用户看到的「过了一段时间才关」。

   ⇒ 修法：既然 ① 让 DOM 比数据新，那 ④ 就得**有人把这次被吞掉的刷新补上**。
   （第五十一轮的第一版是「存进队列、3.2 秒后自己重画」；第五十三轮改成
     统一交给 `pwSettleSoon()` —— 它到点**现拉一份真值**，比拿内存里那份
     可能是旧值的快照重画更可靠，而且顺带把「点开关」那条路也覆盖了。）

   ⚠️ `pwRetryAfterHold` 这个名字**留着**（门禁 `_chk_mac_ui.py` 的 token 表里有它），
      别以为没人调就删掉。 */
function pwRetryAfterHold(p){
  /* 被挡下的那一份先记个标记 —— 排障时能看出这 3 秒里吞掉的到底是哪一份快照。
     ⚠️ 只当标记，不参与绘制（原因见 pwSettleSoon 里的说明）。 */
  window.__pwQueue = p;
  pwSettleSoon();
}

/* ★ 2026-09-30（用户第 3 条）：时长档位改成 **5 分钟一格**，范围 5 分钟 → 4 小时
   （48 档），**最右端那一档是「无限」**（＝不自动结束，走旧的 `autostop_off`）。
   档位名按分钟数现算：整小时「N 小时」，不足一小时「N 分钟」，其余「N 小时 M 分钟」。 */
var AS_STEP_MIN = 5;
var AS_MAX_MIN  = 240;                                   /* 4 小时 */
var AS_STEPS = [];                                       /* 48 档：5, 10, … 240 分钟 */
for (var _ai = 1; _ai * AS_STEP_MIN <= AS_MAX_MIN; _ai++){
  AS_STEPS.push(_ai * AS_STEP_MIN);
}
function asName(mins){
  if (mins % 60 === 0) return (mins / 60) + ' 小时';
  if (mins < 60) return mins + ' 分钟';
  return Math.floor(mins / 60) + ' 小时 ' + (mins % 60) + ' 分钟';
}
var AS_NAMES = AS_STEPS.map(asName).concat(['无限']);

/* ★★ 2026-09-30（第廿四轮 · 用户第 1 条）：「防休眠」的时长读数也改成**翻牌器** ——
   [小时] : [分十位] [分个位]，恒定 3 张卡，与速度那个（×1.55）**同构**。
   例：5 分钟 → 0:05　100 分钟 → 1:40　240 分钟 → 4:00
   末档「无限」用一张跨三格的宽卡（宽度＝3 卡 + 2 缝），轨道同样不会缩。
   ⚠️ `asName()` / `AS_NAMES` **留着**：读数不用它了，但悬停提示（title）与回归套件
      [7] 段仍按它核对档位（「最右端那一档是不是无限」），别顺手删。 */
function durRead(mins){
  var m = Number(mins) || 0;
  if (!(m > 0)){
    return '<span class="rd"><b class="rd-c rd-inf">∞</b></span>';
  }
  var hh = Math.floor(m / 60), mm = m % 60;
  var s = hh + (mm < 10 ? ':0' : ':') + mm;      /* 形如 '1:40' / '0:05' / '4:00' */
  return '<span class="rd">'
       + '<b class="rd-c">' + s.charAt(0) + '</b>'
       + '<i class="rd-s">:</i>'
       + '<b class="rd-c">' + s.charAt(2) + '</b>'
       + '<b class="rd-c">' + s.charAt(3) + '</b>'
       + '</span>';
}
/* 「无限」档就是最后一位，index = AS_STEPS.length。 */
var AS_INF = AS_STEPS.length;

/* ★★ 2026-09-30（用户：「我把这个防休眠关了之后，应该就不再计时了才对」）：
   「到点自动结束」**依附「防休眠」总开关** —— 总开关关着就不该有倒计时。
   后端在关掉总开关时已经把设定作废了（`drop_autostop_no_awake`），这里是第二道。
   ⚠️ 认不出 features（旧后端）时返回 true，别把功能憋死。 */
function awakeOn(p){
  var F = (p && p.features) || [];
  for (var i = 0; i < F.length; i++){ if (F[i].id === 'awake') return !!F[i].on; }
  return true;
}

/* ★★★ 2026-10-01（第五十三轮 · 用户）——**点开关要"整卡当场跟上"，不能只翻那一颗胶囊**。
   用户原话：「有的时候我已经切换了防休眠的开关，但是它的界面还是没有反应过来，
   比如说我给你发的图这样，按理讲底下应该是亮的了，这个反应的时间能不能加速一下」。

   他截的那张图里：**主开关已经绿了**（DOM 翻过去了），可「屏幕保持常亮」还停在
   淡灰的禁用相。病根是 `.dis`（子开关的淡显）**不是 DOM 上的一个类，是渲染时算出来的**
   （下面 `renderPower` 里 `var dis = (x.sub && !awakeNow)`，而 `awakeNow` 读的是
   `p.features`）—— 只翻那颗胶囊的 class，根本改不动这个派生结果。
   紧接着 `pwHold(k)` 又把整卡挡住 3 秒，这 3 秒里没有任何人重画 ⇒
   **用户看到的一直是「上面绿了、底下还灰着」**，直到下一个事件来（可能几十秒后）。

   ⇒ 治法：**本地乐观更新必须做满两层**——
     ① DOM：那颗胶囊当场翻（CSS 过渡走动画，见 `.sw` 的 CSS）；
     ② **数据层**：`p.features` 里对应那一项也翻过去，**并且照后端 `cmd_toggle`
        的规则把连带一起演一遍**（子项开 → 顺手开主开关；主开关关 → 时长设定作废）；
     演完立刻 `renderPower(p, true)` **整卡重画一次**（force 绕开挡板）——
     于是子开关的淡显、时长滑块的置灰、层级关系，**在同一帧里全部跟上**。
     最后才立挡板、发命令：本地值已经对了，服务端那一趟只是去落盘。

   ⚠️ 连带规则是**照着 `wb_powerguard.cmd_toggle()` 抄的**（第 4044~4062 行）。
      那边改了这里要跟着改 —— 判据都在门禁里钉着，改漏了会当场报。 */
function featSet(p, k, on){
  var F = (p && p.features) || [];
  for (var i = 0; i < F.length; i++){
    if (String(F[i].key) === String(k)){ F[i].on = !!on; return F[i]; }
  }
  return null;      /* 认不出（旧后端 / 界面专用键）→ 交给服务端那份真值去纠 */
}
function featIdSet(p, id, on){
  var F = (p && p.features) || [];
  for (var i = 0; i < F.length; i++){
    if (F[i].id === id){ F[i].on = !!on; return F[i]; }
  }
  return null;
}
/* 本地重演一次后端那次 toggle 的**全部后果**。返回被点的那一项（认不出时 null）。 */
function featToggleLocal(p, k, nxt){
  var x = featSet(p, k, nxt);
  if (!x) return null;
  /* ① 子项（display/lowbat/lid/lid_display）打开、而主开关是关的 → 后端会
        **自动把主开关也打开**（cmd_toggle 的 `if key != 'awake' and F[key] and not F['awake']`）。
        这一条正是用户第 1 条抱怨的那个场景（子开关刚变得点得动）——本地也得跟上，
        否则他会看到「子开关亮了、上面的总开关还是灰的」，又是同一类「没反应过来」。 */
  if (x.id !== 'awake' && nxt && !awakeOn(p)) featIdSet(p, 'awake', true);
  /* ② 关掉主开关 → 后端 `drop_autostop_no_awake()` 把「到点自动结束」一并作废
        （用户 2026-09-30 定的规矩：「关了防休眠就不该再计时」），
        时长滑块要弹回最右端「无限」。本地不演这一步，那行滑块会多停在旧档位上。 */
  if (x.id === 'awake' && !nxt){ p.autoStopDurationSec = 0; p.autoStopAt = 0; }
  /* ③ ★★★ 2026-10-01（第五十五轮 · 用户「让 ui 界面加载快一点，立即有画面和声音的反应」）：
       把「派生显示」的**数据源**也一起算出来。
       状态板那一格（`运行监测 · 防休眠＋常亮`，见 renderStatus 的 pw）与它的悬停提示
       读的是 `p.levelShort` / `p.levelDesc` —— 这两句是**服务端**算好下发的
       （`wb_powerguard.feat_desc()` / `_feat_short()`）。本地只翻胶囊、不算这两句的话，
       点完就会看到「开关已经绿了、底下那句还写着旧组合」，要等下一次 /api/status
       快照（实测 ≈0.6 秒，节奏见 startPoll 的 600ms）才纠正 —— 那正是用户说的「慢半拍」。
       ⇒ 这里照抄后端那两句，点下去**同一帧**就画对。 */
  if (p){
    p.feat = featBools(p);
    p.levelDesc = featDescOf(p);
    p.levelShort = featShortOf(p);
    p.level = !p.feat.awake ? 0 : (p.feat.lidClose ? 3 : (p.feat.keepDisplayOn ? 1 : 2));
  }
  return x;
}

/* ---------- 状态板那一格的「本地算法」（第五十五轮）----------
   为什么要在本地再算一遍：后端那两句人话是随 /api/status 下发的，点开关之后要等
   下一次快照才变（≈0.6 秒）。用户要的「立即有画面」就是这一格 + 悬停提示。
   ⚠️ 与 `wb_powerguard.py` 的 `feat_desc()` / `_feat_short()` **一字对应**：
      那两句一改，这里必须跟着改（判据在门禁 `_chk_mac_ui.py` 里钉着）。 */
function featBools(p){
  /* 真值有两个来源：服务端的 `p.feat`（build_power 给的 5 个布尔）与
     `p.features`（带名字/连带的开关表）。点击那一刻被改的是 features，以它为准。
     ⚠️★ 两边的**名字不一样**：开关表里那一项叫 `id`（awake / display / lowbat /
        lid / lid_display），而 5 个布尔叫 keepDisplayOn / lowBattStop / lidClose /
        lidDisplayOn。必须经下面这张表对 —— 直接拿 id 当键会**一个都对不上**，
        现象是「本地明明翻过了、算出来还是旧组合」（本轮就是在这儿栽了一次）。 */
  var f = { awake:false, keepDisplayOn:false, lidClose:false,
            lidDisplayOn:false, lowBattStop:false };
  var src = (p && p.feat) || {};
  for (var k in f) if (src[k]) f[k] = true;
  var arr = (p && p.features) || [];
  for (var i = 0; i < arr.length; i++){
    var nm = FEAT_ID2K[arr[i].id];
    if (nm) f[nm] = !!arr[i].on;
  }
  return f;
}
/* 开关表的 id → 5 个布尔的键名。⚠️ 改 `_features_payload` 里的 id 时要跟着改这里。 */
var FEAT_ID2K = { awake:'awake', display:'keepDisplayOn', lowbat:'lowBattStop',
                  lid:'lidClose', lid_display:'lidDisplayOn' };
function featDescOf(p){
  var f = featBools(p);
  if (!f.awake) return '不抑制（仅监测 / 只挂自动关机）';
  var s = '防休眠';
  if (f.keepDisplayOn) s += ' + 屏幕常亮';
  if (f.lidClose) s += ' + 合盖也不睡' + (f.lidDisplayOn ? ' + 合盖保持点亮' : ' + 合盖熄屏');
  if (f.lowBattStop) s += ' + 电量低于 ' + (Number(p && p.lowBattPct) || 10) + '% 自动停';
  return s;
}
function featShortOf(p){
  var f = featBools(p);
  if (!f.awake) return '未开';
  if (f.lidClose) return '防休眠＋合盖';
  if (f.keepDisplayOn) return '防休眠＋常亮';
  return '防休眠';
}
/* 只补画状态板上「运行监测」那一格 —— 不整块重画（整块会把用户正按着 / 正拖着的
   别的东西换掉，那是这个项目的老坑，见 renderStatus 上面那几段注释）。
   ⚠️ 什么时候**不**补画：
     · 面板模式没有状态板（renderStatus 在 IS_PANEL 那一支就 return 了）→ 直接跳过；
     · 「开着但守护还没起来」这一瞬（p.alive=false）也不补 —— 冷启动要几百毫秒，
       这里抢着画会闪一条「守护没在跑」，看着像出了错。这两种都交给下一次快照如实画。 */
function pwPaintBoard(p){
  if (IS_PANEL) return;
  var el = $('bd-pw');
  if (!el || !p) return;
  var f = featBools(p), lv, short, full;
  if (!f.awake){
    lv = 'off'; short = '未开启'; full = '未开启';
  } else {
    /* 关主开关这一步不依赖守护，照画；开的那一步要看守护起没起来。 */
    if (!p.alive) return;
    lv = 'ok';
    short = p.levelShort || p.levelDesc || '在跑';
    full = (p.levelDesc || '') + (p.busy ? ' · ' + busySrcLabel(p) : ' · 空闲');
  }
  el.className = 'bd lv-' + lv;
  var v = el.querySelector('.v');
  if (v){ v.textContent = short; v.title = full; }
}

/* 后端只给「用户设了多少秒」（p.autoStopDurationSec），不给「选了哪一档」，
   所以这里反查最接近的档位；**没设 → 落到最后那档「无限」**。
   ★ 2026-09-30：判据从 `autoStopAt` 换成 `autoStopDurationSec` —— 两者答的是
     不同的问题：duration = 「用户选了哪一档」（滑块该停在哪），
     autoStopAt = 「现在跑没跑」。分开之后，关掉防休眠把设定作废时，
     滑块才会跟着弹回最右端「无限」。 */
function asIdxOf(p){
  var mins = Math.round((Number(p && p.autoStopDurationSec) || 0) / 60);
  if (!(mins > 0)) return AS_INF;
  var best = 0, gap = Infinity;
  for (var i = 0; i < AS_STEPS.length; i++){
    var g = Math.abs(AS_STEPS[i] - mins);
    if (g < gap){ gap = g; best = i; }
  }
  return best;
}

/* 一条滑块 + 右侧那颗**翻牌读数器**。
   ★★★ 2026-10-02（第六十五轮 · 用户第 3 条）：原来滑块下面还有**一行小字**
   （`.as-left`：⏰ 还剩 4 分 26 秒后自动结束，color:#f0c96a 压在米白卡上）。
   用户：「这个倒计时时间的字体颜色和背景颜色也太近了，别用黄色的」，
   并给了更好的法子：「我建议你用右边显示时间的那个 UI 来显示倒计时」——
   于是那一行连 DOM 一起退役，倒计时改画进右侧读数器（见 paintAutoStopRead）。
   ⚠️ 拖动期间绝不能被 3 秒一次的整卡重画打断 —— 见 renderPower 开头的 SLD_DRAGGING。 */
function durSliderHTML(p, dis){
  var i = asIdxOf(p);
  var pct = (i / AS_INF) * 100;
  /* ★ 2026-09-30：「防休眠」关着时这一块跟着变灰、滑块禁拖 ——
     与它上面那几颗子开关（.pw-f.dis）一个规矩。到点自动结束是**监测期间**的事，
     监测都没开，让它看着能拖就是骗人。 */
  // ★ 2026-10-05（用户第 9 条）：层级改由外层 `.pw-kids` 容器承载（见渲染循环里
  //   awake 那段），这里就是普通子行 —— 不再挂 `sb` / `ch`。
  return '<div class="pw-f' + (dis ? ' dis' : '') + '"><div class="pw-f-t">'
       + '<span class="pw-f-n">时长</span>'
       + '<span class="pw-f-d">值守多久后自动结束（最右端＝无限）。</span></div></div>'
       + '<div class="sldwrap">'
       + '<input type="range" class="sld" id="sld-dur" min="0" max="' + AS_INF
       + '" step="1" value="' + i + '" style="--p:' + pct + '%"'
       + (dis ? ' disabled' : '')
       + ' aria-label="值守多久后自动结束"'
       + ' title="' + (dis ? '先打开上面的「防休眠」' : '拖动选择，松手生效') + '">'
       + '<span class="sld-val" id="sld-dur-v" title="' + esc(AS_NAMES[i]) + '">'
       + durRead(AS_STEPS[i]) + '</span>'
       + '</div>';
}

function applyGui(g){
  if (!g) return;
  if (g.panel)  GUI.panel  = String(g.panel);
  if (g.stop)   GUI.stop   = String(g.stop);
  if (g.toggles) GUI.toggles = g.toggles.map(String);
  var changed = false;
  if (g.levels && g.levels.length === LV.length){
    LV.forEach(function(x, i){
      var v = String(g.levels[i]);
      if (x.key !== v){ x.key = v; changed = true; }
    });
  }
  // ★ 编号变了、而卡片已经画过一次 → 立刻重画，把 data-key 也刷新掉。
  //   按钮的点击处理是「点的那一刻现查 LV」，所以即使不重画也不会点错；
  //   重画只是为了 DOM 上的标注（以及 title/调试）与真值一致。

  for (var i = 0; i < MS_STEPS.length; i++){

    if (isFinite(g) && g < gap){ gap = g; best = i; }
  }
  return best;
}
/* ★★ 2026-09-30（第廿四轮 · 用户第 1 条）：速度读数改成**翻牌器** ——
   `×` + [整数] . [小数一] [小数二]，恒定 3 张卡（见 .rd 的 CSS 注释）。
   为什么要换：原来这里返回的是「1.55 倍」「1 倍」这种**会伸缩的中文串**，
   字数一变就把旁边 `flex:1` 的滑块轨道挤得忽长忽短 —— 用户截图报的就是这个。
   `toFixed(2)` 保证永远是 3 位数字（0.50 / 1.55 / 3.00），格数恒定。 */
function spdRead(v, light){
  var s = (Math.round((Number(v) || 0) * 100) / 100).toFixed(2);   /* '1.55' */
  return '<span class="rd' + (light ? ' lt' : '') + '">'
       + '<i class="rd-x">×</i>'
       + '<b class="rd-c">' + s.charAt(0) + '</b>'
       + '<i class="rd-s">.</i>'
       + '<b class="rd-c">' + s.charAt(2) + '</b>'
       + '<b class="rd-c">' + s.charAt(3) + '</b>'
       + '</span>';
}

/* 把后端给的一份 mouse 收下来（不碰 DOM；画由 msSync / renderFlat 负责）。 */
function msApply(v){
  if (!v) return;
  SC.smooth  = !!v.smooth;
  SC.reverse = !!v.reverse;
  SC.dockMin = !!v.dockMin;
  if (v.speed) SC.speed = Number(v.speed);
  /* perm / engine 是**外壳**回报的实况（写在 _界面.json 里）：
       true=已授权、false=被拒（要提示去勾）、null=还不知道（外壳没跑）。
     ⚠️ 必须区分 null 与 false —— 拿 null 当 false 会在「外壳没跑」时冤枉地喊缺权限。 */
  if ('perm' in v)   SC.perm   = v.perm;
  if ('engine' in v) SC.engine = v.engine;
  /* ★ 第卅七轮：点 Dock 图标最小化是独立引擎，另有一个实况键。 */
  if ('dockMinEngine' in v) SC.dockMinEngine = v.dockMinEngine;
}
/* 本地改动落盘。失败也不回滚 —— 界面先照用户的意思显示，下一次轮询会纠回来。 */
function msSend(part){
  api('/api/mouse', { method:'POST', headers:{ 'Content-Type':'application/json' },
                       body: JSON.stringify(part) })
    .then(function(r){ if (r && r.mouse) msApply(r.mouse); })
    .catch(function(){ });
}
/* 就地同步（**不重画**）：轮询拿到新值、或用户刚点完，都用它把已有 DOM 对齐 SC。 */
function msSync(){
  var card = $('mouse-card');
  if (!card) return;
  Array.prototype.forEach.call(card.querySelectorAll('.sw-l'), function(b){
    var on = !!SC[b.dataset.sc];
    b.classList.toggle('on', on);
    b.setAttribute('aria-checked', on ? 'true' : 'false');
    b.title = on ? '点一下关掉' : '点一下打开';
  });
  var pm = $('ms-perm');
  /* ★ 第卅七轮：栏目里现在有两个要吃权限的功能 —— 只要**任一开着**且权限被拒，就把引导条显出来。 */
  if (pm) pm.style.display = (((SC.smooth || SC.dockMin)) && SC.perm === false) ? '' : 'none';
  var sq = $('sld-spd');
  if (sq && !MS_DRAGGING){
    var i = msIdxOf(SC.speed);
    if (String(i) !== String(sq.value)){
      sq.value = i;
      sq.style.setProperty('--p', (i / (MS_STEPS.length - 1)) * 100 + '%');
      var vv = $('sld-spd-v');
      if (vv){ vv.innerHTML = spdRead(MS_STEPS[i], true); vv.title = MS_STEPS[i] + ' 倍'; }
    }
  }
}

function msSwitch(key, name, tag, desc){
  var on = !!SC[key];
  return '<div class="ms-f"><div class="ms-f-t">'
    + '<span class="ms-f-n">' + esc(name) + '<i class="ms-f-g">' + esc(tag) + '</i></span>'
    + '<span class="ms-f-d">' + esc(desc) + '</span></div>'
    + '<button class="sw-l' + (on ? ' on' : '') + '" data-sc="' + key + '"'
    + ' role="switch" aria-checked="' + (on ? 'true' : 'false') + '"'
    + ' title="' + (on ? '点一下关掉' : '点一下打开') + '">'
    + '<span class="knob"></span></button></div>';
}

function mouseSectionHTML(){
  var i = msIdxOf(SC.speed), pct = (i / (MS_STEPS.length - 1)) * 100;
  /* ★ 廿七轮：外面那行 `<h2>鼠标</h2>` 小标题**删了** —— 这一节现在独占「鼠标」分页，
     分页条上就写着「鼠标」，再来一行小标题是重复，还白占三十来像素。
     （任务页同理，那边连小标题都没画。） */
  return '<section class="grp"><div id="mouse-card">'
    + msSwitch('smooth',  '平滑滚动', '总开关',
               '让鼠标滚轮拥有类似触控板的惯性滚动；触控板不受影响。')
    + msSwitch('reverse', '反转方向', '子开关',
               '反转滚轮的滚动方向；触控板不受影响。')
    + '<div class="ms-sub"><div class="ms-f-t">'
    + '<span class="ms-f-n">速度</span>'
    + '<span class="ms-f-d">滚一格走多远。只作用于上面开着的平滑滚动，'
    + '不改系统自己的滚动速度。</span></div>'
    + '<div class="sldwrap">'
    + '<input type="range" class="sld" id="sld-spd" min="0" max="' + (MS_STEPS.length - 1)
    + '" step="1" value="' + i + '" style="--p:' + pct + '%"'
    + ' aria-label="平滑滚动速度" title="拖动选择，松手生效">'
    + '<span class="sld-val" id="sld-spd-v" title="' + esc(MS_STEPS[i]) + ' 倍">'
    + spdRead(MS_STEPS[i], true) + '</span>'
    + '</div></div>'
    /* ★★ 第卅七轮（2026-10-01 用户第 3 条）：点 Dock 图标最小化。
       两个参考（PommeToys 的 features.dockIconClickMinimize / DockMinimizer）比过之后
       用的是**同一套触发逻辑** —— 点「当前这个 App」在 Dock 上的图标 → 最小化它的窗口。
       措辞取 PommeToys 那一版（「再次点击当前激活应用的 Dock 图标」），
       因为"再次"把前提讲清楚了：它本来就在最前，所以系统自己什么都不做，才轮到我们接管。
       ⚠️ 标签写「独立」而不是「子开关」：它**不依附**上面的平滑滚动总开关。 */
    + msSwitch('dockMin', '点 Dock 图标最小化', '独立',
               '再次点击当前应用的 Dock 图标，就把它的窗口全部最小化；'
               + '窗口都收起后再点一下即还原（系统原生行为）。')
    + '<div class="ms-perm" id="ms-perm" style="display:none">'
    + '<b>这一栏的功能还没拿到「辅助功能」权限</b>，所以平滑滚动和点 Dock 图标最小化'
    + '这会儿都不生效，开关看不出效果。到「系统设置 → 隐私与安全性 → 设备控制和数据访问」'
    + '里把「TimeGuardian」勾上（macOS 26 及更早这一栏叫「辅助功能」，是同一栏）。'
    + '<br><span style="opacity:.72"><b>勾一次就长期有效</b> —— 外壳已改用固定证书签名，'
    + '以后重编、换图标都不会再让它失效。这里也不挂后台轮询：<b>每次打开这个面板都会实测一次</b>，'
    + '权限一生效，这条提示自己就消失、功能自己开始工作，不用重启。</span>'
    + '<br><button data-ms-perm="1">打开那一页</button></div>'
    + '</div></section>';
}

function bindMouse(root){
  Array.prototype.forEach.call(root.querySelectorAll('#mouse-card .sw-l'), function(b){
    b.onclick = function(){
      var k = b.dataset.sc;
      /* ★ 第卅七轮：dockMin 也是这一排里的一个开关（虽然它走的是另一个引擎）。 */
      if (k !== 'smooth' && k !== 'reverse' && k !== 'dockMin') return;
      SC[k] = !SC[k];
      msSync();                                  /* 先反映到界面 */
      var part = {}; part[k] = SC[k];
      msSend(part);
    };
  });
  var pb = root.querySelector('#ms-perm button[data-ms-perm]');
  if (pb) pb.onclick = function(){
    api('/api/mouse-perm', { method:'POST' }).then(function(r){
      if (r && r.ok) toast('已经翻了那一页（macOS 27 里叫「设备控制和数据访问」）；勾上后关掉面板再打开，这条提示就该消失');
      else toast('打不开系统设置：' + ((r && r.error) || '未知原因'), 5000);
    }).catch(function(e){ toast('打不开系统设置：' + e, 5000); });
  };
  var sq = root.querySelector('#sld-spd');
  if (sq){
    var paintSpd = function(v){
      var i = Math.max(0, Math.min(MS_STEPS.length - 1, Number(v) || 0));
      var vv = $('sld-spd-v');
      if (vv){ vv.innerHTML = spdRead(MS_STEPS[i], true); vv.title = MS_STEPS[i] + ' 倍'; }
      sq.style.setProperty('--p', (i / (MS_STEPS.length - 1)) * 100 + '%');
    };
    /* 与「时长」滑块同一套：按住期间立起 MS_DRAGGING，免得 3 秒一次的
       /api/status 把拖到一半的滑块弹回旧档。 */
    sq.onpointerdown = function(){ MS_DRAGGING = true; };
    sq.oninput = function(){ paintSpd(sq.value); };
    sq.onchange = function(){
      MS_DRAGGING = false;
      var i = Math.max(0, Math.min(MS_STEPS.length - 1, Number(sq.value) || 0));
      var v = MS_STEPS[i];
      if (v === Number(SC.speed)) return;
      SC.speed = v;
      msSend({ speed: v });
    };
    document.addEventListener('pointerup', function(){
      setTimeout(function(){ MS_DRAGGING = false; }, 0);
    });
    paintSpd(sq.value);
  }
}

/* --------------------------------------------------- ④ 右键助手（第四十八轮）
   ★★ 用户原话（2026-10-01）：「把 word模板创建 / 图片转PDF / 合并PDF / PDF加密解密 /
      文档转PDF 从 MouseBoost Pro 搬出来，**卸载 MouseBoost 后仍可用**，并集成到任务管家；
      另：关于右键助手这几个功能的图标**都是 Word 文档的一个图标**，你如果集成到任务管家
      里面的时候，用到图标的话**不要都用这几个 Word 图标**」。
   ★ 落地：这 5 项做成**系统原生「快速操作」**（`~/Library/Services/*.workflow`），
     由 `wb_quickactions.py` 生成 / 装卸；**处理仍归 `com.wb.pdfquick` 守护**（一行没改）。
     这张卡是它们在任务管家里的门面 —— 数据全部来自 `/api/quickactions`（后端出的
     人话说明，前端**不自己拼事实**，与「键盘」页同一条规矩）。
   ⚠️ 三条别踩回去：
     ① **图标一人一个、手画的**（`QA_ICONS`）—— 用户点名不要统一挂 Word 图标；
     ② **只在切到鼠标页时拉一次**，绝不进 3 秒轮询（每拉一次 fork 一个子进程）；
     ③ 「装/卸」与「让右键菜单生效」是**两步**：装完还得跑 `pbs -update` 才出现在
        右键菜单里，而 `pbs` 在工具沙箱里恒报 XPC 错误 → 走外壳桥（kind=pbs）。 */

/* 图标：一人一个。viewBox 统一 24，线宽 1.7，`currentColor` 跟着卡片的字色走。 */
var QA_ICONS = {
  /* 图片转PDF：相框 + 山 + 太阳 */
  IMG2PDF: '<rect x="3" y="4.5" width="18" height="15" rx="2.5"/>'
         + '<circle cx="8.6" cy="9.9" r="1.7"/>'
         + '<path d="M3.7 16.9l4.9-4.3 3.3 2.8 3-2.6 5.4 4.8"/>',
  /* 合并PDF：汇合（分叉再并成一条），一眼看出「多份 → 一份」 */
  MERGE:   '<circle cx="6" cy="5.6" r="2.3"/><circle cx="6" cy="18.4" r="2.3"/>'
         + '<circle cx="18" cy="12" r="2.3"/>'
         + '<path d="M8.3 5.6h3.4a4 4 0 0 1 4 4v.9"/>'
         + '<path d="M8.3 18.4h3.4a4 4 0 0 0 4-4v-.9"/>',
  /* PDF加密解密：一把锁 */
  CRYPT:   '<rect x="4.4" y="10.4" width="15.2" height="10.2" rx="2.6"/>'
         + '<path d="M8 10.4V7.6a4 4 0 0 1 8 0v2.8"/>'
         + '<circle cx="12" cy="15.5" r="1.35"/>',
  /* 文档转PDF：两条对向的箭头（转换 / 换形） */
  DOC2PDF: '<path d="M4 7.6h12.5"/><path d="M13.6 4.4l3.2 3.2-3.2 3.2"/>'
         + '<path d="M20 16.4H7.5"/><path d="M10.4 13.2l-3.2 3.2 3.2 3.2"/>',
  /* word模板创建：一份文档 + 一个加号 */
  WORDNEW: '<path d="M6 2.9h7.2l5.3 5.2v13H6z"/><path d="M13.2 2.9v5.2h5.3"/>'
         + '<path d="M12 12.4v5.2M9.4 15h5.2"/>'
};
function qaIcon(k){
  var p = QA_ICONS[k] || QA_ICONS.DOC2PDF;
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"'
       + ' stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
       + p + '</svg>';
}

/* 这一页的状态。⚠️ `busy` 只是防连点，不做节流。 */
var QA = { data: null, busy: false };

function qaRowHTML(it){
  var key = it.action || 'WORDNEW';
  /* 「这一项有没有可挑的模板」由**后端**说（`it.hasTpl`），前端不按名字写 if ——
     与「说明文字来自后端」同一条规矩：事实只留一份。 */
  var w = (QA.data && QA.data.wordTpl) || {};
  var right;
  if (it.pending){
    /* 还没搬过来的那项：**显式列出来、标成「待补」**，不让用户以为我漏了。 */
    right = '<span class="qa-tag" title="' + esc(it.todo || '') + '">待补脚本</span>';
  } else {
    if (it.hasTpl){
      /* ★★ 第四十九轮（用户）：右半边那颗「选择模板…」——
         弹系统原生的选文件框，挑完立刻生效（快速操作每次点都现问一遍模板路径）。 */
      right = '<button class="qa-tpl-b" data-qa-pick="1"'
            + ' title="现在用的是：' + esc(w.path || '（还没读到）')
            + '　·　点一下另选一个 .dotm / .dotx / .docx / .doc"'
            + '>选择模板…</button>';
    } else {
      right = '';
    }
    right += '<button class="sw-l' + (it.on ? ' on' : '') + '" data-qa="' + esc(it.name) + '"'
          + ' role="switch" aria-checked="' + (it.on ? 'true' : 'false') + '"'
          + ' title="' + (it.on ? '点一下从右键菜单里撤掉' : '点一下装进右键菜单')
          + '"><span class="knob"></span></button>';
    right = '<span class="qa-f-r">' + right + '</span>';
  }
  var tplLine = '';
  if (!it.pending && it.hasTpl){
    tplLine = '<span class="qa-tpl' + (w.exists ? '' : ' warn') + '" title="'
            + esc(w.path || '') + '">模板：<b>' + esc(w.label || '（没读到）') + '</b>'
            + (w.exists ? '' : '　← 这份不在了，点右边重新选一个')
            + '</span>';
  }
  return '<div class="qa-f' + (it.on ? ' on' : '') + (it.pending ? ' pend' : '') + '">'
    + '<span class="qa-ic">' + qaIcon(key) + '</span>'
    + '<span class="qa-f-t"><span class="qa-f-n">' + esc(it.name)
    + '<i>' + esc(it.when) + '</i></span>'
    + '<span class="qa-f-d">' + esc(it.pending ? it.why : it.desc) + '</span>'
    + tplLine + '</span>'
    + right + '</div>';
}

function qaSectionHTML(){
  return '<section class="grp"><div id="qa-card">'
    + '<div class="qa-h"><b>右键助手</b></div>'
    + '<div id="qa-rows"><div class="qa-f"><span class="qa-f-t">'
    + '<span class="qa-f-d">正在读…</span></span></div></div>'
    + '<div class="qa-ft"><span id="qa-note">…</span><span class="qa-sp"></span>'
    + '<button id="qa-open">在访达里看</button>'
    + '<button id="qa-refresh" title="重挂访达右键扩展、重新注册快速操作，并重启访达让它立刻生效（访达会闪一下）">'
    + '让右键菜单生效</button></div>'
    + '</div></section>';
}

/* 重画行 + 重新绑开关。⚠️ 只重画 #qa-rows 这一块 —— 底栏那两颗按钮是静态 HTML，
   重画整张卡会把 bindQuick 绑好的点击连同节点一起扔掉（且不报错）。 */
function qaPaint(){
  var box = $('qa-rows');
  if (!box || !QA.data) return;
  var items = QA.data.items || [];
  var h = '';
  items.forEach(function(it){ h += qaRowHTML(it); });
  box.innerHTML = h;
  Array.prototype.forEach.call(box.querySelectorAll('.sw-l[data-qa]'), function(b){
    b.onclick = function(){ qaToggle(b.dataset.qa, !b.classList.contains('on')); };
  });
  /* ★ 第四十九轮：右半边那颗「选择模板…」。同样**重画后重新绑**（见上面那条注释）。 */
  Array.prototype.forEach.call(box.querySelectorAll('.qa-tpl-b[data-qa-pick]'), function(b){
    b.onclick = function(){ qaPick(b); };
  });
  var real = items.filter(function(x){ return !x.pending; });
  var n = $('qa-note');
  if (n){
    n.textContent = real.length
      ? '右键菜单里这会儿有 ' + (QA.data.on || 0) + ' / ' + real.length + ' 项'
      : '这台机器上还没有装任何一项';
  }
}

/* ★★ 第四十九轮（用户）：「选择模板…」那颗按钮。
   ------------------------------------------------------------------
   ⚠️ 这一下会**弹系统原生的选文件框**，而服务端是**等 osascript 返回**才回响应的 ——
      用户不选，这个请求就一直挂着。所以按钮必须先变成「等你选…」并禁用：
      否则用户看着没反应就会连点，拨出好几个框来。
   ⚠️ 用户按「取消」是**正常结果**，后端专门用 `cancel: true` 标出来 ——
      别弹红字吓他（点错了本来就很常见）。
   ★ 生效范围：只是改了个路径文件。快速操作里那段 AppleScript **每次点都现问一次**
     模板路径，所以改完**不用重装、也不用再跑「让右键菜单生效」**。 */
function qaPick(btn){
  if (QA.busy) return;
  QA.busy = true;
  var old = btn.textContent;
  btn.disabled = true;
  btn.textContent = '等你选…';
  var done = function(){
    QA.busy = false;
    /* 成功了会 qaPaint() 整块重画 → 这颗 button 已经脱了 DOM，
       改它没意义（新的那颗本来就是好的）；只在它还活着时才恢复。 */
    if (btn && btn.isConnected){ btn.disabled = false; btn.textContent = old; }
  };
  api('/api/quickactions', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ pick: true })
  }).then(function(r){
    if (r && r.quick){ QA.data = r.quick; qaPaint(); }
    var p = r && r.quick && r.quick.pick;
    if (p && p.ok){
      var w = (r.quick && r.quick.wordTpl) || {};
      toast('模板已改成「' + ((w && w.label) || '') + '」—— 下次右键「word模板创建」就用它，'
            + '不用重装、也不用点「让右键菜单生效」');
    } else if (p && p.cancel){
      /* 自己按的取消：什么都不说 —— 弹一句反而是噪音。 */
    } else {
      toast('没改成功：' + ((p && p.msg) || '未知原因'), 7000);
    }
  }).catch(function(e){ toast('没改成功：' + e, 7000); })
    .then(done);
}

function qaLoad(){
  return api('/api/quickactions').then(function(r){
    if (r && r.quick){ QA.data = r.quick; qaPaint(); }
  }).catch(function(){ /* 读不到就保持原样，不打扰用户 */ });
}

/* 装 / 卸**单项**。★ 这条路是两步里的第一步，做完要提示还差「让右键菜单生效」。 */
function qaToggle(name, on){
  if (QA.busy) return;
  QA.busy = true;
  api('/api/quickactions', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: name, on: on })
  }).then(function(r){
    QA.busy = false;
    if (r && r.quick){ QA.data = r.quick; qaPaint(); }
    var a = r && r.quick && r.quick.apply;
    if (a && !a.ok){
      toast('这项没改动成功：' + ((a && a.msg) || '未知原因'), 6000);
      return;
    }
    toast(on ? '「' + name + '」已装好 —— 再点右下角「让右键菜单生效」，它才会出现在右键里'
             : '「' + name + '」已撤下 —— 同样点一下「让右键菜单生效」才立刻消失');
  }).catch(function(e){
    QA.busy = false;
    toast('这项没改动成功：' + e, 6000);
  });
}

/* 第二步：让系统重新注册一遍「快速操作」。
   ⚠️ `pbs -update` 在工具沙箱里恒报 `XPC message error: Connection interrupted`
      （它要连用户的图形会话），所以这里**必须走外壳桥**；顺带重启访达让它立刻刷新。 */
function qaRefresh(btn){
  var old = btn.textContent;
  btn.disabled = true;
  btn.textContent = '正在生效…';
  var done = function(){
    btn.disabled = false;
    btn.textContent = old;
  };
  api('/api/quickactions', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ refresh: true })
  }).then(function(r){
    if (r && r.quick){ QA.data = r.quick; qaPaint(); }
    var f = r && r.quick && r.quick.refresh;
    if (f && f.ok) toast('右键菜单已重挂（右键扩展 + 快速操作）—— 去访达里右键试试（访达会闪一下，正常）');
    else toast('重挂没成：' + ((f && f.msg) || '未知原因')
               + '（备选：注销重登一次，100% 可靠）', 8000);
    done();
  }).catch(function(e){ toast('重新注册没成：' + e, 8000); done(); });
}

function bindQuick(root){
  var o = root.querySelector('#qa-open');
  if (o) o.onclick = function(){
    api('/api/qa-open', { method:'POST' }).then(function(r){
      if (!r || !r.ok) toast('打不开那个文件夹：' + ((r && r.msg) || '未知原因'), 5000);
    }).catch(function(e){ toast('打不开那个文件夹：' + e, 5000); });
  };
  var f = root.querySelector('#qa-refresh');
  if (f) f.onclick = function(){ qaRefresh(f); };
}

/* ============================================================ 五个分页
   ★★ 2026-09-30（第廿七轮 · 用户第 2 条）：用户原话「就像 POMMETOYS 分为窗口、滚动、
      系统、通用四个页面」，于是首页从「一条直筒」改成**分页**：
        · 任务     —— 原来铺在首页的那两张卡 + 底部那排按钮，一并收成一列入口；
        · 监测     —— 运行监测那张常驻黑卡（它现在**住在** #page-monitor 里，不再被搬）；
        · 鼠标     —— 平滑滚动 / 反转方向 / 速度（原来铺在首页最上面那一节）；
        · 键盘     —— ★ 第卅二轮新增：Karabiner-Elements 的全部映射 + Command X-V 增强；
        · 设置     —— 原来「状态与设置」整屏视图里的全部内容（那颗按钮已删）。
   为什么值得这么改：窗口**定尺**了（见 WBShell.swift 的廿七轮改动），一屏塞不下所有东西；
   分成五页之后每页只管自己那一摊，标签横向还天然等分（5 × 1fr）。
   ⚠️ 「哪一页放什么」由这里的 PTABS 与 paintTab 定，不写死 gkey ——
      板块名与归属仍全部来自 /api/menu。 */
var PTABS = [
  { k: 'monitor',  t: '监测' },
  { k: 'mouse',   t: '鼠标' },
  { k: 'keyboard', t: '键盘' },
  { k: 'settings', t: '设置' }
];
var PTAB = 'monitor';              /* 当前分页（内存态即可，不必落盘） */
var SETTINGS_LD = false;        /* 设置页拉过一次就不再自动重拉（切页来回不重复请求） */

function renderTabs(){
  var el = $('ptabs');
  if (!el) return;
  var h = '';
  PTABS.forEach(function(x){
    h += '<button class="ptab" data-tab="' + esc(x.k) + '">' + esc(x.t) + '</button>';
  });
  el.innerHTML = h;
  el.style.display = h ? '' : 'none';
  Array.prototype.forEach.call(el.querySelectorAll('.ptab'), function(b){
    /* ★ 第 20 条：.ptab 命中选择器 → 兜底已响，这里不必再自己 snd()。 */
    b.onclick = function(){ goto(b.dataset.tab); };
  });
  markTab();
}

/* 把「哪一页是当前页」反映到 DOM 上（分页条的选中态 + 五屏的显隐）。 */
function markTab(){
  Array.prototype.forEach.call(document.querySelectorAll('#ptabs .ptab'), function(b){
    b.classList.toggle('on', b.dataset.tab === PTAB);
  });
  Array.prototype.forEach.call(document.querySelectorAll('.page'), function(sec){
    sec.classList.toggle('on', sec.id === 'page-' + PTAB);
  });
}

/* 切页。★ 对外也暴露一份（`window.__gotoTab`）—— 外壳菜单里的
   「状态与设置… ⌘,」走的就是它（见 WBShell.swift::actSettings）。 */
function goto(k){
  var hit = false;
  PTABS.forEach(function(x){ if (x.k === k) hit = true; });
  if (!hit) k = (PTABS[0] && PTABS[0].k) || 'monitor';
  PTAB = k;
  markTab();
  paintTab(k);
}
window.__gotoTab = goto;

function paintTab(k){
  /* ★ 第卅三轮：离开键盘页就把「按键录制」停掉 —— 否则录制态会一直挂在那儿，
     在设置页打字时被全局捕获监听全部 preventDefault 掉（页面上像「键盘坏了」）。 */
  if (k !== 'keyboard' && KY.cap){ KY.cap = ''; KY.capMod = ''; kyCapClear(); }
  if (k === 'task')          paintTask();
  else if (k === 'mouse')   paintMouse();
  else if (k === 'keyboard') paintKeyboard();
  else if (k === 'settings') loadSettings();
  /* monitor 那一页是常驻 DOM（#power-card 由 renderPower 自己管），不需要画。 */
}

/* ---------------------------------------------------------- ① 任务页
   五个入口，一个不多一个不少 —— 用户点名要的就是这五个：
     部署和修复、★ 一键整合（原来铺在首页的那两张卡）
     同步、空间回收、更多工具…（原来底部那排按钮）
   怎么来的：**菜单驱动**。非「运行监测」的每一组 ——
     · present='collapsed' 的组 → 画成「开下一层」的一行（点开是整屏视图）；
     · present='flat' 的组     → 把组里那几张**可点执行的卡**照原样画出来。
   这么写的好处：以后在 wb_menu.py 里挪板块 / 改呈现方式，这一页自动跟着变，
   前端一个 gkey 都不写死。 */
function paintTask(){
  var el = $('page-task');
  if (!el) return;
  if (!MENU_DATA){
    el.innerHTML = '<section class="grp"><div class="hint">'
      + '菜单还没读上来 —— 点右上角「刷新状态」再试一次。</div></section>';
    return;
  }
  /* ⚠️ 这里**不写 `<h2>任务</h2>`**：分页条上已经写着「任务」，
     再来一行小标题纯属重复，还白占三十来像素。
     行与行之间的间距靠 .cards 的 gap（这个包装层不能省）。 */
  var h = '<section class="grp"><div class="cards one">';
  groupList().forEach(function(g){
    if (isPowerGroup(g.title)) return;          /* 运行监测有自己那一页 */
    if (isCollapsed(g)){
      /* 开下一层的一行：**行尾一个浅灰 ›**，一眼看出「点下去还有一层」。
         其余全靠 .item 那一套（宽高、间距、描边），所以和上面那两张卡是一条线。
         ⚠️ 别再往这里加「点开是一个面板」那种小标签 —— 它会换行、把这一行撑高，
            五种行的高低就不齐了（第一版正是那样，离屏截图一看就参差）。
            › 已经把这层意思说尽了。
         ★★ 2026-10-01（第卅轮）：这个 › 原来是**行首的绿底方块**，与上面两张卡的
            **黑底数字**并排看着就是「一会有绿、一会有黑」。用户要求统一 → 现在
            行首一律没有方块，› 挪到行尾、用与次要文字同色的浅灰（见 .item .chev）。 */
      h += '<button class="item view" data-view="' + esc(g.view || '') + '">'
         + '<span class="b"><span class="nm">'
         + esc(tabLabel(g)) + '</span></span>'
         + '<span class="chev" aria-hidden="true">›</span></button>';
      return;
    }
    (g.items || []).forEach(function(it){ h += card(it); });
  });
  h += '</div></section>';
  el.innerHTML = h;
  bindCards(el);
  paintAllRuns();     /* ★ 菜单重画会把卡片连同运行指示槽一起换新 —— 立刻补状态 */
}

/* ---------------------------------------------------------- ③ 鼠标页
   只画一次（留一个 `data-painted` 记号）；之后的值同步一律走 msSync() **就地改** ——
   重画会把用户正按着的开关、正拖着的滑块换掉（这个坑在「首页一条直筒」时代踩过）。 */
function paintMouse(){
  var el = $('page-mouse');
  if (!el) return;

    el.innerHTML = mouseSectionHTML() + qaSectionHTML();

    bindQuick(el);

  qaLoad();
}

/* ---------------------------------------------------------- ④ 键盘页（第卅二轮）

   ★ 数据从哪来：`/api/keymap`（wb_ui.py）→ `wb_keymap.py::for_ui()`。

   ★★ 第卅三轮（2026-10-01 11:31 截图）用户又提了四条，**这一页的行渲染整个翻新了**：

/* ---- 这一页的状态全在一个对象里，不散落 ---- */
var KY = {

  shown:  '',     /* 已经画上屏的那份内容指纹 —— 一样就不重画（切页来回不闪） */
  busy:   false,  /* 防叠发（连点「重新导入」） */
  open:   {},     /* 功能包**展开**态 {组key: true=展开}。★ 不进 data，重画时靠它还原。
                     ★★ 默认是空对象 ⇒ **所有包一进来都是收起的**，点组头才展开。
                     （用户 2026-10-01：「默认情况打开下这个键盘栏目里面的编辑键
                       浏览器这些是默认不展开的 我点再展开」）

/* 修饰键人话。⚠️ 与 wb_keymap.py::_MOD_CN 同口径 —— 那边少一个键，这边就会把

/* ★★ 键位总表（第卅三轮）：**浏览器 `event.code` → Karabiner `key_code`**。

  F17:'f17',F18:'f18',F19:'f19',F20:'f20',
  ArrowLeft:'left_arrow',ArrowRight:'right_arrow',
  ArrowUp:'up_arrow',ArrowDown:'down_arrow',
  Home:'home',End:'end',PageUp:'page_up',PageDown:'page_down',Insert:'insert',
  Backspace:'delete_or_backspace',Delete:'delete_forward',
  Enter:'return_or_enter',NumpadEnter:'return_or_enter',
  Tab:'tab',Space:'spacebar',Escape:'escape',CapsLock:'caps_lock',Power:'power',
  Minus:'minus',Equal:'equal_sign',
  BracketLeft:'open_bracket',BracketRight:'close_bracket',Backslash:'backslash',
  Semicolon:'semicolon',Quote:'quote',Comma:'comma',Period:'period',
  Slash:'slash',Backquote:'grave_accent_and_tilde',
  ShiftLeft:'left_shift',ShiftRight:'right_shift',
  ControlLeft:'left_control',ControlRight:'right_control',
  AltLeft:'left_option',AltRight:'right_option',
  MetaLeft:'left_command',MetaRight:'right_command'
};

/* 「纯修饰键」的 code —— 按 Ctrl+V 时先来的那一个。判定见 kyOnKey ①。 */
var KY_PUREMOD = /^(Shift|Control|Alt|Meta)(Left|Right)$/;
/* 等多久才认定「那个纯修饰键就是要录的键本身」 */
var CAP_WAIT = 550;
/* 修饰键 key_code（用来判「录到的这个键是不是修饰键本身」） */
function kyIsModKey(k){
  return KY_MODS.hasOwnProperty(k) || k === 'caps_lock' || k === 'fn';
}

/* 把「修饰键 + 键」拼成人话：['control'] + 'v' → `Ctrl + V`。
   ⚠️ 修饰键与键之间也带 `+`，跟别的行观感一致（原来写成「Ctrl + [V]」，
      是因为右边紧挨着一个下拉框；现在是整块按钮，`Ctrl + V` 更好读）。 */
function kyComboCN(mods, key){
  var out = [], i;
  for (i = 0; i < (mods || []).length; i++){
    var m = String(mods[i]);
    if (m === 'any') continue;         /* 录制出来的组合不会有 any */
    out.push(KY_MODS[m] || m);         /* 认不出也原样印，不静默吞掉 */
  }
  var k = kyKey(key);
  return out.length ? (out.join(' + ') + ' + ' + k) : k;
}

/* 一个「可录制的键」胶囊。录制态里文案变成「按一下新键」。 */
function kyKeyBtn(id, mods, key, dis){
  var cap = (KY.cap === id);
  return '<button type="button" class="kb-key' + (cap ? ' cap' : '') + '"'
    + ' data-kycap="' + esc(id) + '"' + (dis ? ' disabled' : '')
    + ' title="' + (cap ? '现在按一下你要用的键（Esc 取消）'
                        : '点一下，然后直接在键盘上按出你要的键') + '">'
    + (cap ? '<i class="kk">按键…</i>按一下新键' : esc(kyComboCN(mods, key)))
    + '</button>';
}

/* 程序名清单（去重，认不出就印 bundle id 本身） */
function kyApps(list){
  var seen = {}, out = [];
  for (var i = 0; i < (list || []).length; i++){
    var a = String(list[i]);
    var n = KY_APP_CN[a] || a;
    if (seen[n]) continue;
    seen[n] = 1; out.push(n);
  }
  return out.join('、');
}

/* `to_if_alone` 那几条的输出键（F17）—— **只读文字**，不是控件。
   ★ 第卅三轮：改成直接读后端下发的 `aloneKey`，不再从 label 里抠箭头右边那一句
     （抠字符串是上上轮的将就写法：label 里还挂着「（单击）」这种修饰语，改一次文案就崩）。
   为什么不给它做成可改：这一条真正输出的是 F17（＝切输入法），而 `to` 只是「原样放行」；
   让用户改 `to` 会**直接弄坏中英切换**（连放行都放不出去）。详见 kyRow 的 alone 分支。 */
function kyAloneText(it){
  return '输出 ' + kyKey(it.aloneKey || '?');
}

function kySwitch(attr, val, on, title){
  return '<button class="sw-l' + (on ? ' on' : '') + '" ' + attr + '="' + esc(val) + '"'
    + ' role="switch" aria-checked="' + (on ? 'true' : 'false') + '"'
    + ' title="' + esc(title) + '"><span class="knob"></span></button>';
}

/* 逐条那一行的第二行：生效范围 +（有必要时）Karabiner 的原始说明。
   ⚠️ 原始说明大多是英文噪音（`Insert (Ctrl)`），只在这两种情况下放出来：
      ① 含中文（如第 41 条的 `[外置键盘] Cmd+F4 -> Cmd+Q …`）；
      ② 含 `->`（如中英切换那四条的 `Left Shift: ABC -> WeType`——
         它是 kb-50 与 kb-51 **唯一**的区别，不放出来就看着是两条一模一样的）。 */
function kyRowDesc(it){
  var out = [], sc = String(it.scope || '');
  if (sc) out.push(esc(sc));
  var ds = String(it.desc || '');
  if (ds && ds !== it.label && (/[\u4e00-\u9fa5]/.test(ds) || ds.indexOf('->') >= 0)){
    out.push(esc(ds));
  }
  var h = out.join(' · ');
  if (sc.indexOf('仅外接键盘') >= 0){
    /* ★ 如实标注能力边界，不给假承诺：这一条在 Karabiner 里是靠它自己的 DriverKit
       虚拟键盘（`device_if`）只对外接键盘生效的；而用户态事件监听**分不出**内建/外接
       （实测里装着 Karabiner 时，外接键盘在 hidutil / ioreg 里根本不出现）。
       所以本引擎里它会在**所有**键盘上生效 —— 不说清楚，用户会在内建键盘上误触。 */
    h += '<i class="kb-warn" title="Karabiner 靠驱动只对外接键盘生效；用户态监听分不出内建/外接，'
       + '这一条在本程序里对所有键盘都生效">对所有键盘生效</i>';
  }
  return h;
}

/* 逐条那一行。**三种长相**，由所属的包（后端下发的 `kind`）决定：
     'keys'   → `默认 Cmd + V` → `[⌨ Ctrl + V]`（终端 / 浏览器 / 中英 / 系统 / 修饰键）
     'switch' → `默认 Cmd + V` → `Ctrl + V` 两边都是文字，只留右边那颗开关（编辑键整包锁死）
     alone    → `单击 [⌨ 左 Shift]` → `输出 F17`（中英切换那 4 条，理由见下）
   ⚠️ 别按组名写 if —— 「哪一组能不能改键」的唯一事实源是后端 `wb_keymap.GROUP_KIND`。 */
function kyRow(it, kind){
  var on = !!it.enabled;
  var h = '<div class="kb-r' + (on ? ' on' : '') + '" data-kr="' + esc(it.id) + '">'
        +   '<div class="kb-r-t"><div class="kb-combo">'
        /* ★ 2026-10-18（用户第 1 条「每个功能前面写一个标题」）：行首一列功能名，
           固定宽度 —— 这样 50 多行的「默认…→…」全部对齐，扫一眼就能找到要看的那条。 */
        +   '<span class="kb-name">' + esc(it.name || '') + '</span>';
  if (it.alone){
    /* `to_if_alone`（左右 Shift 单击切输入法）：**它没有「被替换掉的原生键」** ——
       `to` 就是 left_shift 本身（用来放行），真正输出的是 to_if_alone 里的 F17。
       所以这一组不套「默认 → 现在」的框：那会写成「左 Shift → 左 Shift」，读不懂。
       如实写成「单击 [触发键] → 输出 F17」；可改的仍然是**触发键**。 */
    h += '<span class="kb-lbl">单击</span>'
       + kyKeyBtn(it.id, it.fromMods, it.fromKey, false)
       + '<span class="kb-ar">→</span>'
       + '<span class="kb-arm">' + esc(kyAloneText(it)) + '</span>';
  } else if (kind === 'switch'){
    /* ★★ 用户第 2 条原话：「干脆对于编辑键里面就只设置个开关 不要让它可以修改按键了」。
       两边都只是文字：左边压暗一档＝**参照物**（本来就是这么按的），
       右边是这条**当前的键**，不给改（只随这一条自己的开关生效/失效）。 */
    h += '<span class="kb-lbl">默认</span>'
       + '<span class="kb-def">' + esc(kyComboCN(it.toMods, it.toKey)) + '</span>'
       + '<span class="kb-ar">→</span>'
       + '<span class="kb-mod">' + esc(kyComboCN(it.fromMods, it.fromKey)) + '</span>';
  } else {
    h += '<span class="kb-lbl">默认</span>'
       + '<span class="kb-def">' + esc(kyComboCN(it.toMods, it.toKey)) + '</span>'
       + '<span class="kb-ar">→</span>'
       + kyKeyBtn(it.id, it.fromMods, it.fromKey, false);
  }
  h += '</div>';
  var d = kyRowDesc(it);
  if (d) h += '<span class="kb-r-d">' + d + '</span>';
  h += '</div>';
  /* ★ 2026-10-18（用户：「这俩功能给改成默认的按键，我改不回来了」）：
     「恢复默认」不用按键 —— 锁屏/睡眠的默认组合按下去会直接触发系统动作，
     在录制态里根本录不回来。点这里＝后端把触发键抄回默认值，并停用这一条。
     只给能改键的包（`kind === 'keys'`）；编辑键是锁死只留开关，中英切换没有默认值。 */
  if (kind === 'keys' && !it.alone){
    h += '<button type="button" class="kb-rst" data-kyrst="' + esc(it.id) + '"'
       + ' title="把这一条改回系统默认的按键，并停用这一条">还原</button>';
  }
  h += kySwitch('data-kysw', it.id, on,
               on ? '点一下关掉这一条' : '点一下打开这一条')
    + '</div>';
  return h;
}

/* 一个功能包：组头（可折叠）+ 逐条。
   ⚠️ 组头那颗开关是「整包总开关」，**不连折叠** —— 所以在 [data-kgh] 的点击
      处理里要先判 `closest('.sw-l')` 让路（见 bindKeyboard ③）。 */
function kyGroup(g){
  var rules = g.rules || [], total = rules.length, onN = 0, i;
  for (i = 0; i < total; i++) if (rules[i].enabled) onN++;
  /* ★★ 默认**收起**：没被点开过 = `KY.open` 里没有这一条 ⇒ folded=true。
     用户 2026-10-01 点名要这个默认态（「是默认不展开的 我点再展开」）。 */
  var folded = !KY.open[g.key], on = !!g.enabled;
  var body = '';
  /* ★ 2026-10-18（用户第 3 条「分类 UI 太乱」）：编辑键包里有 45 条，混在一起看不出
     「哪些是 Alt 习惯、哪些是 Ctrl 习惯」。这里**只按 fromMods 分三小段**打小标题，
     不改任何数据、不改行的长相 —— 其他包照旧一列到底。 */
  if (g.key === 'edit'){
    var altR = [], ctrlR = [], othR = [], mm;
    for (i = 0; i < total; i++){
      mm = rules[i].fromMods || [];
      if (kyHasMod(mm, 'option')) altR.push(rules[i]);
      else if (kyHasMod(mm, 'control')) ctrlR.push(rules[i]);
      else othR.push(rules[i]);
    }
    if (altR.length){
      body += '<div class="kb-sub">Alt 组合 · Windows 习惯（' + altR.length
            + ' 条）：左 Alt + 键 → ⌘ + 同一键</div>';
      for (i = 0; i < altR.length; i++) body += kyRow(altR[i], g.kind);
    }
    if (ctrlR.length){
      body += '<div class="kb-sub">Ctrl 组合 · Windows 习惯（' + ctrlR.length
            + ' 条）：Ctrl + 键 → ⌘ + 同一键</div>';
      for (i = 0; i < ctrlR.length; i++) body += kyRow(ctrlR[i], g.kind);
    }
    if (othR.length){
      body += '<div class="kb-sub">Home / End / Delete / Enter（' + othR.length
            + ' 条）</div>';
      for (i = 0; i < othR.length; i++) body += kyRow(othR[i], g.kind);
    }
  } else {
    for (i = 0; i < total; i++) body += kyRow(rules[i], g.kind);
  }
  return '<div class="kb-grp' + (folded ? ' fold' : '') + '" data-kg="' + esc(g.key) + '">'
    + '<div class="kb-hd" data-kgh="' + esc(g.key) + '">'
    +   '<span class="kb-hd-t">'
    +     '<span class="kb-hd-n">' + esc(g.title || '') + '</span>'
    +     '<span class="kb-hd-d">' + esc(g.desc || '') + '</span>'
    +   '</span>'
    +   '<span class="kb-hd-c" title="这一包里开着的条数 / 总条数">'
    +     onN + ' / ' + total + '</span>'
    +   kySwitch('data-kgsw', g.key, on,
                 on ? '整个包点一下关掉' : '整个包点一下打开')
    +   '<span class="kb-chev">›</span>'
    + '</div>'
    + '<div class="kb-body">' + body + '</div></div>';
}

/* ⚠️ 2026-10-18（用户：「规则来源，这个选项删掉」）：`kySrcText()` 与界面上那一行
   「规则来源 + 重新读入」按钮一起删了。后端 `/api/keymap-import` 与
   `wb_keymap.py --import` 都还在，需要时从命令行重导即可。 */
function kyEngineHTML(d){
  var en = !!(d.engine && d.engine.enabled);
  return '<section class="grp"><div id="keymap-card">'
    /* ① 总开关 */
    + '<div class="kb-f"><div class="kb-f-t">'
    +   '<span class="kb-f-n">键盘映射<i class="kb-f-g">总开关</i></span>'
    +   '<span class="kb-f-d">按下面这些规则改写按键。关掉它＝监听整个卸掉，'
    +   '键盘立刻回到系统原样；下面那些开关都会留着，下次打开照旧。</span>'
    + '</div>'
    + kySwitch('data-kyeng', '1', en, en ? '点一下关掉键盘映射' : '点一下打开键盘映射')
    + '</div>'
    /* ② 引擎实况（外壳回报的一行人话；由 kyApplyLive 填） */
    + '<div class="kb-f"><div class="kb-f-t">'
    +   '<span class="kb-f-d" id="ky-live"></span>'
    + '</div></div>'
    /* ⚠️ 2026-10-18（用户：「规则来源，这个选项删掉」）：原来这里是 ③ 导入来源
       —— 一行「上次读入 2026-10-01、65 条映射 + 3 条修饰键、6 个包」加一颗
       「重新读入」按钮。整段删掉。
       后端**没删**：`wb_keymap.py --import` 照旧可用；哪天要重新从 Karabiner
       取一份，命令行跑一下就行，不必再占界面一行。 */
    /* ④ 权限引导条（引擎开着且权限被拒时才显形） */
    + '<div class="kb-perm" id="ky-perm" style="display:none">'
    +   '<b>键盘映射还没拿到「辅助功能」权限</b>，所以这会儿按下去还是系统原生那套，'
    +   '开关看不出效果。到「系统设置 → 隐私与安全性 → 设备控制和数据访问」里把'
    +   '「TimeGuardian」勾上（macOS 26 及更早这一栏叫「辅助功能」，是同一栏）。'
    +   '<br><span style="opacity:.72"><b>勾一次就长期有效</b> —— 外壳已改用固定证书签名，'
    +   '以后重编、换图标都不会再让它失效。这里也不挂后台轮询：<b>每次打开这个面板都会实测一次</b>，'
    +   '权限一生效，这条提示自己就消失、键盘映射自己开始工作，不用重启。</span>'
    +   '<br><button data-kyperm="1">打开那一页</button></div>'
    + '</div></section>';
}

function kyCmdXVHTML(d){
  var x = d.commandXV || {};
  var on = !!x.enabled;
  var apps = kyApps(x.targets) || '访达 Finder';
  var min = Math.max(1, Math.round((Number(x.cutTimeoutSec) || 300) / 60));
  return '<div id="cmdxv-card"><div class="kb-f"><div class="kb-f-t">'
    + '<span class="kb-f-n">剪贴＝移动<i class="kb-f-g">Command X-V</i></span>'
    + '<span class="kb-f-d">选中文件按 ⌘X 先记下（这一步等于复制），再到目标文件夹按 ⌘V —— '
    + '就变成系统的「移动到这里」，与 Windows 的剪贴一个手感。记下的东西 '
    + min + ' 分钟内有效；只按 ⌘X 不按 ⌘V 时相当于普通复制。生效范围：'
    + esc(apps) + '。</span>'
    + '</div>'
    + kySwitch('data-kycv', '1', on, on ? '点一下关掉这个功能' : '点一下打开这个功能')
    + '</div></div>';
}

/* ★ 2026-10-18（用户第 2 条）：「在键盘这一栏里面列一个状态栏，点进去能显示现在
   哪些按键被映射，并且列出来哪些是外置键盘的 win 模式下的映射」。
   纯只读：数据全来自 `/api/keymap`（后端已翻成人话），不写任何东西。
   分类依据＝`fromMods`：含 option → Alt 组合；含 control → Ctrl 组合；其余按所属包归堆。 */
/* 判「这一条带的修饰键里有没有某一位」。
   ⚠️ 不能直接 `mods.indexOf('control')`：Karabiner 里同一个修饰键会写成
   `control`（不分左右）或 `left_control` / `right_control`（分左右）两种形态，
   kb-20 就是 `left_control` —— 用精确匹配会把它漏到「其它」里。 */
function kyHasMod(mods, name){
  for (var i = 0; i < (mods || []).length; i++){
    var m = String(mods[i]);
    if (m === name || m === 'left_' + name || m === 'right_' + name) return true;
  }
  return false;
}

function kyOverview(d){
  var gs = d.groups || [];
  var alt = [], ctrl = [], byGroup = {}, total = 0, on = 0, i, j, r, q;
  for (i = 0; i < gs.length; i++){
    var rs = gs[i].rules || [];
    /* ⚠️ 「生效」要连**组开关**一起算：caps 那个包整组关着，包里的 kb-54 虽写着 enabled，
       实际不生效。只按条数会多报一条（界面 51 / 引擎日志 50，用户会看出来对不上）。 */
    var gOn = (gs[i].enabled !== false);
    for (j = 0; j < rs.length; j++){
      r = rs[j]; total++;
      if (!r.enabled || !gOn) continue;
      on++;
      var mods = r.fromMods || [];
      /* ① 只收**编辑键包里的** Alt 组合 —— 也就是「左 Alt + 键 → ⌘ + 键」这 12 条。
         别把 term/sys 包里本来就带 option 的规则（Alt+F4 → ⌘Q、Ctrl+Alt+L 锁屏）
         也算进来：那些不是「Win 模式的 Alt 习惯」，混进去会让人以为它们也是新加的。 */
      if (kyHasMod(mods, 'option') && gs[i].key === 'edit') alt.push(r);
      else if (kyHasMod(mods, 'control') && gs[i].key === 'edit') ctrl.push(r);
      else {
        var gk = gs[i].title || gs[i].key;
        if (!byGroup[gk]) byGroup[gk] = [];
        byGroup[gk].push(r);
      }
    }
  }
  function chips(list){
    if (!list.length) return '<div class="ov-sd">（没有）</div>';
    var h = '<div class="ov-chips">';
    for (var m = 0; m < list.length; m++){
      h += '<span class="ov-chip">' + esc(kyComboCN(list[m].fromMods, list[m].fromKey))
         + ' <b>→</b> ' + esc(kyComboCN(list[m].toMods, list[m].toKey)) + '</span>';
    }
    return h + '</div>';
  }
  var en = !!(d.engine && d.engine.enabled);
  var h = '<div id="ky-ov"' + (KY.ov ? ' class="open"' : '') + '><div class="ov-hd" data-ovh="1"><span class="ov-t">'
    + '<span class="ov-n">映射总览<i class="kb-f-g">点开看明细</i></span>'
    + '<span class="ov-d">共 ' + total + ' 条配置，当前生效 ' + on + ' 条。' + (en ? '' : '⚠️ 总开关关着，下面这些都还没作用。')
    + '点开按来源分类列出每一条被改的键。</span></span>'
    + '<span class="kb-chev">›</span></div><div class="ov-body">';
  /* ① 外接键盘 —— 顺序上放第一，但**内容跟着实际状态走**：
     用户 2026-10-18 已决定把键盘切到 Mac 模式，那 12 条 Alt 组合会被关掉；
     这时还写「Win 模式下发键」就是假话。alt 为空 ⇒ 明说"不需要这一类"。 */
  h += '<div class="ov-sec"><div class="ov-st">① 外接键盘（Alt 组合）</div>'
     + (alt.length
        ? ('<div class="ov-sd">键盘在 <b>Win 模式</b>下发键时，三个修饰键的真实身份是：'
           + '<b>左 Alt = ⌥ Option</b>、<b>右 Alt = ⌘ Command</b>（固件直发）、'
           + '<b>Ctrl = ⌃ Control</b>。下面这些是「左 Alt + 键」被翻成 Command 组合的映射：</div>'
           + chips(alt))
        : ('<div class="ov-sd">当前没有 Alt 组合映射。键盘切到 <b>Mac 模式</b>后，'
           + '<b>左 Alt 就是 ⌥ Option</b>、<b>Win 键就是 ⌘ Command</b>，'
           + '这一类不需要再翻 —— 想要 Command 直接按 Win 键。</div>'))
     + '</div>';
  /* ② Ctrl 组合 */
  h += '<div class="ov-sec"><div class="ov-st">② Ctrl 组合（Windows 习惯）</div>'
     + '<div class="ov-sd">按 Ctrl 做的事，在 macOS 上换成对应的 Command 键。</div>'
     + chips(ctrl) + '</div>';
  /* ③ 其它 */
  h += '<div class="ov-sec"><div class="ov-st">③ 其它</div>';
  var keys = [], kk;
  for (kk in byGroup) if (byGroup.hasOwnProperty(kk)) keys.push(kk);
  if (!keys.length) h += '<div class="ov-sd">（没有）</div>';
  for (i = 0; i < keys.length; i++){
    h += '<div class="ov-sd" style="margin-top:7px"><b>' + esc(keys[i]) + '</b>（'
       + byGroup[keys[i]].length + ' 条）</div>' + chips(byGroup[keys[i]]);
  }
  h += '</div></div></div>';
  return h;
}

function kbHTML(){
  var d = KY.data;
  var h = '';
  /* 录制中的横幅摆在整页最上面 —— 录键时眼睛在键盘上，得有个东西说明「在等什么」 */
  if (KY.cap) h += kyCapHintHTML();
  h += kyEngineHTML(d) + kyOverview(d) + kyCmdXVHTML(d);
  /* ★ 2026-10-18（用户第 3 条「分类 UI 太乱」）：改成**固定的阅读顺序**，不再按后端
     数组顺序摆。理由：最常动的「编辑键」提到第一位；「修饰键映射」是整键翻转、
     且现在全关，摆最后当兜底，免得第一眼就看到一条「把 Alt 当 Command」的旧说明。
     顺序表里没有的包，按后端原序补在后面（以后加包不会消失）。
     ★★ 2026-10-18 晚（用户第 3 条原话）：「浏览器、虚拟机也放到最后，但是不如 Caps Lock
     这个选项靠后，Caps Lock 这个选项是最后面（最下面）」。
     ⇒ 常用三包在前（编辑键 / 中英切换 / 系统键）；只在特定程序里生效的两包垫底；
        Caps Lock 单独压在最末。⚠️ 这张表是**界面顺序的唯一事实源**，
        改这里就够了（后端 GROUPS 同序，配置落盘也按它排）。 */
  var gs = d.groups || [];
  var order = ['edit', 'ime', 'sys', 'term', 'browser', 'caps'], done = {}, oi, gi;
  for (oi = 0; oi < order.length; oi++){
    for (gi = 0; gi < gs.length; gi++){
      if (gs[gi].key !== order[oi] || done[gs[gi].key]) continue;
      done[gs[gi].key] = 1;
      /* ★ Caps Lock 那个包不用通用长相：它只有一个「按下去做什么」的选项（见 kyCapsCard） */
      if (gs[gi].kind === 'caps' && (gs[gi].rules || []).length) h += kyCapsCard(gs[gi]);
      else h += kyGroup(gs[gi]);
    }
  }
  for (gi = 0; gi < gs.length; gi++){
    if (done[gs[gi].key]) continue;
    h += kyGroup(gs[gi]);
  }
  return h;
}

/* ★★ Caps Lock 的设置卡（第卅三轮 · 用户第 4 条：「Caps Lock 好像还需要你加一个设置」）。
   底下仍然只是一条普通规则（`from.key_code = caps_lock` → `to.key_code = 选中的那个`），
   所以**外壳一个字都不用改** —— 引擎本来就认得这条路。
   为什么不给它「按键录制」：这一条的选项只有四个，而且语义特别
   （把大写锁定改成 Ctrl/Esc/Cmd，或者干脆保持原样），拉一排按钮比录键清楚得多。
   ⚠️ 文案里那句「灯可能不跟着变」不是吓唬人：Caps Lock 的**大写锁定状态**是系统在
      更底层切换的，用户态事件监听改的是「这个按键送去哪里」，管不到那盏灯。
      所以要如实说 —— 并给一个 100% 可靠的退路（系统设置里的「修饰键」）。 */
function kyCapsCard(g){
  var it = (g.rules || [])[0] || null;
  var on = !!g.enabled;
  var cur = it ? it.toKey : '';
  var h = '<section class="grp"><div id="capslock-card">'
    + '<div class="kb-f"><div class="kb-f-t">'
    +   '<span class="kb-f-n">Caps Lock<i class="kb-f-g">单独一个开关</i></span>'
    +   '<span class="kb-f-d">' + esc(g.desc || '') + '。'
    +   'Caps Lock 是系统特殊键 —— 改完之后「大写锁定」那盏灯可能不跟着变，'
    +   '请按一下试试手感。要百分之百可靠，仍可用'
    +   '「系统设置 → 键盘 → 键盘快捷键 → 修饰键」那一页直接改。'
    +   '</span>'
    + '</div>'
    + kySwitch('data-kgsw', g.key, on, on ? '点一下关掉 Caps Lock 这条' : '点一下打开 Caps Lock 这条')
    + '</div>';
  if (it){
    h += '<div class="kb-f" style="display:block">'
       +   '<span class="kb-f-n" style="font-size:12px">按 Caps Lock 时</span>'
       +   '<div class="kb-seg">';
    var list = kyCapsChoices(cur);
    for (var i = 0; i < list.length; i++){
      h += '<button type="button" class="kb-seg-b'
         + (String(list[i].key) === String(cur) ? ' sel' : '') + '"'
         + ' data-kycaps="' + esc(list[i].key) + '">' + esc(list[i].text) + '</button>';
    }
    h += '</div></div>';
  }
  h += '</div></section>';
  return h;
}

/* Caps Lock 的选项表。★ 只有一份事实（后端 `CAPS_CHOICES`）；
   当前值不在表里（比如从 Karabiner 导进来一个别的键）时**临时补一块**在最前面，
   绝不静默丢掉 —— 丢了会显示成「一个都不是」，用户会以为设置坏了。 */
function kyCapsChoices(cur){
  var out = [], src = (KY.data && KY.data.capsChoices) || [], i;
  var hit = false;
  for (i = 0; i < src.length; i++){
    out.push(src[i]);
    if (String(src[i].key) === String(cur)) hit = true;
  }
  if (cur && !hit) out.unshift({ key: cur, text: kyKey(cur) + '（现在这个）' });
  return out;
}

/* 内容指纹：只有这几样变了才值得重画（切页来回不闪）。
   ⚠️ 逐条的**开关与键位**不在里面 —— 它们只会被本页自己改，改完那条路径会
      显式把 `KY.shown` 清空。别为了「保险」把整份 data 塞进来：那等于每次轮询
      都比一遍 25KB 的 JSON。 */
function kyRev(d){
  var s = JSON.stringify(d.meta || {});
  s += '#' + ((d.engine && d.engine.enabled) ? 1 : 0);
  var gs = d.groups || [];
  for (var i = 0; i < gs.length; i++) s += '#' + gs[i].key + (gs[i].enabled ? 1 : 0);
  return s;
}

var KY_LOADING = '<section class="grp"><div class="hint">正在读键盘映射…</div></section>';

function paintKeyboard(){
  var el = $('page-keyboard');
  if (!el) return;
  if (KY.data){
    kbPaint();                        /* 有旧数据先画上 —— 切页立刻有东西看 */
  } else {
    el.innerHTML = KY_LOADING;
    KY.shown = '';
  }
  loadKeyboard();                     /* 再拉一次最新的（本地 HTTP，几毫秒） */
}

function loadKeyboard(){
  if (KY.busy) return;
  KY.busy = true;
  api('/api/keymap').then(function(d){
    KY.busy = false;
    if (!d || !d.ok) throw new Error((d && d.error) || '服务端没给数据');
    KY.data = d; KY.shown = ''; kbPaint();
  }).catch(function(e){
    KY.busy = false;
    var el = $('page-keyboard');
    if (el && !KY.data){
      el.innerHTML = '<section class="grp"><div class="hint">读键盘映射失败：'
        + esc(String(e)) + '　—— 切走再切回来，或点顶栏的「刷新状态」。</div></section>';
      KY.shown = '';
    } else {
      toast('读键盘映射失败：' + e, 5000);
    }
  });
}

function kbPaint(){
  var el = $('page-keyboard');
  if (!el || !KY.data) return;
  var rev = kyRev(KY.data);
  if (rev !== KY.shown){
    KY.shown = rev;
    /* ⚠️★ 换 innerHTML 之前**先记下滚动位置**：这一页有 57 行，容器是 `main`
       （`overflow-y:auto`）。整块重画的那一刻子节点先被清空 → 内容高度瞬时归零
       → 滚动容器把 `scrollTop` 夹到 0，之后再填回内容也**不会**自己复原。
       症状＝「在列表底下点一下开关，页面自己跳回最上面」。所以必须自己记、自己放回。 */
    var sc = $('main');
    var keep = sc ? sc.scrollTop : 0;
    el.innerHTML = kbHTML();
    bindKeyboard(el);
    if (sc) sc.scrollTop = keep;
  }
  kyApplyLive(KY.data.live);
}

/* 折叠：只切 class，**不重画**（重画会闪，还会把用户刚点开的包又收回去）。
   ★ 记的是「哪些被点开了」—— 默认全收起，点一下置 true 并展开，再点一下收回。 */
function kyFold(k){
  KY.open[k] = !KY.open[k];
  var box = document.querySelector('#page-keyboard .kb-grp[data-kg="' + k + '"]');
  if (box) box.classList.toggle('fold', !KY.open[k]);
}

function kyFindGroup(k){
  if (!KY.data) return null;
  var gs = KY.data.groups || [];
  for (var i = 0; i < gs.length; i++) if (gs[i].key === k) return gs[i];
  return null;
}

function kyFindItem(id){
  if (!KY.data) return null;
  var gs = KY.data.groups || [];
  for (var j = 0; j < gs.length; j++){
    var rs = gs[j].rules || [];
    for (var k = 0; k < rs.length; k++) if (rs[k].id === id) return rs[k];
  }
  return null;
}

/* 这条属于修饰键那一组，还是属于某个功能包 —— 打补丁的**外层字段不一样**。 */
function kyPatchOf(id, part){
  var p = { id: id };
  for (var k in part) if (part.hasOwnProperty(k)) p[k] = part[k];
  if (!KY.data) return {};
  var gs = KY.data.groups || [];
  for (var j = 0; j < gs.length; j++){
    var rs = gs[j].rules || [];
    for (var q = 0; q < rs.length; q++){
      if (rs[q].id === id) return { groups: [{ key: gs[j].key, rules: [p] }] };
    }
  }
  return {};
}

/* 回一小段补丁。成功＝服务端回**全量**，直接换掉本地那份再重画（真值只有一份）。 */
function kySend(part){
  api('/api/keymap', { method:'POST', headers:{ 'Content-Type':'application/json' },
                       body: JSON.stringify(part) })
    .then(function(r){
      if (r && r.ok){ KY.data = r; KY.shown = ''; kbPaint(); }
      else {
        toast('保存键盘映射失败：' + ((r && r.error) || '未知原因'), 5000);
        KY.shown = ''; loadKeyboard();      /* 拉回真值，别让界面停在乐观态 */
      }
    })
    .catch(function(e){
      toast('保存键盘映射失败：' + e, 5000);
      KY.shown = ''; loadKeyboard();
    });
}

/* 外壳回报的实况（进页一次 + 3 秒轮询）。⚠️ 只动文字与那条权限提示，**不重画**。 */
function kyApplyLive(live){
  if (!live) return;
  if ('perm' in live)   KY.perm   = live.perm;
  if ('engine' in live) KY.engine = live.engine;
  if ('text' in live)   KY.text   = live.text || '';
  var en = !!(KY.data && KY.data.engine && KY.data.engine.enabled);
  var pm = $('ky-perm');
  /* ⚠️ perm === null ＝「外壳没跑，还不知道」——**不能**当 false 用，
     那会在外壳没启动时冤枉地喊「缺权限」（鼠标那页踩过同一个坑）。 */
  if (pm) pm.style.display = (en && KY.perm === false) ? '' : 'none';
  var lv = $('ky-live');
  if (!lv) return;
  if (!en){
    lv.textContent = '总开关关着 —— 按键按系统原本的方式走。';
  } else if (KY.text){
    lv.textContent = KY.text;
  } else if (KY.engine === null){
    lv.textContent = '外壳没在跑，读不到引擎实况（配置还在，只是这会儿没人执行它）。';
  } else {
    lv.textContent = '引擎状态：' + (KY.engine ? '在跑' : '没跑');
  }
}

/* ================= 按键录制（第卅三轮） =================
   ★★ 用户第 3 条原话：「对于其他可以修改按键的 应该是那种在键盘上按映射来选择按键的
      方式 不要让我用列表来指定按键」。
   ⇒ 点一下那个胶囊 → 出现「正在录键」横幅 → **直接在键盘上按**出新的组合。

   ⚠️ 有三处必须自己顶着，否则会录出「半截」的键、或录到根本不该录的东西：

   ① **纯修饰键先来一步**。按 `Ctrl+V` 时浏览器送两个 keydown：
      `ControlLeft`（此刻已带 ctrlKey）→ `KeyV`。若在第一个就收工，
      录下来的是「左 Ctrl」而不是「Ctrl+V」。
      → 收到纯修饰键时**不立刻提交**，挂 550ms 闹钟；期间来了普通键就作废闹钟，
        它自己松手（keyup）则立刻认定「它就是要录的那个键」。
   ② **修饰键不能当修饰键用**。`mod-1`（左 Alt → 左 Cmd）与「中英切换」那几条，
      它们的 `from` **本身就是修饰键** —— 走 ① 那条「松手即提交」的路，修饰键表留空。
   ③ **原来带修饰键的，新键也得带**。否则会把那个裸键本身劫走
      （把 `Ctrl+V` 改成 `V` ＝ 以后单按 V 就是粘贴），几乎肯定不是本意。
      → 拦下来提示一句，录制态**留着**让他重按。
*/
function kyCapClear(){
  if (KY.capT){ clearTimeout(KY.capT); KY.capT = null; }
}
function kyStartCap(id){
  if (KY.cap === id){ kyCancelCap(); return; }    /* 再点同一行＝取消 */
  kyCapClear();
  KY.cap = id; KY.capMod = '';
  KY.shown = ''; kbPaint();                       /* 强制重画：录制态要立刻显形 */
}
function kyCancelCap(){
  if (!KY.cap) return;
  kyCapClear();
  KY.cap = ''; KY.capMod = '';
  KY.shown = ''; kbPaint();
}
function kyCapHintHTML(){
  /* ⚠️ 这里**不能**用后端下发的 `it.label`：那串是老方向（`Ctrl+L → Cmd+L`），
     跟行上现在印的「默认 Cmd+L → Ctrl+L」正好反着 —— 同一屏里两种方向，
     比不写还糟。所以照行上的画法自己拼一遍（跟 kyRow 同一套函数）。 */
  var it = kyFindItem(KY.cap);
  var what = '';
  if (it){
    what = it.alone
      ? ('单击 ' + kyComboCN(it.fromMods, it.fromKey) + ' → ' + kyAloneText(it))
      : ('默认 ' + kyComboCN(it.toMods, it.toKey) + ' → '
         + kyComboCN(it.fromMods, it.fromKey));
  }
  return '<div class="kb-caphint"><span>正在录键：直接按一下你要用的键'
    + '（要组合键就一起按，例如 <b>Ctrl + V</b>）。'
    + (what ? '　正在改：<b>' + esc(what) + '</b>' : '')
    + '</span><button type="button" data-kycapx="1">取消（Esc）</button></div>';
}
/* 提交一个录到的组合。code＝浏览器的 event.code，mods＝['control', …] */
function kyCapCommit(code, mods){
  var id = KY.cap;
  if (!id) return;
  var it = kyFindItem(id);
  if (!it){ kyCancelCap(); return; }
  var key = KY_CODE[code];
  if (!key){                     /* 表里没有的键：不提交，录制态留着让他重按 */
    toast('这个键本程序还不认得（' + code + '），换一个试试', 3500);
    return;
  }
  var hadMods = (it.fromMods || []).length > 0;
  if (hadMods && !mods.length && !kyIsModKey(key)){
    toast('这一条原来带着 Ctrl / Alt 这类修饰键，请连修饰键一起按', 4000);
    return;
  }
  kyCapClear();
  KY.cap = ''; KY.capMod = '';
  it.fromKey = key; it.fromMods = mods.slice();   /* 本地先记上，免得上屏还是旧的 */
  kySend(kyPatchOf(id, { fromKey: key, fromMods: mods.slice() }));
}

/* 全局监听只挂一次（bindKeyboard 每次重画都会调一遍，所以要有这道开关） */
var KY_BOUND = false;
function kyBindGlobal(){
  if (KY_BOUND) return;
  KY_BOUND = true;
  /* ⚠️ 走**捕获阶段**：页面上别的 keydown 监听抢先时，只有捕获阶段拦得住 */
  document.addEventListener('keydown', kyOnKey, true);
  document.addEventListener('keyup',  kyOnKeyUp, true);
}
function kyOnKey(e){
  if (!KY.cap) return;
  var code = e.code || '';
  var pure = KY_PUREMOD.test(code);
  if (e.key === 'Escape' && !pure){        /* Esc＝取消录制 */
    e.preventDefault(); e.stopPropagation();
    kyCancelCap();
    return;
  }
  e.preventDefault(); e.stopPropagation();
  if (pure){                               /* ① 纯修饰键：先不提交，等等看有没有下一个键 */
    KY.capMod = code;
    kyCapClear();
    KY.capT = setTimeout(function(){
      KY.capT = null;
      var c = KY.capMod; KY.capMod = '';
      if (c) kyCapCommit(c, []);
    }, CAP_WAIT);
    return;
  }
  kyCapClear(); KY.capMod = '';
  var mods = [];
  if (e.ctrlKey)  mods.push('control');
  if (e.altKey)   mods.push('option');
  if (e.metaKey)  mods.push('command');
  if (e.shiftKey) mods.push('shift');
  kyCapCommit(code, mods);
}
function kyOnKeyUp(e){
  if (!KY.cap || !KY.capMod) return;
  if ((e.code || '') !== KY.capMod) return;
  /* 松手时别的修饰键都没按着 → 它自己就是要录的那个键（② 走这条） */
  if (e.ctrlKey || e.altKey || e.metaKey || e.shiftKey) return;
  e.preventDefault(); e.stopPropagation();
  kyCapClear();
  var c = KY.capMod; KY.capMod = '';
  kyCapCommit(c, []);
}

function bindKeyboard(root){
  kyBindGlobal();
  /* ① 总开关。★ 不做乐观翻转：真值是「外壳里的事件监听到底挂上没有」，
        只有外壳知道 —— 先置忙、等服务端回来按真值重画（与「开机自启」同一个理由）。 */
  var eb = root.querySelector('[data-kyeng]');
  if (eb) eb.onclick = function(){
    if (!KY.data) return;
    var want = !(KY.data.engine && KY.data.engine.enabled);
    eb.disabled = true;
    kySend({ engine: { enabled: want } });
  };
  /* ② Command X-V 那一个开关（用户点名：它**不要**键位选择器）*/
  var cb = root.querySelector('[data-kycv]');
  if (cb) cb.onclick = function(){
    if (!KY.data) return;
    var want = !(KY.data.commandXV && KY.data.commandXV.enabled);
    cb.disabled = true;
    kySend({ commandXV: { enabled: want } });
  };
  /* ②b 映射总览（2026-10-18 新增）：点标题展开/收起。**只切 class，不重画** ——
        与折叠功能包同一个理由（重画会把用户刚展开的包又收回去）。 */
  var ovh = root.querySelector('[data-ovh]');
  if (ovh) ovh.onclick = function(){
    KY.ov = !KY.ov;
    var box = root.querySelector('#ky-ov');
    if (box) box.classList.toggle('open', !!KY.ov);
  };
  /* ③ 功能包：点组头折叠/展开。⚠️ 组头那颗开关要**让路** —— 否则点开关会顺带折叠 */
  Array.prototype.forEach.call(root.querySelectorAll('[data-kgh]'), function(h){
    h.onclick = function(e){
      var t = e.target;
      if (t && t.closest && t.closest('.sw-l')) return;
      kyFold(h.getAttribute('data-kgh'));
    };
  });
  Array.prototype.forEach.call(root.querySelectorAll('[data-kgsw]'), function(b){
    b.onclick = function(){
      var k = b.getAttribute('data-kgsw');
      var g = kyFindGroup(k);
      if (!g) return;
      var want = !g.enabled;
      g.enabled = want;                  /* 本地先记上，防止连点时发反 */
      b.disabled = true;
      kySend({ groups: [{ key: k, enabled: want }] });
    };
  });
  /* ④ 逐条：开关 */
  Array.prototype.forEach.call(root.querySelectorAll('[data-kysw]'), function(b){
    b.onclick = function(){
      var it = kyFindItem(b.getAttribute('data-kysw'));
      if (!it) return;
      var want = !it.enabled;
      it.enabled = want;
      b.disabled = true;
      kySend(kyPatchOf(it.id, { enabled: want }));
    };
  });
  /* ④b 逐条：「恢复默认」—— 不用按键，后端把触发键抄回默认值并停用这一条 */
  Array.prototype.forEach.call(root.querySelectorAll('[data-kyrst]'), function(b){
    b.onclick = function(){
      var it = kyFindItem(b.getAttribute('data-kyrst'));
      if (!it) return;
      b.disabled = true;
      kySend(kyPatchOf(it.id, { resetDefault: true }));
    };
  });
  /* ⑤ 逐条：按键录制。点一下进录制态 → 在键盘上按出新组合（逻辑见上面 kyOnKey） */
  Array.prototype.forEach.call(root.querySelectorAll('[data-kycap]'), function(b){
    b.onclick = function(){ kyStartCap(b.getAttribute('data-kycap')); };
  });
  /* ⑤b 录制横幅上的「取消」（Esc 也能取消，见 kyOnKey） */
  var kx = root.querySelector('[data-kycapx]');
  if (kx) kx.onclick = kyCancelCap;
  /* ⑤c Caps Lock 的「按下去做什么」—— 一排按钮，不是录制 */
  Array.prototype.forEach.call(root.querySelectorAll('[data-kycaps]'), function(b){
    b.onclick = function(){
      var g = kyFindGroup('caps');
      var it = g && (g.rules || [])[0];
      if (!it) return;
      var want = b.getAttribute('data-kycaps');
      if (String(it.toKey) === String(want)) return;
      it.toKey = want;                 /* 本地先记上，防止连点时发反 */
      b.disabled = true;
      kySend(kyPatchOf(it.id, { toKey: want }));
    };
  });
  /* ⑥ 权限引导条 */
  var pb = root.querySelector('#ky-perm button');
  if (pb) pb.onclick = function(){
    api('/api/keymap-perm', { method:'POST' }).then(function(r){
      if (r && r.ok) toast('已经翻了那一页（macOS 27 里叫「设备控制和数据访问」）；勾上后不用重启，这条提示会自己消失');
      else toast('打不开系统设置：' + ((r && r.error) || '未知原因'), 5000);
    }).catch(function(e){ toast('打不开系统设置：' + e, 5000); });
  };

        后端 `/api/keymap-import` 仍然在，命令行 `wb_keymap.py --import` 照旧能用。 */
}

function card(it){
  var cls = 'item' + (it.risky ? ' risky' : '')
          + (it.mode === 'view' ? ' view' : (it.mode === 'term' ? ' term' : ''));
  /* ★★ 2026-10-01（第卅轮 · 用户原话）：「前面的这个序号不要有绿色的和黑色的，都统一颜色，

     整块去掉了；「开下一层」那几行改用**行尾的浅灰 ›**（.chev），不再是一块彩色底。
     ⚠️ 提交**一律用 it.key**（菜单唯一键，如 local3）—— 序号本来就不参与提交：
        编号重排后每个板块都从 1 开始，只发一个数字服务端分不清是哪个板块的。
     ⚠️ `data-seq` 属性**留着**（不可见）：自动化脚本靠它认出「这是哪一号」，
        但它不再上屏。别因为它还在，就把徽标加回来。 */
  /* ★★ 2026-09-29：三种徽标 / 说明各代表走法不同（用户第 7 条之后只剩两种）：
       mode='view' → 点开是一个独立面板（在界面里，不开终端）
       mode='term' → 会另开终端窗口（现在没有这种卡片了，但保留写法）
       mode='inline' → 内嵌跑，结果走「执行日志」 */
  var flag = '';
  if (it.risky){
    flag += '<span class="warn">会改数据</span>';
  }
  if (it.mode === 'view'){
    flag += '<span class="warn" style="color:#3f8c3c;'
          + 'border-color:#c9dfc6;background:#eaf3e8">'
          + '点开是一个面板</span>';
  } else if (it.mode === 'term'){
    flag += '<span class="warn" style="color:#6b5a3e;'
          + 'border-color:#e0cfa4;background:#f5efe1">'
          + '要另开窗口操作</span>';
  }
  /* ★★ 2026-09-29（用户第 3 条）：描述行（sub / hint）**不画在卡片上**，
     收进右上角那个 ⓘ —— 点它才展开（showHelp）。见 showHelp 的注释。 */
  /* ★ 2026-09-29（用户第 11 条）：卡片右侧留一个运行指示槽（默认隐藏）——
     点卡片跑长任务时进度显示在这里。view/term 卡不开任务，不给槽。 */
  var rs = (it.mode === 'view' || it.mode === 'term')
         ? '' : '<span class="runstat" data-rs="1"></span>';
  return '<button class="' + cls + '" data-key="' + esc(it.key == null ? '' : it.key) + '"'
    + (it.n != null ? ' data-seq="' + esc(it.n) + '"' : '') + '>'
    + '<i class="info" data-help="' + esc(it.key == null ? '' : it.key) + '">!</i>'
    + '<span class="b">'
    + '<span class="nm">' + esc(it.name) + flag + '</span>'
    + '</span>' + rs + '</button>';
}

function bindCards(root){
  Array.prototype.forEach.call(root.querySelectorAll('.item'), function(b){
    /* ★★★ 2026-10-05（对齐 Win 端 · 用户第 7 条）：两样都没有的行**不接线**。

       于是 #ovl 里**所有**视图的 .item 都会被扫到 —— 而其中有些行只是展示用
       （既没有 data-view 也没有 data-key）。原样扫下去会给它们绑上
       `run({key: undefined})`：点一下就是一次「空 key」的后端请求，
       而后端只会回一句「不认识」。宁可让它安静地不可点，也不要发这种请求。 */
    if (!b.dataset.view && !b.dataset.key) return;
    b.onclick = function(e){
      /* ★★ 2026-09-29（用户第 3 条）：卡片右上角那个 ⓘ 只开帮助，**不执行**。

      var t = e.target;
      if (t && t.classList && t.classList.contains('info')){
        e.preventDefault();
        e.stopPropagation();
        /* ★★★ 2026-10-05（对齐 Win 端）：.item 上的 ⓘ 现在有**两个取数口**：
             · data-help="<菜单键>" → /api/menu 下发的 HELP（菜单里真有的卡片走这条）；
             · data-tb="<界面键>"   → 本文件里的 TB_HELP（**不是菜单项**的行走这条，
                                      如今就一张：「任务与工作空间」——它没有菜单键）。
           先认 data-tb：那种元素上压根没有 data-help，认错了会静默不出任何提示。 */
        if (t.dataset && t.dataset.tb){ showTbHelp(t.dataset.tb); }
        else { showHelp(t.dataset.help); }
        return;
      }
      /* ★★ 2026-09-30（第廿七轮）：任务页里「开下一层」的那几行（同步 / 空间回收 /
         更多工具…）也用的是 .item —— 它们没有 data-key，只有 data-view。
         **先认 view 再认 key**：否则会把空 key 发给后端（那会走成一次莫名其妙的任务）。 */
      if (b.dataset.view){ openView(b.dataset.view); return; }
      // 一律回传唯一键（普通项如 local1；快捷项如 f）—— 后端 do_run 认 key。
      run({ key: b.dataset.key });
    };
  });
}

function showHelp(key){
  var d = HELP[key];
  if (!d) return;
  $('h-title').textContent = d.name || d.title || key;
  $('h-group').textContent = d.group || '';
  var h = '';
  // ① 一句话说明（原来卡片上那行描述）

  // ② 界面专用补充（原来卡片上第二行）
  if (d.hint) h += '<p>' + esc(d.hint) + '</p>';
  // ③ 详细展开（比卡片上长，用户要求「写得更详细一些」）
  if (d.help) h += '<p>' + d.help + '</p>';
  if (d.script) h += '<p><code>' + esc(d.script) + '</code></p>';
  $('h-body').innerHTML = h || '<p>（暂无说明）</p>';
  $('hovl').classList.add('show');
}

function showTbHelp(k){
  var d = TB_HELP[k];
  if (!d) return;
  $('h-title').textContent = d[0];
  $('h-group').textContent = '界面按钮';
  $('h-body').innerHTML = '<p>' + d[1] + '</p>';
  $('hovl').classList.add('show');
}

  $('h-title').textContent = title || '说明';
  $('h-group').textContent = '';
  var p = document.createElement('p');
  p.textContent = text || '';
  /* ★ 2026-10-05（对齐 Win 端）：ⓘ 里装的是**成段的说明**（好几条、带换行），

/* ---------------- 执行进度条 ----------------
   只认「步骤标记」：wb_onekey.py（0 号一键整合）每步开头会打一行

       >>> [i/N] 分组 · 线名

   有这种标记才显示进度条；别的卡片没有步骤概念，这条 strip 不出现、输出面板
   独占整个高度，和以前一样。

   为什么放在前端解析、而不是后端算好一个 progress 字段：
     · 标记本来就在输出流里，前端顺手就能读，后端一行都不用改；
     · 后端多存一份进度就得同步改 /api/job，两边一旦漂移更难查；
     · _ui.html 是静态文件，改完刷新页面就生效，不必重启界面服务。
   改 wb_onekey.py 的标记格式时，记得同步改这里的 PROG_RE。 */
var PROG_RE = /^\s*>>>\s*\[(\d+)\/(\d+)\]\s*(.+)$/;
var STEP_END_RE = /^\s*[✓✗]/;          // 步骤判决行（wb_sync_ctl 打 "    ✓ 完成"）

/* 某一步长时间没动静时，补一句「它在干嘛、大概还要多久」。
   用户原话就是「我总是等好半天」—— 四线里跨机任务线最慢（要把 30 多个会话
   导出成一个约 180MB 的共享文件），单它一条就占掉整轮的 ~40 秒。
   数字来自实测（2026-09-26，见 _sessync.log 的「已写出共享文件…179.6 MB」）；
   量级会随会话数变化，所以文案只说「通常 30~60 秒」，不承诺精确值。 */
var SLOW_STEP_HINT = {
  '跨机任务线': '这一步要把 30 多个会话导出成一个约 180MB 的共享文件，'
          + '通常要 30～60 秒 —— 不是卡住了，秒表在走。'
};
var SLOW_AFTER = 15;                   // 跑够这么多秒才提示，避免一闪就出

function progressNote(name, elapsed){
  var hit = '';
  for (var k in SLOW_STEP_HINT){
    if (name.indexOf(k) >= 0){ hit = SLOW_STEP_HINT[k]; break; }
  }
  if (!hit) return '';
  if (elapsed >= SLOW_AFTER) return hit;
  return '（这一步通常最慢，稍等）';
}

function resetProgress(){
  $('prog').style.display = 'none';
  $('prog').className = '';
  $('pr-fill').style.width = '0';
  $('pr-note').style.display = 'none';
  $('pr-note').textContent = '';
}

/* ★ 2026-09-29（用户第 11 条）：步骤解析从 renderProgress 里抽出来 ——
   右侧面板的大进度条和卡片右侧的小指示条都靠它，两处不能各写一份。 */
function parseProg(out){
  if (out.indexOf('>>> [') < 0){
    return { seen:false, i:0, n:0, name:'', curDone:false };
  }
  var lines = out.split('\n'), i = 0, n = 0, name = '', seen = false, curDone = false;
  for (var k = 0; k < lines.length; k++){
    // 行尾先删干净再匹配：正常情况下后端用 universal_newlines 收输出，
    // \r\n 已被归一成 \n；但万一哪条链路上留了 \r，`.+$` 会整行匹配不上
    // —— 那进度条就永远「无步骤标记」，而且看不出为什么。
    var ln = lines[k].replace(/\s+$/, '');
    var m = PROG_RE.exec(ln);
    if (m){
      i = +m[1]; n = +m[2]; name = m[3]; seen = true; curDone = false;
    } else if (seen && STEP_END_RE.test(ln)){
      curDone = true;                     // 当前这一步已经有结果（✓ 或 ✗）
    }
  }
  return { seen:seen, i:i, n:n, name:name, curDone:curDone };
}

function renderProgress(j){
  var pr = parseProg(j.out || '');
  if (!pr.seen){                          // 这一条没有步骤信息 → 不显示进度条
    resetProgress();
    return;
  }
  var i = pr.i, n = pr.n, name = pr.name;

  var finished = (j.state === 'done');
  var done = (i - 1) + (pr.curDone ? 1 : 0);
  if (finished) done = n;
  var pct = n ? Math.round(done * 100 / n) : 0;
  pct = Math.max(0, Math.min(100, pct));

  $('prog').style.display = '';
  $('prog').className = finished ? (j.rc === 0 ? 'done' : 'bad') : '';
  if (finished){
    $('pr-step').textContent = '共 ' + n + ' 步';
    $('pr-name').textContent = (j.rc === 0) ? '全部完成' : '已结束 · 有失败项';
  } else {
    $('pr-step').textContent = '第 ' + i + '/' + n + ' 步';
    $('pr-name').textContent = name + (pr.curDone ? '（本步已完成）' : '（进行中…）');
  }
  $('pr-pct').textContent = pct + '%' + (j.elapsed ? ' · ' + j.elapsed + 's' : '');
  $('pr-fill').style.width = pct + '%';

  // 慢步骤的说明（只在还没跑完时给）
  var note = finished ? '' : progressNote(name, j.elapsed || 0);
  $('pr-note').style.display = note ? '' : 'none';
  $('pr-note').textContent = note;
}

/* 每条任务一个轮询（JOB_POLLS[id] = interval），互不干扰。
   同一个 id 重复调 startPoll 不会叠 interval。 */
function startPoll(id, key){
  if (JOB_POLLS[id]) return;
  JOB_POLLS[id] = setInterval(function(){ pollJob(id, key); }, 600);
  pollJob(id, key);
}
function stopPoll(id){
  if (JOB_POLLS[id]){ clearInterval(JOB_POLLS[id]); delete JOB_POLLS[id]; }
}

     （`OUT_DOT = 'new'`）—— 用户看到的就是"弹一下"。
     ⚠️ `CUR_JOB` 也必须**不设**：pollJob 里 `if (CUR_JOB === id)` 每 600ms 会把
        `#job-out` 整个重写一遍，设了它反而更吵（而且会跟真正在看的那条任务抢屏）。

        就挂在 `pollJob` 的 done 分支上。 */
  if (!quiet){
  CUR_JOB = id;
  /* ★★ 2026-09-29（用户第 7 条：「点击按钮自动打开右边的终端界面也不要了」）：
     这里原来第一句是 panelOpen(true) —— 点任何卡片都会把右边那块屏幕顶出来。
     现在**不自动开**，只更新它的内容；要看日志自己按「状态与设置 · 快捷入口」的「执行日志」。
     ⚠️ 但 job 仍然要记录、仍要轮询：结果与退出码是「完成 / 失败」提示的来源。
     所以下面这些改状态的语句一条都不能少，只是不再让它显示出来。 */
  $('empty').style.display = 'none';

function pollJob(id, key){
  api('/api/job?id=' + encodeURIComponent(id)).then(function(j){
    if (j.error){ stopPoll(id); return; }
    /* 右侧输出面板只跟随「最新点的那条」（CUR_JOB）—— 多任务并发时别的任务不抢屏 */
    if (CUR_JOB === id){
      var near = $('job-out').scrollHeight - $('job-out').scrollTop
               - $('job-out').clientHeight < 60;
      $('job-out').textContent = j.out || '';
      if (near) $('job-out').scrollTop = $('job-out').scrollHeight;
      renderProgress(j);
      $('job-title').textContent = '[' + j.num + '] ' + j.desc;
      if (j.state !== 'done'){
        $('job-state').textContent = '运行中 · ' + j.elapsed + 's';
      }
    }
    /* ★★ 卡片右侧的运行指示：每个任务各自更新（2026-09-29 用户第 11 条） */
    if (key && RUN_JOBS[key] && RUN_JOBS[key].id === id){
      var st = RUN_JOBS[key];
      st.elapsed = j.elapsed;
      if (j.state === 'done'){
        var ok = (j.rc === 0);
        st.state = ok ? 'ok' : 'bad';
        var prDone = parseProg(j.out || '');
        if (prDone.seen) st.pct = 100;
        st.label = ok ? ('✓ 完成 · ' + j.elapsed + 's')
                      : ('✗ 失败 · 退出码 ' + j.rc);
        paintRun(key);
        /* ✓ 停 6 秒、✗ 停 12 秒（失败多留会儿让人看清），然后自己消失。
           ⚠️ 期间用户可能又点了同一张卡（起了新任务）—— 只清**自己这条**。 */
        if (st.timer) clearTimeout(st.timer);
        st.timer = setTimeout(function(){
          if (RUN_JOBS[key] && RUN_JOBS[key].id === id){
            delete RUN_JOBS[key];
            paintRun(key);
          }
        }, ok ? 6000 : 12000);
      } else {
        var pr = parseProg(j.out || '');
        if (pr.seen){
          var done = (pr.i - 1) + (pr.curDone ? 1 : 0);
          var pct = pr.n ? Math.round(done * 100 / pr.n) : 0;
          st.pct = Math.max(0, Math.min(100, pct));
          st.label = '第 ' + pr.i + '/' + pr.n + ' 步 · ' + st.pct + '%';
        } else {
          st.pct = null;
          st.label = '运行中 · ' + Math.round(j.elapsed) + 's';
        }
        paintRun(key);
      }
    }
    if (j.state === 'done'){
      stopPoll(id);
      var ok2 = (j.rc === 0);
      if (CUR_JOB === id){
        CUR_JOB = null;
        $('job-state').className = 'st ' + (ok2 ? 'st-ok' : 'st-bad');
        $('job-state').textContent = ok2 ? ('完成 · ' + j.elapsed + 's')
                                          : ('退出码 ' + j.rc + ' · ' + j.elapsed + 's');
        $('btn-stop').style.display = 'none';
      }
      /* ★ 结果必须让人看见（面板不再自动展开了）：
           成功 → 一声 done + 一条绿色提示；失败 → 提示里给出「执行日志」。 */
      /* ★ 第 20 条：结果音一律只用 done，失败不出声 ——
         原来失败借用「点击音」，与按下那一声同音 → 听感就是「响两声」。 */
      /* ★★ 第 21 条：3 秒内跑完的操作**安静收场**（不弹提示、不出结果音）——
         否则那一声与按下那一声凑成「点一下、响两声」（用户 2026-09-30 报的正是这个）。
         失败照旧提示（带「执行日志」去处），只是不出声。 */
      var quiet = ok2 && doneQuiet(j.elapsed);
      if (ok2 && !quiet) snd('done');
      if (!ASIDE_OPEN){
        OUT_DOT = ok2 ? '' : 'fail';
        paintOut();
      }
      if (!quiet){
        toast(ok2 ? ('✓ ' + j.desc + ' 完成（' + j.elapsed + 's）')
                 : ('✗ ' + j.desc + ' 失败（退出码 ' + j.rc + '）—— 「状态与设置 · 快捷入口」里有「执行日志」'),
              ok2 ? 2600 : 6000);
      }
      /* ★★★ 2026-10-01（第五十三轮 · 用户「反应的时间能不能加速一下」）：
         任务已经跑完 ⇒ 服务端一定落过盘 ⇒ 这一拉回来的**必然是新真值**，
         绝不该再被那 3 秒「在途挡板」挡回去（那正是"慢半拍"的最后一环）。
         先撤掉这一 key 的挡板再拉 —— 反应时间从 3 秒降到 ≈ 任务本身的耗时。

         ★★★ 2026-10-11（自 Win 端补 · 用户：「点快了就弹一下 UI 又弹回去」）：
         **给开关串行器让一步** —— 先问 `swDone()`「还差不差」：
           · 返回 false（到目标了 / 不是开关 / 这趟失败）→ 照旧撤挡板 + 拉真值；
           · 返回 true（还有待补发的开关命令正在发出）→ **这一轮先别撤挡板、
             也别拉真值**。因为此刻后端只落了一部分意图，拉回来的"真值"是**中间态**，
             拿它重画就等于把用户刚点的乐观值打回去 —— 那正是"弹一下"的来源。
             最后一趟 done 时会自然收尾。 */
      if (!swDone(key, ok2)){
        pwRelease(key);
        loadStatus();
      }
    }
  }).catch(function(){ /* 服务可能正好在重启，忽略一次 */ });
}

/* ★★ 2026-09-29（用户第 11 条）：窗口重载后恢复卡片上的运行指示。
   前端内存里的 RUN_JOBS 随页面一起没了，但任务还在后端跑着 ——
   /api/status 每 3 秒顺路带回 running 的任务清单（wb_ui.py::running_jobs_snapshot），
   在这里按界面键（key）对回卡片、把轮询续上。
   ⚠️ 只认 key 非空的 job（tool_ 开头 / toggle_ 开头那些短任务没有专属卡片，跳过即可）。 */
function resumeJobs(list){
  if (!list || !list.length) return;
  var resumed = false;
  list.forEach(function(j){
    var key = j.key || '';
    if (!key) return;
    var st = RUN_JOBS[key];
    if (st && st.id === j.id) return;            // 已经在跟了
    if (st && st.id) stopPoll(st.id);            // 卡上记的是旧 job → 换新
    RUN_JOBS[key] = { id:j.id, state:'run',
                      t0: Date.now() - (j.elapsed || 0) * 1000,
                      pct:null, label:'运行中 · ' + Math.round(j.elapsed || 0) + 's',
                      name: j.desc || cardRunName(key) };
    paintRun(key);
    startPoll(j.id, key);
    if (!resumed){ resumed = true; if (!CUR_JOB) watchJob(j.id, key); }
  });
}

var SND_TICK = false;   /* ★ 第 20 条：一次事件派发内只许响一次（见 snd） */

var SND_POOL = 2;

function sndLoad(kind, s){

  a.preload = 'auto';

function sndPreload(){

function rrow(k, v, lv, mono){
  return '<div class="row"><span class="k">' + esc(k) + '</span>'
    + '<span class="v' + (mono ? ' mono' : '') + (lv ? ' lv-' + lv : '') + '">'
    + (lv ? lvdot(lv) : '') + esc(v == null ? '' : String(v)) + '</span></div>';
}
