/* ---------------------------------------------------------- 视图内的事件委托
   ⚠️ 只挂一次（在 #ovl 上）。视图重读只换 innerHTML，不重新挂 —— 否则每读一次
     就多一层监听，点一下会触发 N 次（这类 bug 很难看出来）。 */
function bindView(){
  /* ★★ 2026-09-30（第廿七轮 · 用户第 4 条）：这一套 data-act 委托原来**只挂在 #ovl**
     （整屏视图）上。设置页搬进首页第 4 个分页之后，它在视图**之外** ——
     同一个委托收不到它，症状是「音效开关 / 开机自启 / 编号菜单 / 执行日志」
     在分页里点了毫无反应（而且不报任何错，最难查）。
     所以：同一个处理函数，挂**两个根** —— #ovl 与 #page-settings。
     ⚠️ 处理函数里必须用 `e.currentTarget` 取根（两个根共用一份），别再闭包捕获 root。 */
  var handle = function(e){
    var root = e.currentTarget;
    var el = e.target;
    while (el && el !== root && !el.getAttribute('data-act')) el = el.parentNode;
    if (!el || el === root) return;
    var act = el.getAttribute('data-act'), v = el.getAttribute('data-v');
    if (el.tagName === 'BUTTON' && el.hasAttribute('disabled')) return;
    switch (act){
      case 'close':      closeView(); break;
      /* ★★★ 2026-10-05（对齐 Win 端 · 用户第 5 条）：右下角那颗「返回上一级菜单」。
         栈里有就退回上一层；栈空等价于回主菜单（两级出口都给到）。 */
      case 'back':       viewBack(); break;
      /* ★★★ 2026-10-05（对齐 Win 端）：「本机 · 任务折叠」那一层三颗按钮。 */
      /* ★★★ 2026-10-05（用户第 4 条）：界面里那两颗「感叹号」。
         用户原话：「如果不是短的工作描述…全都换成这种感叹号的形式，
         缩进说明里，不要占用 UI 界面很大的空间」。
           · note-tip：底部那行小字右边的 ⓘ（长说明收在里面）
           · view-tip：大标题右边那颗 ⓘ（统计数字 + 本层要交代的规矩）
         两者都复用既有的 showTipText 浮层 —— 不另造一层弹窗。 */
      case 'note-tip':   showTipText($('ovl-title').textContent || '说明',
                                     NOTE_TIP); break;
      case 'view-tip':   showTipText($('ovl-title').textContent || '说明',
                                     VIEW_HINT); break;

      /* ★★★ 2026-10-05（用户第 1、2、3、4 条）：任务与工作空间 / 本机 · 任务折叠。
         这些动作全部落在 #ovl 里（同步 → 任务与工作空间…），所以走这一份委托。
         ⚠️ fd-run / fd-force / fd-refresh 三颗上面（7130 行附近）已经有过一轮了 ——
            它们随「本机 · 任务折叠」那一层先落地的；这里不再重复登记
            （同一个 switch 里写两遍不报错，但第二遍永远走不到，是纯噪音）。 */
      case 'run':        run({ key: v }); break;
      case 'snd-on':
        SND_ON = !SND_ON; sndPaint(); sndSave();
        if (SND_ON) snd('click');
        renderSettings();               // ★ 就地重画（音效状态是本地的，别回捞）
        break;
      case 'snd-set':
        SND_SET = String(v); sndSave(); snd('click');
        renderSettings();
        break;
      case 'copy-env': {
        /* ★ 廿七轮：设置页现在可能画在**分页**里（那时 #ovl-body 里留着的是上次视图的内容）——
           所以复制「当前真正显示的那一份」，别去读那个可能过期的节点。 */
        var chost = settingsHost() || $('ovl-body');
        var t = chost ? chost.innerText : '';
        if (navigator.clipboard) navigator.clipboard.writeText(t);
        toast('已复制（粘到报错说明里最有用）');
        break;
      }
      /* ★ 2026-09-29（用户第 9 条）：从顶栏挪进「状态与设置 · 快捷入口」的两颗。
         ⚠️ 走委托（不是 onclick 绑定）—— renderSettings() 每次换 innerHTML，
            onclick 绑上去的监听会随旧节点一起被丢掉，点了没反应。 */
      /* ★★ 2026-09-30（用户第 2 条）：开机自启。
         ⚠️ 与音效开关不同：**不做乐观翻转**。这个开关的真值是「磁盘上那份
            LaunchAgent 在不在」，只有服务端知道；先把按钮置忙，等服务端回来
            按真值重画。失败也重画（回到真值），不顺着一厢情愿显示。 */
      case 'auto-start': {
        var want = !AS.on;
        el.disabled = true;
        var nEl = el.querySelector('.n');
        if (nEl) nEl.textContent = want ? '正在打开…' : '正在关闭…';
        api('/api/autostart', { method:'POST',
            headers:{ 'Content-Type':'application/json' },
            body: JSON.stringify({ on: want }), timeout: 25000 })
          .then(function(r){
            asApply(r && r.autostart);
            AS.warn = (r && r.warn) || '';
            renderSettings();
            if (AS.warn) toast(AS.warn, 8000);
            else toast(AS.on ? '✓ 已打开：下次登录会自动运行'
                             : '✓ 已关闭：不再自动运行', 3200);
          })
          .catch(function(e){ renderSettings(); toast('设置失败：' + e, 5000); });
        break;
      }
      case 'auto-silent': {
        var ws = !AS.silent;
        el.disabled = true;
        api('/api/autostart', { method:'POST',
            headers:{ 'Content-Type':'application/json' },
            body: JSON.stringify({ silent: ws }), timeout: 25000 })
          .then(function(r){
            asApply(r && r.autostart);
            AS.warn = (r && r.warn) || '';
            renderSettings();
            toast(ws ? '✓ 已设为静默启动（不弹主界面）' : '✓ 已设为登录时弹出主界面', 3200);
          })
          .catch(function(e){ renderSettings(); toast('设置失败：' + e, 5000); });
        break;
      }
      case 'term-menu':  actTermMenu(); break;
      case 'open-out':   actOpenOut();  break;
    }
  };
  /* 同一个处理函数挂**两个根**：整屏视图 + 设置分页（理由见函数开头）。 */
  $('ovl').addEventListener('click', handle);
  var ps = $('page-settings');
  if (ps) ps.addEventListener('click', handle);
}

   ★ 只重画清单那一块（mgListPaint），**不**重画整个视图：

/* ---------------------------------------------------------- 启动 */
/* ★★ 2026-09-29 晚：让窗口**自己发现界面已经换过**（用户第 2 条引出的坑）。
   窗口里的页面是「开窗那一刻」加载的 —— 外壳只在首次 load 时才取页面
   （WBShell.swift::showWindowEnsuringService），所以改了 _ui.html 之后，
   用户不关窗重开就永远看着旧界面（踩过：用户截图指着一颗**早就删掉**的按钮
   问「这个按钮也不需要存在了」）。
   服务端在 /api/status 与 /api/menu 里带回两个指纹：
     · uiVer   = _ui.html 的指纹   → 变了整页 reload（连本页 JS 一起换新）
     · menuVer = wb_menu.py 的指纹 → 变了只重拉一次 /api/menu（板块名/编号变了）
   基线 = 打开后**第一次**收到的值，所以刚打开时绝不会误触发。 */
var UI_VER0 = null, MENU_VER0 = null, VER_RELOADING = 0;
function checkVer(d){
  if (!d || VER_RELOADING) return;
  if (d.uiVer){
    if (UI_VER0 === null) UI_VER0 = d.uiVer;
    else if (d.uiVer !== UI_VER0){ UI_VER0 = d.uiVer; VER_RELOADING = 1; location.reload(); return; }
  }
  if (d.menuVer){
    if (MENU_VER0 === null) MENU_VER0 = d.menuVer;
    else if (d.menuVer !== MENU_VER0){ MENU_VER0 = d.menuVer; loadMenu(); }
  }
}

function loadStatus(){
  /* ★ 2026-09-30（第廿八轮）：**返回 Promise** —— 面板上屏前那一步
     （`window.__panelPrepare`）要等「这一拉画完」再量高度。以前是 fire-and-forget，
     外面拿不到"画完了没有"这个信号。 */
  return api('/api/status').then(function(d){
    /* ★ 2026-09-29（用户第 18 条）：留一份**最新结果的副本**。
       用途只有一个 —— 面板「睁眼」时（外壳一弹面板就调 __panelWake）先把这份画上去，
       让用户看到「立刻就在的内容」，随后那次真值刷新只负责纠正。
       别拿它当缓存去省请求：面板睡着的那些小时里状态是会变的。 */
    PANEL_LAST = d;
    /* ★★ 第廿八轮：真值到手了 → 面板现在报出来的高度才是可信的
       （在这之前 #panhead 还空着，量到的残缺值会把窗口摆成半截）。 */
    PANEL_H_ARMED = true;
    /* ★ checkVer 现在读**整包**（后端已在 /api/status 顶层带 uiVer/menuVer）——
       之前只读 d.status，那里面没有版本号 → 菜单一旦失败，「页面过期自动刷新」
       也跟着死（用户窗口卡死的事故之一）。 */
    checkVer(d);
    renderStatus(d);
    /* ★★ 2026-09-30（用户第 2 条）：首页「鼠标」板块的三个值跟着这条轮询走

               已拖到外框 12px 之外（真拖到别的控件上）→ 取消；

var WB_PRESS = null, WB_SLOP = 12;
var WB_SEL = 'button, a, .item, .tab, [data-act], [data-key], [data-num]';
var WB_ATTRS = ['data-act','data-v','data-line','data-open','data-page','data-key','data-num','data-nm','data-qa','data-sc'];
function wbSpec(el){
  if (el.id) return {id: el.id};
  var parts = [];
  WB_ATTRS.forEach(function(a){
    var v = el.getAttribute && el.getAttribute(a);
    if (v != null) parts.push(a + '="' + String(v).replace(/"/g, '\\"') + '"');
  });
  if (!parts.length) return null;
  return {sel: el.tagName.toLowerCase() + '[' + parts.join('][') + ']'};

function wbFind(sp){
  try{
    if (!sp) return null;
    if (sp.id) return document.getElementById(sp.id);
    var list = document.querySelectorAll(sp.sel);
    return list.length === 1 ? list[0] : null;   /* 认出多颗就当认不出，别点错东西 */
  }catch(e){ return null; }
}
/* 抬手点是否仍在「这颗元素的外框 ±WB_SLOP」之内 —— 鼠标抖几像素不算滑走，
   真拖到别的控件上（外框外更远）才取消。 */
function wbNear(el, x, y){
  if (!el || !el.getBoundingClientRect) return false;
  var r = el.getBoundingClientRect();

    var hit = t.closest(WB_SEL);
    if (!hit || hit.disabled) return;

  }, true);
  document.addEventListener('pointerup', function(e){
    var p = WB_PRESS; WB_PRESS = null;
    if (!p || e.button !== 0) return;
    if (p.el.isConnected && p.el.contains(e.target)) return;     /* 正常 click 会来 */
    var el = p.el.isConnected ? p.el : wbFind(p.spec);

    if (!wbNear(el, e.clientX, e.clientY)) return;               /* 拖走了，不算点 */

    // ★ 六修：原来这里写「点任一档位或重开『跑完自动关机』」—— 把人往档位上引，
    //   可「跑完自动关机」本来就与档位无关（shutdown_decision 完全不看 level）。
    //   而且 shutdown_set(on) 内部就会 start_daemon()，所以「关一下再打开」才是正解。
    el.innerHTML = ICO_PW + '已开 · 守护未启动';
    return;
  }
  // ⑤ （已删除）原来这里有一相：「本次启动后还没判定过一次『任务在跑』，不会触发关机
  //    （跑个任务即激活）」。2026-09-27 六修按用户要求**去掉 ever_busy 门槛**：
  //    用户原话「不要用跑个任务激活」——「现在有没有在跑」已经由 WorkBuddy 自己的
  //    会话状态实时给准了，不需要再靠「历史上忙过」来兜底。开关打开后只等
  //    idleConfirmSec（**2026-10-11 起它的语义是「结束去抖」**）就会往下走，那一相取消。
  var total = (p.activityWindowSec || 0) + (p.idleConfirmSec || 0) + (p.shutdownDelaySec || 0);
  // ★ 2026-10-10：「关机前整理中」那一相已删（关机前整合属任务管家，已从本程序移除）。
  // ⑥ 忙相：**任务在跑时不要显示任何倒计时**（用户 2026-09-27 明确：
  //   「我这个任务还在跑着呢，他怎么就开始倒计时了？应该是任务停了之后才开始倒计时」）。
  //   上一版在这儿放了「还差 N 秒 判定停手」—— 技术上它只是「距离判定为停手还有多久」，
  //   可摆在「任务在跑」旁边，任何人都会读成「关机倒计时已经启动了」。
  //   这句剩余时间现在只留在悬停说明里（服务端仍在下发 busyEtaAt），
  //   灯面上任务在跑就是纯状态：一动不动。
  if (running){
    el.className = 'sd-chip on';
    /* ★ 2026-10-01（第五十一轮 · 用户第 4 条）：灯面上点名「WorkBuddy」。
       用户原话：「现在 workbuddy 正在运行，打开跑完自动关机，界面不显示
       workbuddy 正在运行」。原来这里只写「已开 · 正在运行」—— 三个字太泛，
       旁边又是「跑完自动关机」，读不出「是谁在跑」，也就读不出「所以现在
       不会关机」这层意思。另外面板里这一相（`.on`）原本被 CSS 整个藏掉
       （见 body.panel #sd-chip 那条），也一并放出来了。 */
    el.innerHTML = ICO_PW + '已开 · ' + busySrcLabel(p);
    return;
  }
  // ⑦ 不忙：只剩「还差多少秒真关机」这一个数在走 ——
  //   左边一律是状态（不动），右边才是倒计时（用户 2026-09-27 明确要求）。
  // ★★ 八修：这里原是个**两段式**说明（「还差 N 秒进入 30 秒关机倒计时」），
  //   读起来要脑补两步；而且它把 activityWindowSec **又加了一遍** ——
  //   可 lastBusyAt 本身已经把活动窗口算进去了（忙一直被 file 撑到窗口结束），
  //   于是那个数比真关机时刻多出整整一个活动窗口。
  //   现在直接给真答案：关机发生在 lastBusyAt + idleConfirmSec + shutdownDelaySec。
  var remain = (p.lastBusyAt || 0) + (p.idleConfirmSec || 0)
             + (p.shutdownDelaySec || 30) - now;
  el.className = 'sd-chip wait';
  el.innerHTML = remain > 0
    ? ICO_PW + '已开 · AI 已停止运行，<span class="n">' + fmtDown(remain) + '</span>后关机'
    : ICO_PW + '已开 · AI 已停止运行，正在关机…';
}
/* ══════════════════════════════════════════════════════════════════════════
   ★★★ 2026-10-01（自检轮 · 用户第 1 条「不要一直轮巡监测」）
   这两盏灯原来各挂一条**常驻** 250ms 定时器：
       setInterval(tickShutdown, 250);      // 「跑完自动关机」那盏
       setInterval(tickAutoStop, 250);      // 「到点自动结束」那行剩余时间
   一秒各醒 4 次、彼此独立 —— 而页面上大多数时候**根本没有倒计时要走**
   （没开自动关机、没设到点结束），纯属空转。现在合成**一条按需的**：
     · `clocksShouldRun()` 从当前数据判断「屏幕上到底有没有正在走的倒计时」；
     · 有 → 开一条 250ms 的钟；没有 → 立刻停掉，**空闲时零唤醒**；
     · 数据每次刷新（renderPower 末尾）都重新判一次，状态一变就跟上。
   走秒的基准仍是服务端下发的绝对时间戳（见两个 tick 函数里的 now 计算），
   所以停/开之间不会有累积误差 —— 这部分逻辑一行没动。
   ══════════════════════════════════════════════════════════════════════════ */
var CLOCK_TICK = null;
function clocksShouldRun(){
  var p = window.__pw;
  if (!p || p.error) return false;
  // ① 关机灯真要「走秒」的两种情形：已经在关机倒计时里（秒数往下掉）；
  //    或「跑完自动关机」开着、守护在跑、而当前**没在忙** → 会显示「还差 N 秒」。
  if (p.shutdownPending) return true;
  if (p.autoShutdown && p.enabled && p.alive && p.now && !p.busy) return true;
  //   ★ 2026-10-11：第三态「未知」时灯面上那句「已 X」也是活的 → 同样要走秒。
  if (p.enabled && p.alive && p.now && ((p.lastSignals || {}).unknown)) return true;
  // ② 「到点自动结束」有剩余时间要走秒（判据与 tickAutoStop 一致：还要求防休眠开着）。
  if (p.now && Number(p.autoStopAt) > 0 && awakeOn(p)) return true;
  return false;
}
function clocksPump(){ tickShutdown(); tickAutoStop(); }
function clocksWake(){
  var need = clocksShouldRun();
  if (need && !CLOCK_TICK){
    CLOCK_TICK = setInterval(clocksPump, 250);
    clocksPump();                       // 马上画一帧，别等 250ms
  } else if (!need && CLOCK_TICK){
    clearInterval(CLOCK_TICK);          // 没倒计时了 → 立刻停，别空转
    CLOCK_TICK = null;
  }
}
function clocksStop(){
  if (CLOCK_TICK){ clearInterval(CLOCK_TICK); CLOCK_TICK = null; }
}

/* ★ 2026-09-30（用户第 3 条）：「到点自动结束」的剩余时间显示成「X 分 Y 秒」——
   原来只给秒数（`fmtDown`），4 小时的档位会出现「14399 秒」这种读不出量级的数。
   ⚠️ 只换这一处；**关机倒计时仍走 `fmtDown`（纯秒）**，那是另一盏灯的事。 */
function fmtMS(sec){
  var s = Math.max(0, Math.ceil(sec));
  var m = Math.floor(s / 60);
  s -= m * 60;
  return m > 0 ? (m + ' 分 ' + s + ' 秒') : (s + ' 秒');
}
/* ★★★ 2026-10-02（第六十五轮 · 用户第 3 条）：倒计时走**同一套翻牌器**（与 durRead 同构）。
   格式固定 `H:MM` —— 3 张卡 + 1 个冒号，**格数恒定** ⇒ 读数宽度不随剩余时间伸缩
   （多一位就会撑宽读数器、把滑块轨道挤得来回动，那是第廿四轮踩过的老病）。
   最大档 4 小时 ⇒ 小时位永远一位；负值（已过点）夹到 0。
   ⚠️ 刻意**不显示秒**：秒要第四张卡，宽度就守不住了。要精确到秒看悬停提示（title）。 */
function cdRead(sec){
  var s = Math.max(0, Math.ceil(sec));
  var hh = Math.floor(s / 3600), mm = Math.floor((s % 3600) / 60);
  if (hh > 9) hh = 9;                            /* 兜底：越界也画得下（界面最长档 4 小时） */
  var t = hh + (mm < 10 ? ':0' : ':') + mm;      /* '0:04' / '3:59' */
  return '<span class="rd">'
       + '<b class="rd-c">' + t.charAt(0) + '</b>'
       + '<i class="rd-s">:</i>'
       + '<b class="rd-c">' + t.charAt(2) + '</b>'
       + '<b class="rd-c">' + t.charAt(3) + '</b>'
       + '</span>';
}

/* 画右侧那颗读数器 —— **只有这一个函数写 `#sld-dur-v`**（免得几处打架）。
   两态二选一：
     · 值守中（挂着到点结束 + 防休眠开着 + 没在拖滑块）→ **倒计时**（暖色数字）
     · 其余                                          → **档位时长**（原样）
   ★ 为什么必须由它统一决策：3 秒一次的整卡重画会把读数器重建一遍 ——
     要是「重画时画档位、走秒时画倒计时」，两边就会来回抢 ⇒ 读数每隔几秒闪一下。
     所以重画路径（renderPower 末尾）与走秒路径（tickAutoStop）都只调这一个函数。
   本地走秒的原理同 tickShutdown：基准 = 服务端下发的绝对时间戳 now，
   3 秒一次的轮询只负责刷新基准，不负责走秒。 */
function paintAutoStopRead(){
  var vv = $('sld-dur-v'), sq = $('sld-dur');
  if (!vv || !sq) return;              // 滑块那块没画出来（旧后端 / 退路分支）→ 跳过
  var i = Math.max(0, Math.min(AS_INF, Number(sq.value) || 0));
  sq.style.setProperty('--p', (i / AS_INF) * 100 + '%');   // 轨道填充：永远跟着滑块位置
  var p = window.__pw;
  /* ★ 2026-09-30（用户：「关了防休眠就不该再计时」）：**没在值守就没有倒计时**。
     两个条件同时成立才显示：挂着到点结束 且 防休眠总开关开着。 */
  var running = !!p && !p.error && (p.autoStopAt > 0) && awakeOn(p);
  if (running && !SLD_DRAGGING){
    var now = (p.now || 0) + (Date.now() - (window.__pwAt || Date.now())) / 1000;
    var remain = p.autoStopAt - now;
    var html = cdRead(remain);
    /* 钟是 250ms 一次，而读数一分钟才变一格 ⇒ 比对一下再写，别空转着重排 DOM。 */
    if (vv.getAttribute('data-cd') !== html){
      vv.innerHTML = html;
      vv.setAttribute('data-cd', html);
    }
    vv.classList.add('cd');
    vv.classList.toggle('cd-soon', remain > 0 && remain <= 60);   // 最后一分钟：呼吸提示
    vv.title = remain > 0 ? ('还剩 ' + fmtMS(remain) + '后自动结束')
                          : '即将自动结束…';
    return;
  }
  /* 切回档位：内容 + title + 去掉倒计时配色。
     ★ 必须**无条件**写内容（不能只在「刚才是倒计时」时才写）——用户在拖动滑块时，
       `SLD_DRAGGING` 为真 ⇒ 每动一格都从这里过，读数要跟着手走。 */
  vv.innerHTML = durRead(AS_STEPS[i]);
  vv.title = AS_NAMES[i];
  vv.classList.remove('cd');
  vv.classList.remove('cd-soon');
  vv.removeAttribute('data-cd');
}

/* 走秒入口（clocksPump 每 250ms 一次，**只在真有倒计时时才跑** —— 见 clocksShouldRun）。 */
function tickAutoStop(){ paintAutoStopRead(); }
/* ★ 原来是 `setInterval(tickAutoStop, 250)` —— 已并入上面那条**按需**的钟
   （见 clocksShouldRun / clocksWake），没倒计时时一次都不跑。 */

/* ★★ 2026-09-29（用户第 18 条）：**面板页不挂这条全局轮询**。
   面板现在是在外壳启动时**预载**好的（不预载的话，每次点图标都要重载整页 = 那一下卡），
   而它 99% 的时间是收着的 —— 挂着这条就是白白多烧一份电（主窗口那份才是该常在的）。
   面板的轮询由外壳在弹/收时开关：见 jsPanelBoot 后面的 __panelWake / __panelSleep。

   ★★★ 2026-10-01（第四十七轮 · 用户第 3 条）：主窗口这一条**再加一层条件** ——
   改成**跟着可见性走**：
     · 窗口最小化 / 被完全遮住 / 切到别的 Space 时，`document.hidden` 为真，
       3 秒轮询**整个停掉**（连那两盏倒计时的钟也一起停）；
     · 一回到可见，**立刻拉一次**（不用干等下一个 3 秒），再把轮询挂回去。
   `visibilitychange` 是 WebKit 的**内核事件**，不是轮询 —— 用它来开关，
   等于「有人在看才刷」。窗口被外壳 orderOut（关了主窗口）时同样一个请求都不发。
   ⚠️ 门禁 `_chk_mac_ui.py` 里那条「面板页不挂全局 3 秒轮询」已同步改成
      「主窗口这条接了 visibilitychange」，两处必须同进同退。 */
/* ★★★ 第四十八轮：主窗口这一条也改成**事件驱动**（同面板，见上面 EVT_SRC 那段）。
   两层条件：
     · 第一层（本轮）：有事件才刷 —— 60 秒那条只是保险丝；
     · 第二层（上一轮）：**跟着可见性走** —— 窗口最小化 / 被遮住 / 切到别的 Space 时，
       `document.hidden` 为真，**连 SSE 连接一起断掉**（连心跳都不收发），
       一回到可见立刻重连 + 拉一次。
   `visibilitychange` 是 WebKit 的内核事件，不是轮询。 */
var MAIN_TICK = null;              // 主窗口的**兜底**轮询句柄（60 秒；不可见时是 null）
function mainPollOn(){
  if (IS_PANEL || MAIN_TICK) return;
  sseOn();                                  // ★ 主路径：有事才推
  MAIN_TICK = setInterval(loadStatus, 60000);   // ★ 兜底：最多晚 1 分钟自愈
}
function mainPollOff(){
  sseOff();                        // 看不见就不占着连接
  if (MAIN_TICK){ clearInterval(MAIN_TICK); MAIN_TICK = null; }
  clocksStop();                    // 看不见的时候，倒计时那两盏钟也一起停
}
if (!IS_PANEL){
  mainPollOn();
  document.addEventListener('visibilitychange', function(){
    if (document.hidden) mainPollOff();
    else { loadStatus(); mainPollOn(); }      // 回来立刻拉一次，不等那 3 秒
  });
}
</script>
