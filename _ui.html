<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TimeGuardian</title>
<!-- 窗口/任务栏图标：由本服务在 /favicon.ico 上喂同一个 .ico（= 桌面快捷方式的黄色图标）。
     不写这两行，Edge 的 --app= 窗口就会退回它自带的「地球」占位图。
     ★ 但 favicon 这条路只到 16×16（2026-09-26 受控实测）：Chromium 拿它当页面图标，
       Windows 再把这个 16px 拉到任务栏的 ~30px，所以光靠这两行，图标一定是糊的。
       真正让任务栏变清晰的是 wb_ui.py 的 _apply_window_icon()：窗口建好之后补一次
       WM_SETICON，换成 .ico 里的原生高清档（对比实测见该函数注释）。
       .ico 由 _gen_icon.py 从 _assets/icon-source.ico 映射生成，那边有完整说明。
     ★ ?v= 是给 favicon 缓存用的：.ico 内容换过就把它 +1，否则浏览器可能还认旧的。 -->
<link rel="icon" href="/favicon.ico?v=9" sizes="16x16 20x20 24x24 28x28 32x32 40x40 48x48 64x64 96x96 128x128 256x256">
<link rel="shortcut icon" href="/favicon.ico?v=9">
<style>
/* ============================================================================
   WorkBuddy 任务管家 · 界面样式
   ★★ 2026-09-29：整站换成 PommeToys 的米白配色（对它窗口截屏实测采样）。
      · 它**通篇不用蓝色** —— 强调一律「深色块 + 大圆角」，所以我们也不再用蓝；
      · 字体用它的 Instrument Sans（SIL OFL，可自由嵌入），中文回退苹方；
      · 按钮照它：浅色大圆角 + 一道浅描边 + 右上角一个小圆点。
   ⚠️ 改本文件只改「长相」，**不要动选择器名** —— JS/HTML 全靠它们。
   ============================================================================ */
@font-face{
  font-family:"Instrument Sans";
  src:url("/fonts/InstrumentSans.ttf") format("truetype");
  font-weight:100 900; font-style:normal; font-display:swap;
}
:root{
  /* —— PommeToys 实测色板 —— */
  --bg:#f4f0e7;        /* 主背景：米白 */
  --panel:#efeae0;     /* 顶栏 / 侧栏 / 底部条 */
  --card:#faf7f1;      /* 卡片（比背景略亮一档） */
  --card2:#ffffff;     /* hover / 高亮卡 */
  --line:#e6e1d6;      /* 常规描边 */
  --line2:#d8d2c4;     /* hover 描边 */
  --tx:#1b1916;        /* 主文字：暖黑 */
  --mu:#9b958a;        /* 次文字：暖灰 */
  --ac:#1b1916;        /* 强调（= 深色，不再用蓝） */
  --dark:#1b1916;      /* 深色信息卡 */
  --dtx:#f4f0e7;       /* 深色卡上的字 */
  --dmu:#8a857c;       /* 深色卡上的次文字 */
  --ok:#76d173; --warn:#dfa83c; --err:#ec6765; --off:#b6b0a4;
  --r:16px; --r2:11px;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace;
  --sans:"Instrument Sans",-apple-system,BlinkMacSystemFont,"PingFang SC",
         "Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--tx);overflow:hidden;
  font:14px/1.6 var(--sans);display:flex;flex-direction:column;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:#ded8ca;border-radius:6px;
  border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#c9c2b2;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* ---------------- 顶栏 ---------------- */
header{
  display:flex;align-items:center;gap:9px;padding:10px 16px;
  background:var(--bg);border-bottom:1px solid var(--line);flex:none;
}
/* ★ 2026-09-30（第廿四轮 · 用户第 3 条「把图标画得更有立体感一些」）：
   logo 做出**厚度**——斜向渐变当打光，顶部一道内高光、底部压暗，再落一层投影；
   字母改暖金（照 PommeToys 那点金色调），在深底上像微微发亮。 */
.logo{
  width:32px;height:32px;border-radius:10px;flex:none;
  background:linear-gradient(150deg,#38322a 0%,#221e19 55%,#131110 100%);
  color:#e9cf90;text-shadow:0 1px 0 rgba(0,0,0,.65), 0 0 12px rgba(233,207,144,.28);
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:12.5px;letter-spacing:.5px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.20),
             inset 0 -2px 5px rgba(0,0,0,.55),
             0 2px 6px rgba(27,25,22,.30);
}
h1{font-size:14.5px;margin:0;font-weight:650;letter-spacing:.1px}
/* ★ 2026-09-29（用户第 3 条）：副标题「点击执行 · 不用记编号」这类描述性文字全删。
   这里保留类名（HTML 里还有那个节点），只让它不显示。 */
.sub{display:none}
header .grow{flex:1}
.tbtn{
  padding:7px 13px;border-radius:var(--r2);border:1px solid var(--line);
  background:var(--card);color:var(--tx);font-size:12.5px;font-weight:500;
  transition:.14s;white-space:nowrap;
}
.tbtn:hover{background:var(--card2);border-color:var(--line2);transform:translateY(-1px)}
.tbtn:active{transform:translateY(1px) scale(.975)}   /* ★ 按下＝下陷，别写 translateY(0) */
.tbtn.danger:hover{color:var(--err);border-color:#e8b6b0}

/* ---------------- 分页（任务 / 监测 / 鼠标 / 设置）----------------
   ★★ 2026-09-30（第廿七轮 · 用户第 2 条）：用户原话「就像 POMMETOYS 分为窗口、滚动、
      系统、通用四个页面」。原来首页是**一条直筒**（几组铺开 + 几个按钮开第二层界面），
      现在改成**四个分页**：
        · 任务 —— 原来铺在首页的那几张卡 + 底部那排按钮，全部收成一列入口；
        · 监测 —— 运行监测那张常驻黑卡（原来铺在首页中间的就是它）；
        · 鼠标 —— 平滑滚动 / 反转方向 / 速度那一节；
        · 设置 —— 原来右上角「状态与设置」整屏视图里的全部内容（那颗按钮已删）。
   · 分页条放在**状态板下面**：板是「一眼看全」的屏，分页是「去哪一页」的门。
   · 五格等宽（grid 1fr × 5）—— 图标/文字长短不影响宽度，这也顺带满足了
     用户第 5 条「上下对齐」的诉求。
     ★★ 2026-10-01（第卅二轮）：4 格 → **5 格**（新增「键盘」，插在「鼠标」与
        「设置」之间）。因为窗口是**定尺 617px**，5 格每格约 110px —— 还在
        「两个字 + 左右 padding」的舒适区内，不必缩字号。
   · 选中态用「白卡 + 细描边 + 一点投影」，照 PommeToys 的分段控件。 */
.ptabs{
  display:flex;gap:4px;
  margin:0 16px;padding:4px;border-radius:12px;flex:none;
  background:#e8e2d4;border:1px solid var(--line);
}
.ptab{
  flex:1 1 0;min-width:0;
  padding:7px 4px;border-radius:9px;background:transparent;
  border:1px solid transparent;color:var(--mu);
  font-size:12.5px;font-weight:600;transition:.15s;
}
.ptab:hover{color:var(--tx)}
.ptab:active{transform:scale(.972)}
.ptab.on{
  background:var(--card);color:var(--tx);border-color:var(--line);
  box-shadow:0 1px 2px rgba(40,36,30,.10);
}
/* 五个分页各自一屏；同一时刻只挂 .on 的那一屏可见。
   ⚠️ 用 display 切换（不是 visibility/opacity）—— 隐藏的那四屏不参与布局，
      #power-card 的滑块量宽度时才量得准（量的就是它真正显示时的宽度）。 */
.page{display:none}
.page.on{display:block}

/* 任务页那一列入口（五个：部署和修复 / 一键整合 / 同步 / 空间回收 / 更多工具…）
   ★ 刻意做成**同一副骨架**：徽标 + 名字 +（右边一个角标）——
     宽高一致、左边对齐，不像原来那样三种形态混在一起。
   · 能跑的（部署和修复 / 一键整合）右边是 ⓘ 与运行指示，点一下就跑；
   · 能开下一层的（同步 / 空间回收 / 更多工具）右边是 ›，点一下开整屏视图。 */
.trow{
  display:flex;align-items:center;gap:10px;width:100%;
  padding:11px 13px;margin-bottom:8px;border-radius:14px;text-align:left;
  background:var(--card);border:1px solid var(--line);transition:.15s;
}
.trow:hover{background:var(--card2);border-color:var(--line2);transform:translateY(-1px)}
.trow:active{transform:translateY(1px) scale(.985)}
.trow .n{
  flex:none;width:22px;height:22px;border-radius:7px;background:var(--tx);
  color:var(--bg);font-size:11.5px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
}
.trow .nm{flex:1;min-width:0;font-size:13.5px;font-weight:600;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .chev{flex:none;opacity:.4;font-size:16px;line-height:1}
.trow:hover .chev{opacity:.85}

/* ---------------- 状态条 ---------------- */
/* ★★ 2026-09-30（第廿四轮 · 用户第 4 条）——顶部「状态板」：一块屏幕
   ------------------------------------------------------------------
   用户原话：「对于这些状态类的显示，可以专门在最上面放一个框，单独把状态内容框起来，
   可以做独立的 ui 图标设计，区别于可以点按的图标，而且绿色还是其他颜色的显示灯
   都统一放到文字最前面。我说的这个框也类似 POMMETOYS，好像在最上面放一个屏幕一样，
   显示实时状态内容。」
   → 首页那排散落的浅色胶囊（.chip）整块换成一块**深色屏**：
     · 外框：深底 + 顶部一道内高光 + 落地阴影 → 有厚度的一块屏，不是平铺色块；
     · 每一项 = `● 图标 名称　值`，**灯一律排在最前面**（统一，不再有前有后）；
     · 灯自带同色光晕 —— 暗底上像真的指示灯，而不是一个色点；
     · 图标是**指示型**的（细线、不可点），与下面那些可按的按钮图标刻意不同族。
   ⚠️ `.chip` 那套**保留**：菜单栏面板（#panhead）是浅底的，仍用它。
   ⚠️ 灯色仍由 `.lv-*` 决定（.lv-ok/.lv-warn/.lv-err），值文字的上色规则照旧，
      所以 renderStatus 那一侧的语义一个字没改。 */
#statusbar{
  padding:9px 16px 10px;background:var(--bg);
  border-bottom:1px solid var(--line);flex:none;
}
.board{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  gap:7px 8px;padding:11px 13px;border-radius:16px;
  background:linear-gradient(#27241f,#1b1916);
  border:1px solid #100f0d;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.11),
             inset 0 -1px 0 rgba(0,0,0,.5),
             0 2px 8px rgba(27,25,22,.20);
}
/* ★★ 2026-09-30（第廿七轮 · 用户第 5 条）：状态板从 flex-wrap 改成**网格**。
   用户原话：「上面显示的这些状态……可以把他调整的更有规律一点，不要像好多大小不一的
   按钮堆叠在一起一样，尽量把每个状态上下对齐……字数少一些，比如『切号同步单份任务』」。
   做法三条：
     · 板 = 两列等宽网格 → 上下两行天然对齐（flex-wrap 会参差）；
     · 每格内部再用网格：灯 / 图标 / **名称（固定 72px）** / 值 ——
       名称列宽固定，值就从同一条竖线起头，一眼扫下去是齐的；
     · 值只放**短值**（后端 /api/status 另发一个 `short`，完整原文挂 title 悬停可见）。
   ⚠️ 名称列宽 72px 是量出来的：最长那个是「WorkBuddy」（拉丁 9 字符 ≈ 61px）。 */
.bd{
  display:grid;grid-template-columns:auto auto 72px minmax(0,1fr);
  align-items:center;column-gap:6px;min-width:0;
  padding:5px 11px 5px 9px;border-radius:11px;
  background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.085);
  font-size:12.5px;color:var(--dtx);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.045);
}
/* 跨两列的那一格：四条同步线并排一行（四个名字长短不一，塞不进半格）。 */
.bd.all{grid-column:1 / -1;display:flex;flex-wrap:wrap;align-items:center;
  column-gap:15px;row-gap:5px}
.bd.all .k{color:var(--dmu)}
.bd .k{color:var(--dmu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bd .v{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;font-weight:550;color:var(--dtx)}
/* 四条同步线各自那一个「● 名字」小片（在 .bd.all 那一格里并排）。 */
.ln{display:flex;align-items:center;gap:5px;font-weight:550;color:var(--dtx)}
.ln.lv-ok   .dot{background:var(--ok);box-shadow:0 0 7px rgba(118,209,115,.85)}
.ln.lv-warn .dot{background:var(--warn);box-shadow:0 0 7px rgba(223,168,60,.8)}
.ln.lv-err  .dot{background:var(--err);box-shadow:0 0 7px rgba(236,103,101,.8)}
.ln.lv-off  .dot{background:#5c6675}
/* 灯：暗底上带一层同色光晕，像点亮的小灯 */
.bd.lv-ok   .dot{background:var(--ok);box-shadow:0 0 7px rgba(118,209,115,.85)}
.bd.lv-warn .dot{background:var(--warn);box-shadow:0 0 7px rgba(223,168,60,.8)}
.bd.lv-err  .dot{background:var(--err);box-shadow:0 0 7px rgba(236,103,101,.8)}
.bd.lv-ok   .v{color:#8fe08c}
.bd.lv-warn .v{color:#e8bd66}
.bd.lv-err  .v{color:#f39b98}
.bd.lv-info .v{color:var(--dtx)}
.bd.lv-off  .v{color:var(--dmu)}
/* 指示型图标：细线、半透明、**不可点** —— 与可按的按钮图标刻意不同族 */
.ic{width:14px;height:14px;flex:none;opacity:.6}
.bd.lv-ok .ic{opacity:.78;color:#a9e6a6}
.bd.lv-warn .ic{opacity:.78;color:#e8bd66}
/* 可按按钮上的图标（.ic.btn-ic）：实、亮、贴字。
   「立体感」在这里靠 drop-shadow 造浮雕 —— 浅底按钮上给一道**向下的白高光**，
   图标就像从卡面上凸起来；深色卡（.pc-foot）里反过来给一道黑投影。 */
.ic.btn-ic{width:13.5px;height:13.5px;opacity:.9;vertical-align:-2.5px;margin-right:5px;
  flex:none;filter:drop-shadow(0 1px 0 rgba(255,255,255,.55))}
.pc-foot .ic.btn-ic,.pcard .ic.btn-ic{
  filter:drop-shadow(0 1px 1px rgba(0,0,0,.55))}

/* ---- 下面这套 .chip 只给**菜单栏面板**（#panhead）用：那儿是浅底的 ---- */
.chip{
  display:flex;align-items:center;gap:7px;padding:5px 12px;border-radius:20px;
  background:var(--card);border:1px solid var(--line);font-size:12.5px;
  max-width:100%;
}
.chip .k{color:var(--mu);flex:none}
.chip.line{padding:5px 11px;gap:6px}
.chip.line .k{color:var(--tx);font-weight:550}
.chip .v{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;max-width:340px;font-weight:500}
.dot{width:7px;height:7px;border-radius:50%;background:var(--off);flex:none}
.lv-ok   .dot{background:var(--ok)}
.lv-warn .dot{background:var(--warn)}
.lv-err  .dot{background:var(--err)}
.chip .dot{box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.lv-ok   .v{color:#3f8c3c}
.lv-warn .v{color:#9a7218}
.lv-err  .v{color:#b23c37}
.lv-info .v{color:var(--tx)}
.lv-off  .v{color:var(--mu)}

/* ---------------- 主体 ---------------- */
.wrap{flex:1;display:flex;min-height:0}
main{flex:1;overflow-y:auto;padding:14px 16px 40px;min-width:0}
aside{
  width:0;flex:none;background:var(--panel);border-left:1px solid var(--line);
  display:flex;flex-direction:column;overflow:hidden;transition:width .18s ease;
}
aside.open{width:44%;min-width:360px}

/* ---------------- 运行监测专用卡 ----------------
   照 PommeToys 那块黑色 STATUS 卡：深底 + 米白字 + 大圆角 + 大内边距。 */
.pcard{
  background:var(--dark);border:1px solid var(--dark);border-radius:20px;
  padding:18px 20px;margin-bottom:16px;color:var(--dtx);
}
.pc-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.pc-title{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  color:var(--dmu);font-family:var(--mono)}
.pc-badge{
  padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:600;
  border:1px solid transparent;
}
.b-ok  {background:rgba(118,209,115,.16);color:#8fe08c;border-color:rgba(118,209,115,.4)}
.b-off {background:rgba(255,255,255,.08);color:var(--dmu);border-color:rgba(255,255,255,.14)}
.b-warn{background:rgba(223,168,60,.16);color:#e8bd66;border-color:rgba(223,168,60,.4)}
/* ★ 2026-09-29（用户第 3 条）：「它在做什么」那段说明已删（挪进右上角 ⓘ）。
   保留类名以免旧 JS 引用报错，但不显示。 */
.pc-what{display:none}
.pc-what b{color:#bcd4f5;font-weight:600}
.pc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
/* 档位按钮（退路：后端没下发开关表时才会画） */
.lvbtn{
  text-align:left;padding:11px 13px;border-radius:var(--r2);
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);
  transition:.15s;color:var(--dtx);
}
.lvbtn:hover{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.2)}
.lvbtn.on{border-color:var(--ok);background:rgba(118,209,115,.14);
  box-shadow:0 0 0 1px rgba(118,209,115,.3) inset}
.lvbtn.on .t{color:#8fe08c}
.lvbtn .t{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13.5px}
.lvbtn .t .n{
  font-family:var(--mono);font-size:11px;color:var(--dmu);
  background:rgba(255,255,255,.1);border-radius:5px;padding:1px 6px;flex:none;
}
.lvbtn.on .t .n{background:var(--ok);color:#12200f}
.lvbtn .t .tag{
  font-size:11px;font-weight:500;color:var(--dmu);
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);
  border-radius:5px;padding:1px 7px;flex:none;white-space:nowrap;
}
.lvbtn.on .t .tag{color:#8fe08c;background:rgba(118,209,115,.16);
  border-color:rgba(118,209,115,.4)}
.lvbtn .d{font-size:12px;color:var(--dmu);margin-top:4px;line-height:1.45}
.pc-foot{display:flex;gap:9px;margin-top:14px;flex-wrap:wrap;align-items:center}
.act{
  padding:8px 15px;border-radius:var(--r2);background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.14);font-size:13px;transition:.15s;
  color:var(--dtx);
}
.act:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.24)}
.act.on{border-color:var(--ok);color:#8fe08c;background:rgba(118,209,115,.14)}
.act.stop:hover{border-color:var(--err);color:#f39b98}
/* 「跑完自动关机」状态灯 */
.sd-chip{display:inline-flex;align-items:center;gap:2px;padding:7px 12px;border:1px solid;
  border-radius:var(--r2);font-size:12.5px;font-weight:600;white-space:nowrap;line-height:1.5;
  background:rgba(255,255,255,.07);color:var(--dmu);border-color:rgba(255,255,255,.14)}
.sd-chip:empty{display:none}
.sd-chip.on  {background:rgba(118,209,115,.16);color:#8fe08c;border-color:rgba(118,209,115,.4)}
.sd-chip.wait{background:rgba(223,168,60,.16);color:#e8bd66;border-color:rgba(223,168,60,.4)}
.sd-chip.fire{background:rgba(236,103,101,.18);color:#f39b98;border-color:rgba(236,103,101,.45)}
.sd-chip b{font-weight:700}
.sd-chip .n{font-variant-numeric:tabular-nums;font-size:15px;font-weight:750;
  letter-spacing:.5px;margin:0 1px}

/* ★ PommeToys 式开关行（深色卡上）—— 左边标题，右边一个胶囊开关。
   子项靠左缩进 + 一根竖线区分层级。 */
.pw-feats{margin:2px 0 10px}
.pw-f{display:flex;align-items:center;gap:12px;padding:9px 12px;
  border-radius:var(--r2);border:1px solid rgba(255,255,255,.1);
  background:rgba(255,255,255,.04);margin-bottom:6px;position:relative}
/* ★★★ 2026-10-05（用户第 9 条）—— 树形层级：**连框一起缩进** ＋ **思维导图式连线**。
   用户原话：「不仅仅应该把文字缩进，应该连文字的那个框也一起缩进，这样就清晰了；
   而且你的线画的断断续续的，这样还不如不画呢；你要是画应该参考思维导图那种，
   从一个选项导到另一个选项那种画法」。
   ⇒ 三处改动：
     ① 缩进改用 `margin-left ＋ padding-left` —— **整行框**跟着右移，不再是
        `padding-left` 把文字往里推、框还顶在最左；
     ② 竖线不再让每个子行各画一小段 —— 那样在行间距里必然断开，而且线压在行框的
        半透明底上会深浅不匀（这正是"断断续续"的来源）。改成**画在子项容器
        `.pw-kids` 上的一整条**：容器多高线就多长，天然连续，整条都走在框外的
        空白区里，颜色一致；
     ③ 每个子行只画一小段**横枝**（从竖线拐到行框左缘），就是文件树/思维导图的 ├ 形。
   ★ 层级 = 容器嵌套：`.pw-kids` 里再放 `.pw-kids` 就是二级，缩进与线自动累加。
   ★ 前端只认 `sub` / `child` 两个标记，**不认识任何开关的名字**（加减开关不改这里）。
   ⚠️ Mac 端行高是 `padding:9px` + `margin-bottom:6px`（Win 端是 6px / 5px），
      所以竖线上端取 `-7px`（Win 那份是 `-6px`），与各自的行间距对齐。 */
.pw-kids{position:relative;margin-left:14px;padding-left:14px}
.pw-kids::before{content:'';position:absolute;left:0;top:-7px;bottom:0;width:1px;
  background:rgba(223,168,60,.5);pointer-events:none}
.pw-kids>.pw-f::before{content:'';position:absolute;left:-14px;top:50%;width:15px;height:1px;
  background:rgba(223,168,60,.5);pointer-events:none}
.pw-f.dis{opacity:.42}
/* ★★ 2026-10-05（用户第 4/5 条）：`.na` = 后端标了「这台机器上这项不适用」。
   两种情形：**没有电池的台式机**上的三项电相关开关（电量不足时自动停 /
   合盖后保持唤醒 / 合盖后内建显示器保持点亮）；以及**笔记本合盖**时
   「合盖后保持唤醒」「合盖后保持内建屏点亮」这两项（见 wb_powerguard.feat_gates）。
   `.na` 比 `.dis` 更淡一档（.42 → .3）—— `.dis` 是「先开总开关才能拨」的**提示**，
   点下去仍有效；`.na` 是「此刻不该被点」⇒ 额外挂 `disabled`，点了也不发请求。
   ⚠️ 别把它做成 `display:none`：用户要的是「灰的」，不是「消失」——
      看不到会以为功能被砍了，灰着才知道「有这项，此刻用不上」。
   ⚠️ 竖线（伪元素）也要跟着淡一档，不然一行灰着、旁边一根亮橙线很分裂。 */
.pw-f.na{opacity:.3}
.pw-f.na .sw{pointer-events:none}
.pw-f.na::before,.pw-f.na::after{opacity:.5}
.pw-f-t{flex:1 1 auto;min-width:0}
.pw-f-n{display:block;font-size:13.5px;font-weight:600;color:var(--dtx)}
.pw-f-g{font-style:normal;font-size:11px;color:var(--dmu);margin-left:7px;
  border:1px solid rgba(255,255,255,.18);border-radius:6px;padding:1px 5px}
/* ★ 2026-09-29（用户第 3 条）：开关下面那行小灰字说明已删（挪进 ⓘ）。 */
.pw-f-d{display:none}
/* ★★ 2026-09-30（第廿四轮 · 用户第 2 条）——开关的**立体感 + 即时性**
   用户原话：「对于 ui 界面的即时反馈性，你也学习下 POMMETOYS，它一点击这个按钮，
   反应很快，起码动画要直接跟上，不能慢半拍。」
   · 立体感：轨道做出**内凹槽**（顶部压暗 + 底部反光），圆钮做成带高光的球
     （径向渐变 + 落影 + 内高光），整体像一颗真的拨杆开关；
   · 即时性：过渡从 `.18s ease` 换成 `.16s cubic-bezier(.32,.72,.35,1)` ——
     起步快、尾段缓，点下去「唰」地就跟上了，不是慢悠悠地漂过去。
   ⚠️ 真正治「慢半拍」的不是这条 CSS，是 renderPower 里的 PW_HOLD
      （点完先别让 3 秒轮询把旧快照打回来）—— 见那段注释。 */
.sw{flex:0 0 auto;width:48px;height:28px;border-radius:999px;border:none;
  background:linear-gradient(#484138,#5c5449);position:relative;cursor:pointer;padding:0;
  box-shadow:inset 0 2px 4px rgba(0,0,0,.45), inset 0 -1px 0 rgba(255,255,255,.09);
  transition:background .16s cubic-bezier(.32,.72,.35,1),
             box-shadow .16s cubic-bezier(.32,.72,.35,1)}
.sw.on{background:linear-gradient(#6ec96b,#84de81);
  box-shadow:inset 0 2px 4px rgba(0,0,0,.16), inset 0 -1px 0 rgba(255,255,255,.3),
             0 0 10px rgba(118,209,115,.26)}
.sw:disabled{cursor:not-allowed}
.sw .knob{position:absolute;top:3px;left:3px;width:22px;height:22px;
  border-radius:50%;
  background:radial-gradient(circle at 34% 26%,#ffffff 0%,#f0ede8 62%,#d8d4cc 100%);
  transition:left .16s cubic-bezier(.32,.72,.35,1);
  box-shadow:0 2px 5px rgba(0,0,0,.42), inset 0 -1px 1px rgba(0,0,0,.10),
             inset 0 1px 0 rgba(255,255,255,.95)}
.sw.on .knob{left:23px}

/* 「时长」条状滑块 —— 照 PommeToys 的样子：细轨 + 圆头 + 等距刻度点 + 左侧已选段填色。
   ★ 2026-09-30（用户第 2 条）：原来的「⏰ 到点自动结束」按钮，以及点它才展开的那一排
     `.durbar` 时长按钮（30 分 / 1 时 / 2 时 / 4 时 / 自定义…）**整个退役** ——
     改成挂在「防休眠」下面的一条拉动滑块，位置与措辞都照 PommeToys 那张卡。 */
/* ★ 2026-10-05（用户第 9 条）：滑块现在活在 `.pw-kids` 里 —— 容器的
   `margin-left ＋ padding-left` 已经顶掉 28px，所以这里左边只需再给 12px，
   就跟上面「时长」二字的左边缘对齐；右边仍是 13px（1px 边框 ＋ 12px 内边距），
   与行框右缘对上。 */
.sldwrap{display:flex;align-items:center;gap:12px;margin:9px 13px 2px 12px}
.sld{flex:1 1 auto;min-width:0;-webkit-appearance:none;appearance:none;
  height:3px;border-radius:2px;outline:none;cursor:pointer;background:transparent}
.sld::-webkit-slider-runnable-track{height:3px;border-radius:2px;
  background-image:
    radial-gradient(circle, #9e968a 0 1.5px, transparent 1.7px),
    linear-gradient(to right, #e0655e 0 var(--p, 0%), #57514a var(--p, 0%) 100%);
  background-size:20% 3px, 100% 3px;
  background-repeat:repeat-x, no-repeat;
  background-position:0 50%, 0 0}
.sld::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;
  margin-top:-7.5px;border-radius:50%;background:#fff;border:2px solid #e0655e;
  box-shadow:0 1px 3px rgba(0,0,0,.55);cursor:pointer}
/* ★ 2026-09-30（第廿四轮）：深色卡（运行监测）里的滑块填色**亮一档** ——
   同一个 `#e0655e` 压在近黑的卡底上会显脏，而那正好是「到点自动结束」
   唯一的进度提示，看不清等于没有。刻度点也一并提亮。 */
.pcard .sld::-webkit-slider-runnable-track{
  background-image:
    radial-gradient(circle, #a49b8e 0 1.5px, transparent 1.7px),
    linear-gradient(to right, #f0705f 0 var(--p, 0%), #4e4942 var(--p, 0%) 100%)}
.pcard .sld::-webkit-slider-thumb{border-color:#f0705f}
.sld:disabled{cursor:not-allowed;opacity:.45}
/* ★ 2026-09-30（第廿四轮 · 用户第 1 条）：读数改成翻牌器之后，这颗容器只需要
   「不许被压缩、按内容定宽」—— 内容（.rd）本身格数恒定，所以整块宽度是常量。
   原来那句 `min-width:58px` 正是病根之一：它按最长中文串「1 小时 40 分钟」留位，
   短档位（「无限」）就空一大截 → 轨道跟着伸缩。 */
.sld-val{flex:0 0 auto;display:flex;justify-content:flex-end;align-items:center}
/* ★★★ 2026-10-02（第六十五轮 · 用户第 3 条）——「到点自动结束」的剩余时间
   **不再单独占一行**。这里原来是：
       .as-left{margin:4px 0 0 13px;font-size:11.5px;color:#f0c96a;min-height:15px}
   用户原话：「这个倒计时时间的字体颜色和背景颜色也太近了，别用黄色的」，
   并给出更好的法子：「我建议你用右边显示时间的那个 UI 来显示倒计时」——
   即**复用右侧那颗翻牌读数器**（`.rd`，平时显示档位时长的那三张卡）。
   于是那一行连同 DOM 一起退役，倒计时改由 `paintAutoStopRead()` 画进读数器。
   ★ 为什么这样反而更清楚：读数器在**深色卡**上（白字卡片），金色压上去很跳；
     而那行小字是压在**米白卡**上的 11.5px 小字 —— 同一个 #f0c96a 换个底就糊了。
     又一次印证第四十八轮那条：**「一份颜色给两种底色用」迟早一边隐形**。
   ★ 倒计时态与档位读数靠**数字颜色**区分（结构不动 ⇒ 宽度不动 ⇒ 轨道不抖）：
       深色卡（主窗口）＝ 暖黄；米白卡（菜单栏面板）＝ 深琥珀。 */
.sld-val.cd .rd-c{color:#f0c96a}
body.panel .sld-val.cd .rd-c{color:#8a4b12}
/* 最后 60 秒：读数只精确到分钟（多一位就撑宽读数器），那 60 秒里数字不动，
   看着像卡死 —— 用一次**呼吸**交代「快到点了」，同时不占任何宽度。 */
.sld-val.cd-soon .rd-c{animation:cdPulse 1.1s ease-in-out infinite}
@keyframes cdPulse{0%,100%{opacity:1}50%{opacity:.45}}

/* ★★ 2026-09-30（第廿四轮 · 用户第 1 条）——「读数卡槽」：照 PommeToys 的翻牌器
   ------------------------------------------------------------------
   用户原话：「你对比一下这两个滚动速度的显示界面……你参考他的界面，也做一个，
   否则会有时长长度不一，导致这个进度条的长度也来回变化的问题。」
   病根：右读数是一句**会伸缩的中文**（「1.55 倍」／「1 倍」／「1 小时 40 分钟」／
        「无限」），字数一变，`flex:1` 的轨道就跟着变长变短。
   治法：读数改成**格数恒定**的翻牌器 —— 每一位数字一张等宽卡片：
        · 速度 `×1.55` →  × + [1] . [5] [5]     = 3 张卡
        · 时长 `1:40`  →      [1] : [4] [0]     = 3 张卡
   两处**同构**（3 卡 + 1 个分隔点），所以两个滑块各自的读数宽度都是常量，
   轨道长度从此不再动。末档「无限」用一张跨三格的宽卡，宽度也对齐 3 卡 + 2 缝。
   ⚠️ 深色卡（运行监测）与浅色卡（鼠标）共用这套结构，只有配色两套：
        `.rd`       默认＝深色卡配色（卡片比卡底更暗，像嵌进去的凹槽）
        `.rd.lt`    ＝浅色卡配色（白色凹槽，压在米色卡上） */
.rd{display:inline-flex;align-items:center;flex:0 0 auto;
  --rd-w:21px;--rd-g:3px;--rd-s:5px;gap:var(--rd-g)}
.rd-c{
  width:var(--rd-w);height:27px;flex:none;border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:15px;font-weight:700;line-height:1;
  font-variant-numeric:tabular-nums;
  position:relative;overflow:hidden;
  /* 深色卡配色：比卡底**略亮一档** + 顶部高光 + 底部压暗 = 一块微微浮起的翻牌
     （PommeToys 那三张卡就是压在深底上，不是刻进去的）；数字再给一道黑影，
     白字看着像从卡面凸出来。 */
  background:linear-gradient(#302a23,#1c1915);
  color:#f7f4ee;
  text-shadow:0 1px 1px rgba(0,0,0,.85);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),
             inset 0 -1px 0 rgba(0,0,0,.55),
             0 1px 2px rgba(0,0,0,.45);
}
/* 翻牌中缝：卡片正中间一条细线 —— PommeToys 那三张卡上都有这道缝 */
.rd-c::after{
  content:"";position:absolute;left:1px;right:1px;top:50%;height:1px;
  background:rgba(0,0,0,.5);pointer-events:none;
}
/* 分隔符（小数点 / 冒号）：不占卡片，只有一个小方块 */
.rd-s{width:var(--rd-s);flex:none;font-size:15px;font-weight:700;color:var(--dmu);
  font-family:var(--mono);text-align:center;line-height:1}
/* 前缀（速度的 ×）：固定宽度，宽度不受内容影响 */
.rd-x{flex:none;font-size:13px;font-weight:700;color:var(--dmu);margin-right:1px}
/* 末档「无限」：一张**跨三格**的宽卡。宽度必须正好等于普通档的
   「3 卡 + 3 个缝 + 1 个分隔符」—— 差一个像素，拉到最右端时读数就会抖一下。
   ⚠️ 第一版按「3 卡 + 2 缝」算，实测比普通档**窄 8px**（69 vs 77），
      是靠离屏里真量 getBoundingClientRect 抓出来的。 */
.rd-c.rd-inf{width:calc(3 * var(--rd-w) + 3 * var(--rd-g) + var(--rd-s));font-size:16px}

/* 浅色卡（首页「鼠标」那张）上的读数：米色底 + 细描边。
   ⚠️ 第一版用的是纯白卡片，压在近白的卡面上**糊成一片、看不出格**（离屏验收抓到的）——
      所以这里反过来：卡片比卡底**略深**，靠那点色差和描边把"一格一格"撑出来。 */
.rd.lt .rd-c{
  background:linear-gradient(#efe9dc,#fdfcf9);
  color:#2a2620;
  text-shadow:0 1px 0 rgba(255,255,255,.95);
  border:1px solid #e2dbca;
  box-shadow:inset 0 2px 3px rgba(120,110,92,.20),
             inset 0 -1px 0 rgba(255,255,255,.95),
             0 1px 1px rgba(255,255,255,.85);
}
.rd.lt .rd-c::after{background:rgba(120,110,92,.30)}
.rd.lt .rd-s,.rd.lt .rd-x{color:var(--mu)}
/* ★★ 2026-10-01（第四十八轮收尾）：**菜单栏面板**里的读数也要走浅色那套。
   ------------------------------------------------------------------
   病根：`.rd` 的默认配色是**给深色卡写的**（见上面 .rd-c 的注释），
        而菜单栏面板是米色浅底 —— 于是那三张翻牌就成了「一块黑」，很突兀。
   为什么以前没发现：这个读数块在**主窗口**里压在深色 `#power-card` 上，
        配色正好；只有面板（浅底）那一处一直是错的，而我平时不看面板截图。
   ★ 教训同第四十五轮那条：**「一份颜色给两种底色用」迟早一边隐形/突兀**。
   ★ 只改颜色、不动结构；`.rd-c.rd-inf`（末档「无限」）也一并跟过来。 */
body.panel .rd-c{
  background:linear-gradient(#efe9dc,#fdfcf9);
  color:#2a2620;
  text-shadow:0 1px 0 rgba(255,255,255,.95);
  border:1px solid #e2dbca;
  box-shadow:inset 0 2px 3px rgba(120,110,92,.20),
             inset 0 -1px 0 rgba(255,255,255,.95),
             0 1px 1px rgba(255,255,255,.85);
}
body.panel .rd-c::after{background:rgba(120,110,92,.30)}
body.panel .rd-s,body.panel .rd-x{color:var(--mu)}

/* ---------------- 首页「鼠标」板块 ----------------
   ★★ 2026-09-30（用户第 2 条）：照 PommeToys 那张卡 —— 两个开关 + 一条拉动式速度滑块。
   ⚠️ 它铺在**米白首页**上（不像运行监测那张深色卡），所以开关与文字都用浅色底那一套；
      `.sw` 是给深色卡写的（关态 #574f45 太深），这里另给一个 `.sw-l`。
   ⚠️ 速度滑块的**外观**走全局 `.sld`（与「时长」滑块同一个件），这里只管布局。 */
#mouse-card{background:var(--card);border:1px solid var(--line);
  border-radius:var(--r2);overflow:hidden}
#mouse-card .ms-f{display:flex;align-items:center;gap:12px;padding:11px 13px}
#mouse-card .ms-f + .ms-f{border-top:1px solid var(--line)}
#mouse-card .ms-f-t{flex:1 1 auto;min-width:0}
#mouse-card .ms-f-n{display:block;font-size:13.5px;font-weight:600;color:var(--tx)}
#mouse-card .ms-f-g{font-style:normal;font-size:11px;color:var(--mu);margin-left:7px;
  border:1px solid var(--line2);border-radius:6px;padding:1px 5px}
#mouse-card .ms-f-d{display:block;font-size:11.5px;color:var(--mu);margin-top:2px}
#mouse-card .ms-sub{padding:11px 13px 13px;border-top:1px solid var(--line)}
#mouse-card .ms-sub .ms-f-t{margin-bottom:8px}
/* 速度滑块复用 `.sldwrap` 的横排布局，但不要它那 34px 缩进（那是深色卡里的子项缩进） */
#mouse-card .sldwrap{margin:0}
/* 浅色卡上的同一颗开关（首页「鼠标」那张）：结构、时序与 .sw 一致，只换配色 ——
   米色卡上做凹槽要**反过来**：底色比卡略暗，靠内阴影压出槽，圆钮同理。 */
.sw-l{flex:0 0 auto;width:48px;height:28px;border-radius:999px;border:none;
  background:linear-gradient(#e5dfd2,#d1cabc);position:relative;cursor:pointer;padding:0;
  box-shadow:inset 0 2px 4px rgba(120,110,92,.30), inset 0 -1px 0 rgba(255,255,255,.85);
  transition:background .16s cubic-bezier(.32,.72,.35,1),
             box-shadow .16s cubic-bezier(.32,.72,.35,1)}
.sw-l.on{background:linear-gradient(#6ec96b,#84de81);
  box-shadow:inset 0 2px 4px rgba(0,0,0,.16), inset 0 -1px 0 rgba(255,255,255,.3),
             0 0 10px rgba(118,209,115,.3)}
.sw-l .knob{position:absolute;top:3px;left:3px;width:22px;height:22px;
  border-radius:50%;
  background:radial-gradient(circle at 34% 26%,#ffffff 0%,#f6f3ee 62%,#e0dcd4 100%);
  transition:left .16s cubic-bezier(.32,.72,.35,1);
  box-shadow:0 2px 5px rgba(60,54,44,.34), inset 0 -1px 1px rgba(0,0,0,.07),
             inset 0 1px 0 rgba(255,255,255,.98)}
.sw-l.on .knob{left:23px}
#mouse-card .ms-perm{margin:0 13px 12px;padding:9px 11px;border-radius:var(--r2);
  border:1px solid #e0cfa4;background:#f7f0dc;color:#8a6a18;font-size:11.5px}
#mouse-card .ms-perm b{font-weight:600}
#mouse-card .ms-perm button{margin-top:6px;font-size:11.5px;font-weight:600;
  color:#8a6a18;text-decoration:underline;padding:0}

/* ---------------- 「右键助手」板块（2026-10-01 第四十八轮）----------------
   ★★ 用户原话：「把 word模板创建 / 图片转PDF / 合并PDF / PDF加密解密 / 文档转PDF
      从 MouseBoost Pro 搬出来，**卸载 MouseBoost 后仍可用**，并集成到任务管家；
      且**图标不要一律用 Word 图标**」。
   ⇒ 这几项现在是**系统原生「快速操作」**（`~/Library/Services/*.workflow`），
     干活儿的仍是 `com.wb.pdfquick` 守护。这张卡就是它们在任务管家里的**门面**：
     看得见、能一项一项开关、能让右键菜单立刻认账。
   ⚠️ 每一项的图标都是**手画的 inline SVG**（见 `QA_ICONS`），一人一个 ——
     这正是「不要都用 Word 图标」那一条的落地，**别改回统一图标**。
   ⚠️ 骨架与 `#mouse-card` 同一套（行式、浅色底），所以选择器照着它写。 */
#qa-card{background:var(--card);border:1px solid var(--line);
  border-radius:var(--r2);overflow:hidden}
#qa-card .qa-h{padding:11px 13px 9px}
#qa-card .qa-h b{font-size:13.5px;font-weight:700;color:var(--tx);margin-right:7px}
#qa-card .qa-h span{font-size:11.5px;color:var(--mu);line-height:1.5}
#qa-card .qa-f{display:flex;align-items:center;gap:11px;padding:10px 13px}
#qa-card .qa-f + .qa-f{border-top:1px solid var(--line)}
#qa-card .qa-ic{flex:0 0 auto;width:30px;height:30px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  background:#f2ede3;border:1px solid var(--line);color:#6b6152}
#qa-card .qa-ic svg{width:18px;height:18px;display:block}
#qa-card .qa-f.on .qa-ic{background:#fdf1e7;border-color:#e8cdb6;color:#c2703c}
#qa-card .qa-f-t{flex:1 1 auto;min-width:0}
#qa-card .qa-f-n{display:block;font-size:13.5px;font-weight:600;color:var(--tx)}
#qa-card .qa-f-n i{font-style:normal;font-size:11px;color:var(--mu);margin-left:7px;
  border:1px solid var(--line2);border-radius:6px;padding:1px 5px}
#qa-card .qa-f-d{display:block;font-size:11.5px;color:var(--mu);margin-top:2px;
  line-height:1.5}
#qa-card .qa-f.pend{opacity:.55}
#qa-card .qa-f.pend .qa-tag{font-size:11px;color:#8a6a18;border:1px solid #e0cfa4;
  background:#f7f0dc;border-radius:6px;padding:2px 7px;flex:0 0 auto}
#qa-card .qa-ft{padding:9px 13px;border-top:1px solid var(--line);
  display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--mu)}
#qa-card .qa-ft .qa-sp{flex:1 1 auto}
#qa-card .qa-ft button{font-size:11.5px;font-weight:600;border:1px solid var(--line);
  border-radius:7px;padding:4px 9px;background:var(--card2);color:var(--tx);
  cursor:pointer;flex:0 0 auto}
#qa-card .qa-ft button:hover{border-color:var(--line2)}

/* ★★ 2026-10-01（第四十九轮 · 用户）：「word模板创建」的右半边要能挑模板。
   ------------------------------------------------------------------
   用户原话：「在 **Word 模板创建**这个 UI 图标的右半边，加一个按钮，即可以选择
              word 模板文件，默认的 Word 模板文件应该是 Normal.dotm（共用模板）」。
   布局：右半边成了一小簇 —— `[选择模板…] [开关]`；「现在用的是哪一份」单独一行
        挂在说明下面（`.qa-tpl`），完整路径塞进 title，一眼就能核对。
   ⚠️ 这一簇在**浅色卡**上（`#qa-card`），所以配色照 `.qa-ft button` 那一套写 ——
      别把深色卡（`.pcard`）的颜色抄过来：那是第四十五/四十八轮踩过两次的坑
      （「一份颜色给两种底色用」迟早一边隐形）。 */
#qa-card .qa-f-r{flex:0 0 auto;display:flex;align-items:center;gap:8px}
#qa-card .qa-tpl-b{font-size:11.5px;font-weight:600;border:1px solid var(--line);
  border-radius:7px;padding:4px 9px;background:var(--card2);color:var(--tx);
  cursor:pointer;flex:0 0 auto;white-space:nowrap}
#qa-card .qa-tpl-b:hover{border-color:var(--line2)}
#qa-card .qa-tpl-b[disabled]{opacity:.55;cursor:default}
#qa-card .qa-tpl{display:block;font-size:11px;color:var(--mu);margin-top:3px;
  line-height:1.5;overflow-wrap:anywhere}
#qa-card .qa-tpl b{font-weight:600;color:var(--tx)}
/* 模板文件不在了 —— 这不是「说明文字」，是**要用户动手的**，给个警示色。 */
#qa-card .qa-tpl.warn{color:#a4610f}

/* ---------------- 「键盘」板块（2026-10-01 第卅二轮）----------------
   ★★ 用户原话：「把我用 Karabiner-Elements 对本电脑所做的所有的键盘映射，
      以**开关**和**选择映射哪个按键**的方式放到这个键盘栏目下……另外对于
      Command X-V 这个软件所做的修改，你也放到键盘这个栏目下，单独放一个开关」。
   ⚠️ 这一页**照抄「鼠标」页的骨架**（浅色卡 + `.sw-l` 开关 + `.ms-f` 那种
      「左边一坨说明、右边一颗开关」的行），只是行里多两个键位下拉。
      为什么不直接复用 `#mouse-card` 那几条规则：那是一张卡的**专属**选择器，
      把键盘的节点塞进去得改选择器（牵动鼠标页已有的那几套回归），不如另起一套。
   ⚠️ 窗口**定尺 617px** → 主区可用宽约 585px、卡片内宽约 559px。
      「开关 + 一坨说明」的横向预算是这么倒推的：
        右边开关 48 + 间距 12 = 60 → 左边还剩 ~499，足够放
        `Ctrl + [Insert▾] → Cmd + [C▾]`（约 350px）。加下拉时别超过这个宽度。
   ⚠️ 组头的开关与行里的开关**同源**（都 `.sw-l`），只在组头缩一号 ——
      缩小后 knob 的落点必须跟着改（见下面 `.kb-hd .sw-l` 那三条），
      漏了就会「开态圆钮探出槽外」。 */
/* ---------- 2026-10-18 新增：映射总览（用户第 2 条「列一个状态栏」）----------
   目的：这一页有 60 多条，默认还全折叠着 —— 用户想知道「现在到底哪些键被改了」，
   得一条条点开找。这张卡把**当前生效**的映射按来源归类摊在一屏里：
     ① 外接键盘（Win 模式）② Ctrl 组合 ③ 其它（中英/系统/浏览器/终端）。
   默认收起，点标题展开；不参与任何写入，纯只读视图。 */
#ky-ov{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);
  overflow:hidden;margin-bottom:12px}
#ky-ov .ov-hd{display:flex;align-items:center;gap:10px;padding:10px 13px;
  cursor:pointer;user-select:none}
#ky-ov .ov-hd:hover{background:#f5f1e7}
#ky-ov .ov-t{flex:1 1 auto;min-width:0}
#ky-ov .ov-n{display:block;font-size:13.5px;font-weight:650;color:var(--tx)}
#ky-ov .ov-d{display:block;font-size:11.5px;color:var(--mu);margin-top:2px;line-height:1.55}
#ky-ov .ov-body{display:none;border-top:1px solid var(--line);padding:11px 13px 13px}
#ky-ov.open .ov-body{display:block}
#ky-ov .ov-sec + .ov-sec{margin-top:12px;padding-top:11px;border-top:1px dashed var(--line)}
#ky-ov .ov-st{font-size:12px;font-weight:650;color:var(--tx);margin-bottom:4px}
#ky-ov .ov-sd{font-size:11.5px;color:var(--mu);line-height:1.6;margin-bottom:7px}
#ky-ov .ov-chips{display:flex;flex-wrap:wrap;gap:5px}
.ov-chip{font-size:11px;border:1px solid var(--line2);border-radius:6px;
  padding:2px 7px;background:var(--card2);color:var(--tx);white-space:nowrap}
.ov-chip b{font-weight:650;color:var(--mu)}
/* 编辑键包内的小节标题：45 条混在一起看不出「哪些是 Alt 习惯、哪些是 Ctrl 习惯」 */
.kb-sub{font-size:11px;font-weight:650;color:var(--mu);padding:8px 13px 4px;
  background:#f7f3ea;border-top:1px solid var(--line)}
.kb-grp > .kb-body > .kb-sub:first-child{border-top:0}

#keymap-card, #cmdxv-card{background:var(--card);border:1px solid var(--line);
  border-radius:var(--r2);overflow:hidden}
#cmdxv-card{margin-top:14px}
.kb-f{display:flex;align-items:center;gap:12px;padding:11px 13px}
.kb-f + .kb-f{border-top:1px solid var(--line)}
.kb-f-t{flex:1 1 auto;min-width:0}
.kb-f-n{display:block;font-size:13.5px;font-weight:600;color:var(--tx)}
.kb-f-g{font-style:normal;font-size:11px;color:var(--mu);margin-left:7px;
  border:1px solid var(--line2);border-radius:6px;padding:1px 5px}
.kb-f-d{display:block;font-size:11.5px;color:var(--mu);margin-top:2px;line-height:1.55}
/* 卡片里那颗「重新从 Karabiner 导入」的小按钮：走 .btn 的骨、缩一号 */
.kb-f .btn.sm{flex:none;padding:6px 11px;font-size:11.5px}

/* 权限引导条（与 `#mouse-card .ms-perm` 同一副长相，换前缀） */
.kb-perm{margin:0 13px 12px;padding:9px 11px;border-radius:var(--r2);
  border:1px solid #e0cfa4;background:#f7f0dc;color:#8a6a18;
  font-size:11.5px;line-height:1.6}
.kb-perm b{font-weight:600}
.kb-perm button{margin-top:6px;font-size:11.5px;font-weight:600;
  color:#8a6a18;text-decoration:underline;padding:0}

/* ---- 功能包（可折叠）：组头 + 逐条 ---- */
.kb-grp{background:var(--card);border:1px solid var(--line);
  border-radius:var(--r2);overflow:hidden;margin-bottom:12px}
.kb-hd{display:flex;align-items:center;gap:10px;padding:9px 12px;cursor:pointer;
  user-select:none}
.kb-hd:hover{background:#f5f1e7}
.kb-hd-t{flex:1 1 auto;min-width:0}
.kb-hd-n{display:block;font-size:13px;font-weight:650;color:var(--tx)}
.kb-hd-d{display:block;font-size:11.5px;color:var(--mu);margin-top:2px}
.kb-hd-c{flex:none;font-size:11px;color:var(--mu);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.kb-chev{flex:none;width:14px;text-align:center;font-size:13px;line-height:1;
  color:var(--mu);transition:transform .16s}
.kb-grp.fold .kb-chev{transform:rotate(-90deg)}
.kb-grp.fold .kb-body{display:none}
.kb-body{border-top:1px solid var(--line)}
/* ⚠️ 组头那颗开关：把 .sw-l 缩到 42×24。三条都要改 ——
   只改 width/height 会让 .on 态的圆钮停在 23px（探出槽外）。 */
.kb-hd .sw-l{width:42px;height:24px}
.kb-hd .sw-l .knob{width:18px;height:18px}
.kb-hd .sw-l.on .knob{left:21px}

/* ---- 逐条 ---- */
.kb-r{display:flex;align-items:flex-start;gap:12px;padding:9px 13px}
.kb-r + .kb-r{border-top:1px solid var(--line)}
.kb-r.on{background:#fbf9f4}
.kb-r-t{flex:1 1 auto;min-width:0}
/* 第一行＝「默认 → 你按的键」。
   ★★ 2026-10-01（第卅三轮 · 用户第 1 条原话）：「你看 CTRL V 按理讲应该是被映射过后的
      应该放在后面；Command V 应该是默认的 应该放在前面 而且 默认的就不要给它留调整的
      空间 默认是不能改的。」
   → **左＝`to`**（本该按的那套原生键：Cmd+V / Cmd+C / Alt+←），**纯文字、没有控件**；
     **右＝`from`**（你现在按的键），点一下就地录。
   这一条对全部五组都成立，因为 `to` 恰好永远是「Mac 原生的那一个」：
     kb-30 Ctrl+V→Cmd+V（原生粘贴）／kb-10 Ctrl+←→Alt+←（原生跳词）／
     mod-1 左Alt→左Cmd（原生 Cmd）／kb-35 锁屏 Ctrl+Alt+L→Cmd+Ctrl+Q。 */
.kb-combo{display:flex;align-items:center;gap:4px;flex-wrap:wrap;
  min-height:24px}
/* ★ 2026-10-18（用户第 1 条「每个功能前面写一个标题」）：行首那一列功能名。
   固定宽度＝让 50 多行的「默认… → …」全部纵向对齐；太长就省略号 + title 兜住。 */
.kb-name{flex:0 0 76px;font-size:11px;font-weight:650;color:var(--tx);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  padding-right:4px;line-height:1.7}
/* 「恢复默认」：不显眼的小按钮，压在开关左边 */
button.kb-rst{flex:none;-webkit-appearance:none;appearance:none;
  font-family:var(--sans);font-size:10.5px;color:var(--mu);
  background:transparent;border:1px solid var(--line2);border-radius:7px;
  padding:3px 7px;margin-top:1px;line-height:1.4;cursor:pointer;
  white-space:nowrap;transition:border-color .13s,color .13s,background-color .13s}
button.kb-rst:hover{border-color:var(--dark);color:var(--tx);background:#f3eee2}
button.kb-rst:disabled{opacity:.45;cursor:not-allowed}
.kb-lbl{font-size:10px;color:var(--mu);white-space:nowrap;letter-spacing:.03em}
.kb-mod{font-size:11.5px;font-weight:600;color:var(--tx);white-space:nowrap}
/* 「默认」那一端刻意压暗一档（它是**参照物**，不是可操作的东西） */
.kb-def{font-size:11.5px;font-weight:600;color:#8d877c;white-space:nowrap}
.kb-ar{font-size:12px;color:var(--mu);padding:0 1px}
.kb-r-d{display:block;font-size:11px;color:var(--mu);margin-top:3px;line-height:1.5}
.kb-arm{font-size:12px;color:var(--mu);white-space:nowrap}
/* 这一包只给开关（编辑键，35 条锁死）时，右边那半也用同一档灰度 —— 别让人以为能点 */
.kb-def.on{color:var(--tx)}
/* 逐条那颗开关也要缩一号（57 条全尺寸会显得笨重）；同样三条一起改 */
.kb-r .sw-l{width:40px;height:23px;margin-top:1px}
.kb-r .sw-l .knob{width:17px;height:17px}
.kb-r .sw-l.on .knob{left:20px}
/* 读不懂 scope 的特殊款：一个琥珀色小标签（如「仅外接键盘」） */
.kb-warn{display:inline-block;font-size:10.5px;font-weight:600;color:#8a6a18;
  border:1px solid #e0cfa4;background:#f7f0dc;border-radius:6px;
  padding:0 5px;margin-left:6px;white-space:nowrap}

/* ---- 按键录制按钮：米色胶囊，不用系统默认长相（系统默认在暖色卡上很扎眼）。
   ★★ 2026-10-01（第卅三轮 · 用户第 3 条原话）：「对于其他可以修改按键的 应该是那种
      在键盘上按映射来选择按键的方式 不要让我用列表来指定按键」。
      → 所以这里从 `<select>` 换成了 `<button>`：点一下进入录制态，直接在键盘上按键。 ---- */
button.kb-key{
  -webkit-appearance:none;appearance:none;
  font-family:var(--sans);font-size:11px;font-weight:600;color:var(--tx);
  background-color:#f1ece0;border:1px solid var(--line2);border-radius:7px;
  padding:3px 7px;line-height:1.5;cursor:pointer;max-width:200px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  transition:border-color .13s, background-color .13s;
}
button.kb-key .kk{font-size:11px;color:var(--mu);margin-right:4px;font-style:normal}
button.kb-key:hover{border-color:var(--dark);background-color:#ece6d8}
button.kb-key:focus{outline:none;border-color:var(--dark);
  box-shadow:0 0 0 2px rgba(40,36,30,.12)}
button.kb-key:disabled{opacity:.45;cursor:not-allowed}
/* 录制中：琥珀底色 + 呼吸 —— 一眼看出「轮到你了，按吧」 */
button.kb-key.cap{background:#f6e9c4;border-color:#c9a94b;color:#6b5a1e;
  animation:kbpulse 1.05s ease-in-out infinite}
button.kb-key.cap .kk{color:#8a6a18}
@keyframes kbpulse{0%,100%{opacity:1}50%{opacity:.6}}
/* 录制中的横幅：挂在整页最上面 —— 录键时视线在键盘上，得有个东西说明「在等什么」 */
.kb-caphint{display:flex;align-items:center;gap:8px;margin-bottom:12px;
  padding:8px 12px;border-radius:9px;background:#f6e9c4;
  border:1px solid #e0cfa4;font-size:12px;line-height:1.55;color:#6b5a1e}
.kb-caphint b{font-weight:700}
.kb-caphint button{margin-left:auto;flex:none;font-family:var(--sans);
  font-size:11.5px;background:#fffdf7;border:1px solid #e0cfa4;color:#6b5a1e;
  border-radius:6px;padding:2px 9px;cursor:pointer}
.kb-caphint button:hover{background:#fff}

/* ---- Caps Lock：选项只有几个、语义又特殊 → 一排按钮，不用录制 ---- */
.kb-seg{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
button.kb-seg-b{font-family:var(--sans);font-size:12px;font-weight:600;
  color:var(--tx);background-color:#f1ece0;border:1px solid var(--line2);
  border-radius:7px;padding:4px 10px;cursor:pointer;
  transition:border-color .13s, background-color .13s}
button.kb-seg-b:hover{border-color:var(--dark);background-color:#ece6d8}
button.kb-seg-b.sel{background:#e6efdf;border-color:#9dbb90;color:#33602f}
button.kb-seg-b:disabled{opacity:.45;cursor:not-allowed}

/* ---------------- 分组 ---------------- */
.grp{margin-bottom:20px}
.grp h2{
  font-size:11.5px;font-weight:600;color:var(--mu);margin:0 0 10px;
  letter-spacing:.14em;text-transform:uppercase;font-family:var(--mono);
  display:flex;align-items:center;gap:9px;
}
.grp h2::after{content:"";flex:1;height:1px;background:var(--line)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:9px}
/* ★ 廿七轮：任务页要的是**一列五行**（不是两列）——
   两列的话第 5 行会孤零零占左半边，看着像少了一块；一列从上往下读也更顺。
   ⚠️ 别删这条：`.cards` 的 auto-fill 在 617px 宽的窗口里正好排出两列。 */
.cards.one{grid-template-columns:1fr}
/* ★★★ 2026-10-05（用户第 6 条）：「把所有的图标改成纵向排列、图标大小改成一样」。
   病根两条：
     ① `.cards` 是 auto-fill 两列 ⇒ 卡与卡宽窄不一（同一层里有的占半行、有的占整行）；
     ② 卡片高度各随内容（有「点开是一个面板」标签的高一点）⇒ 同样 17px 的 ⓘ
        在矮卡里显大、在高卡里显小，看着就是「图标大小不一样」。
   改法：单列容器里统一 min-height、内容垂直居中；ⓘ 也从固定 `top:9px` 改成
   上下自适应居中。⚠️ **不能用 transform:translateY(-50%)** —— `.info:hover`
   的 `scale(1.12)` 会把 transform 整条顶掉，鼠标一悬停图标就跳位；
   用 `top:0;bottom:0;margin:auto 0` 才是与 hover 不打架的写法。 */
.cards.one .item{min-height:48px;align-items:center}
.cards.one .item .info{top:0;bottom:0;margin-top:auto;margin-bottom:auto}
.item{
  position:relative;display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;
  padding:11px 13px;border-radius:var(--r2);background:var(--card);
  border:1px solid var(--line);transition:.15s;
}
.item:hover{background:var(--card2);border-color:var(--line2);transform:translateY(-1px);
  box-shadow:0 3px 12px rgba(60,50,30,.07)}
/* ★ 同上：按下要下陷。
   ⚠️ 卡片的缩放另给一档：`.wb-press` 那个 2.5% 对 700px 宽的卡就是十几个像素的位移，
      晃得太夸张；小按钮上同样的 2.5% 才刚好。 */
.item:active{transform:translateY(1px) scale(.995)}
.item.wb-press{transform:translateY(1px) scale(.995) !important}
/* ★★ 2026-10-01（第卅轮 · 用户要求）────────────────────────────────────────
   卡片前面那块**序号徽标已经整个删掉**，这里只剩「开下一层」用的行尾 ›。
   删掉的三条是：`.item .n`（黑底数字）、`.item.view .n`（绿底 ›）、`.item.term .n`（棕底）。
   为什么删：一会有绿、一会有黑，颜色不统一；而里面那个数字本来就只是**黑窗菜单的编号**，
   图形界面里没人照它按。用户原话：「不要有绿色的和黑色的，都统一颜色，并且把序号去掉，
   序号已经没用了，因为是图像 ui 界面」。
   ⚠️ 别再改回来 —— 静态断言 `_chk_mac_ui.py` 会盯着「卡片里不许再出现 .n 徽标」。 */
.item .chev{
  flex:none;align-self:center;margin-left:auto;padding-left:9px;
  color:var(--mu);font-size:15px;line-height:1;font-weight:600;
}
.item .b{min-width:0;flex:1}
.item .nm{font-weight:600;font-size:13.5px;display:block;padding-right:18px}
/* ★ 2026-09-29（用户第 3 条）：卡片上的描述行（.ds）已删 —— 内容挪进右上角 ⓘ。
   保留类名以免旧 JS 引用报错，但不显示。 */
.item .ds{display:none}
.item .warn{
  font-size:11px;color:#9a7218;border:1px solid #e0cfa4;
  background:#f7f0dc;border-radius:5px;padding:1px 6px;
  margin-left:6px;white-space:nowrap;
}
.item.risky{border-color:#e8d3b0}
.item.risky:hover{border-color:#dcc194}
/* ★ 第卅轮：`.item.term .n` / `.item.view .n` 两条**已删** —— 徽标整块不画了，理由见上面 .item .chev 那段。 */

/* ---------------- 卡片右侧的运行指示（2026-09-29 用户第 11 条）----------------
   「部署和修复 / 一键整合点了没有反应」—— 任务其实每次都启动了（日志里
   16:22 一分钟内 env1 被连点 4 次、one1 连点 2 次），只是长任务要跑几十秒、
   界面上一声不吭。现在每张卡片右侧带一小块运行状态：细进度条 + 一行字。
     · 运行中：任务有步骤标记（>>> [i/N]）→ 确定进度；没有 → 来回滑动的小条。
     · 结束：✓ 完成 / ✗ 失败 原地停留几秒，然后自己消失。
   ⚠️ 与它配套的是 run() 里的重复点击拦截 —— 看见「正在跑」还连点会被劝住，
      不会再像 16:02 那样一分钟起 9 个 onekey 并发。 */
.item .runstat{
  flex:none;align-self:center;display:none;flex-direction:column;
  align-items:flex-end;gap:4px;margin-right:20px;min-width:88px;
}
.item .runstat.show{display:flex}
.item .runstat .rbar{
  width:84px;height:5px;border-radius:3px;background:#ece7dc;overflow:hidden;
  position:relative;
}
.item .runstat .rfill{
  position:absolute;top:0;left:0;bottom:0;width:0;border-radius:3px;
  background:#35c98a;transition:width .5s;
}
/* 没有步骤信息的任务：小条来回滑，表示「活着，在跑」 */
.item .runstat.indet .rfill{width:34%;animation:rsindet 1.15s ease-in-out infinite}
@keyframes rsindet{
  0%{left:-34%} 100%{left:100%}
}
.item .runstat .rtxt{
  font-size:10.5px;font-weight:600;color:var(--mu);white-space:nowrap;
  font-variant-numeric:tabular-nums;
}
.item .runstat.ok .rfill{width:100%;background:#35c98a}
.item .runstat.ok .rtxt{color:#3f8c3c}
.item .runstat.bad .rfill{width:100%;background:#f06565}
.item .runstat.bad .rtxt{color:#c4483f}
/* 运行中的卡片描一圈淡绿边，扫一眼就知道哪几张在跑 */
.item.run{border-color:#bcd9b6}

/* ---------------- ⓘ 小感叹号（用户第 3 条）----------------
   每个卡片/按钮右上角一个小圈，点它弹出详细介绍。
   ★ 与卡片本身的点击严格分开：点 ⓘ 只开帮助，**不执行**。 */
.info{
  font-style:normal;
  position:absolute;top:9px;right:9px;width:17px;height:17px;border-radius:50%;
  border:1px solid var(--line2);background:transparent;color:var(--mu);
  font-size:11px;font-weight:700;line-height:1;
  display:flex;align-items:center;justify-content:center;
  transition:.14s;z-index:2;font-family:var(--sans);
}
.info:hover{background:var(--dark);border-color:var(--dark);color:var(--dtx);

.info.ondark{border-color:rgba(255,255,255,.28);color:var(--dmu)}
.info.ondark:hover{background:var(--dtx);border-color:var(--dtx);color:var(--dark)}

/* ---------------- 帮助弹层 ---------------- */

.hcard{

.hcard-head{display:flex;align-items:flex-start;gap:12px;padding:20px 22px 12px}
.hcard-head .hb{flex:1;min-width:0}
.hcard-head h3{margin:0;font-size:16px;font-weight:650;letter-spacing:.1px}
.hcard-head .hg{display:block;margin-top:5px;font-size:11px;font-weight:600;

.hcard-x{flex:none;width:30px;height:30px;border-radius:50%;

.hcard-body .kv .vv{flex:1;min-width:0}

/* ---------------- 右侧索引条：2026-09-29 已删（用户第 7 条）----------------
   它原来给「分类 tab」当翻页用（点一下跳到某个板块）。现在板块不再分页 ——
   内容少的直接铺在首页、内容多的点按钮开第二层界面 —— 没有「页」可翻了，

/* ---------------- 输出面板 ---------------- */
.ph{display:flex;align-items:center;gap:9px;padding:11px 14px;

  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#prog .pr-pct{flex:none;color:var(--mu);font-variant-numeric:tabular-nums}
#prog .pr-bar{height:6px;border-radius:4px;background:#e6e1d6;overflow:hidden}
#prog .pr-bar i{display:block;height:100%;width:0;border-radius:4px;

.hint{color:var(--mu);font-size:12px}

/* ★★★ 2026-10-05（对齐 Win 端）：工作空间行的**路径小字**。
   任务与工作空间那一层里，每行底下只剩这行路径（原来写在行内 style 里，
   行内样式一多，回头想统一调字号得改十几处字符串）。 */
.wspath{font-size:11.5px;opacity:.7;margin:2px 0 0 34px;word-break:break-all}

/* ---------------- 整屏视图 ---------------- */
.ovl{position:fixed;inset:0;z-index:80;background:var(--bg);
  display:none;flex-direction:column}
.ovl.show{display:flex}
.ovl-head{display:flex;align-items:center;gap:12px;padding:14px 20px;
  background:var(--bg);border-bottom:1px solid var(--line);flex:none}
.ovl-head h2{margin:0;font-size:16px;font-weight:650;letter-spacing:.1px}
.ovl-head .sub2{font-size:12px;color:var(--mu)}
.ovl-body{flex:1;overflow:auto;padding:18px 20px 100px}
/* ★★★ 2026-10-05（对齐 Windows 端）：底部条 —— **左右两区、总共两行高**。
   用户原话：「这个行高也太高了，底部的按键占用了一半空间，你还是行高、行间距调低点。
             然后区分左右两个区域，尽量弄到现在两行高的 UI 界面的空间里」。
   左边的量：左区 .foot-main（flex:1） 第 1 行 = #ovl-acts（动作按钮）
                                      第 2 行 = #ovl-note（「已选 N 条…」）
             右区 .foot-side（flex:none）＝ #ovl-back（「返回上一级菜单」，
                      align-self:flex-end ⇒ 永远贴**右下角**，**每一层都在同一点**）
   压缩手段：padding 12px 20px → 7px 16px；按钮间距 8→6px；
             `.btn.sm` 的 6px 12px/12.5px → 4px 10px/12px（见下面那条）。
   ⚠️ 底部条是 absolute 定位，高度随内容变（窄窗口下按钮折行）⇒
      正文的 padding-bottom 不能写死，交给 vFootFit() 按实测高度补。 */
.ovl-foot{position:absolute;left:0;right:0;bottom:0;display:flex;
  align-items:flex-end;gap:14px;padding:7px 16px;background:var(--panel);
  border-top:1px solid var(--line)}
/* 左区：动作按钮行 + 「已选 N 条」行，竖直码放（不是把 note 塞进按钮行的缝隙里） */
.ovl-foot .foot-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
/* 右区：「返回上一级菜单」的专座。`align-items:flex-end` 把它压在这一区的**底边**，
   而这一区又贴着整条的底边 ⇒ 全软件每一层的「返回」都在右下角同一个点上。 */
.ovl-foot .foot-side{flex:none;display:flex;align-items:flex-end}
/* 动作按钮：**左对齐、自动换行**。
   ⚠️ 用它自己的 gap 而不是 `.brk` 强行回车 —— 强行回车会把这一层撑成好几行。 */
.ovl-foot #ovl-acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center;
  justify-content:flex-start}
/* 分组用的**竖分隔线**（勾选 ｜ 改… ｜ 删…）—— 一道 1px 竖线就说清了「这是两组」 */
.ovl-foot #ovl-acts .sep{flex:none;width:1px;height:15px;background:var(--line2);
  margin:0 2px}
/* `.brk` 保留（「强制执行」那颗仍靠它独占一行）—— 零高度、不可见，只当回车符用 */
.ovl-foot #ovl-acts .brk{flex-basis:100%;height:0;margin:0;padding:0;border:0}
.ovl-foot .foot-line{display:flex;align-items:center;gap:10px;min-height:16px}
/* 「已选 N 条」：**必须 nowrap** —— 允许被压缩（min-width:0）但绝不换行 */
.ovl-foot .note{font-size:12px;color:var(--mu);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;min-width:0}
/* 「返回上一级菜单」的家：**全软件唯一一处**（各视图只管把它拼进 vActs，
   由 vActs 摘到这里）。它比同排别的按钮大一号是**有意的** —— 用户原话
   「尽量让图标大小都一样（除了返回上一级菜单）」，所以只收一档、仍比 .sm 大。 */
#ovl-back{flex:none;display:flex;align-items:center}
#ovl-back .btn{padding:6px 16px;font-size:12.5px;white-space:nowrap}
.ovl .loading{color:var(--mu);font-size:13px;padding:26px 4px;line-height:1.7}

/* PommeToys 式按钮：浅色大圆角 + 浅描边 + hover 微抬 */
.btn{padding:9px 16px;border-radius:var(--r2);background:var(--card);
  border:1px solid var(--line);font-size:13.5px;font-weight:500;transition:.15s}
.btn:hover{background:var(--card2);border-color:var(--line2);transform:translateY(-1px)}
/* ★ 按下去要**下陷**（原来写 translateY(0)＝只是回到原位，等于没有反馈，2026-09-29 第 18 条） */
.btn:active{transform:translateY(1px) scale(.975)}
/* ★ 2026-10-05（对齐 Win 端 · 用户「行高、行间距调低点」）：小按钮收一档 ——
   原来的 6px 12px / 12.5px 让一行按钮有 30px 高，底部条两行就吃掉 60 多像素。
   现在 4px 10px / 12px ⇒ 一行约 25px；按钮间距在 `.ovl-foot #ovl-acts` 里同步收到 6px。 */
.btn.sm{padding:4px 10px;border-radius:9px;font-size:12px}
.btn.pri{background:var(--dark);border-color:var(--dark);color:var(--dtx);font-weight:600}
.btn.pri:hover{background:#2e2a24;border-color:#2e2a24}
.btn.danger:hover{color:var(--err);border-color:#e8b6b0}
.btn[disabled]{opacity:.42;cursor:not-allowed;transform:none}
.btn.wide{width:100%;text-align:left}

/* ★★ 2026-09-29（用户第 18 条）：「凡是我的点击，都要及时反馈 —— 无论是声音还是画面」。
   原来各按钮的 `:active` 写的是 `transform:translateY(0)`，而 `:hover` 是 -1px ——
   按下去只是「**回到原位**」，几乎没有下陷感；`.tab` / `.pbtn` 更是**一条 :active 都没有**。
   音效那边已经证明「靠人肉补一定补不完」（54 处点击处理漏了 39 处），所以这里同样改成
   **一处兜底**：JS 在捕获阶段接 pointerdown → 给点到的那颗元素挂 `.wb-press`，
   抬起 / 拖出 / 取消就摘掉（见 bindPress）。
   ★ 为什么必须 !important：元素自己的 `:hover` 也写 transform，不加这条会被它「顶」回去 ——
     那正是「按了像没按」的手感来源。
   ★ 它只负责挂/摘一个 class，不碰任何逻辑：就算它坏了，也只是手感差一点，不会把界面弄哑。 */
.wb-press{transform:translateY(1px) scale(.975) !important;filter:brightness(.93)}

/* 卡片（视图里的小节） */
.card2{background:var(--card);border:1px solid var(--line);border-radius:20px;
  padding:16px 18px;margin-bottom:14px}
.card2 h3{margin:0 0 10px;font-size:13.5px;font-weight:650;

.card2 .lead{margin:-4px 0 10px;font-size:12px;color:var(--mu);line-height:1.6}
/* ★ 说明段收进 ⓘ 之后：ⓘ 落在标题行最右（h3 是 flex 行）*/
.card2 h3 .info.inline{margin-left:auto}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}

/* 设置行（左标签 / 右值） */
.row{display:flex;align-items:flex-start;gap:12px;padding:7px 0;
  border-bottom:1px dashed var(--line)}
.row:last-child{border-bottom:0}
.row .k{flex:0 0 148px;color:var(--mu);font-size:12.5px;padding-top:1px}

.row .v.mono{font-family:var(--mono);font-size:12px}

.row .v.lv-warn{color:#9a7218}

.row .v.lv-off{color:var(--mu)}
pre.blk{margin:0;padding:12px 14px;border-radius:var(--r2);background:var(--dark);
  font-family:var(--mono);font-size:12px;line-height:1.5;white-space:pre-wrap;

/* 勾选行（恢复会话 / 合并会话 / 同步项开关） */
.pick{position:relative;display:flex;align-items:center;gap:12px;padding:11px 14px;
  border-radius:var(--r2);background:var(--card);border:1px solid var(--line);

.pick .box{width:19px;height:19px;border-radius:6px;border:1.5px solid var(--line2);
  flex:none;display:flex;align-items:center;justify-content:center;
  font-size:13px;line-height:1;color:var(--dtx)}
.pick.sel .box{background:var(--dark);border-color:var(--dark)}
.pick .t{flex:1;min-width:0;font-size:13.5px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick .m{flex:none;font-size:11.5px;color:var(--mu);white-space:nowrap}
.pick[disabled]{opacity:.5;cursor:not-allowed}

/* ---- 「合并会话」按工作空间分组的选择列表（2026-09-29 第 10 轮）----
   ★ 为什么要分组：本机 33 条存活会话平铺成一长条时，「哪几条属于同一个案子 /
     项目」完全看不出来，找一条得一路滚。分组之后一组一个工作空间，可折叠。
   ★ 组标题用 <button>：键盘能 Tab 到、能回车，也给将来留了「锁某一组」的口子。 */
.wgrp{margin-bottom:10px}
.wghead{display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  padding:7px 10px;border-radius:10px;border:1px solid transparent;background:none;
  color:inherit;font:inherit;cursor:pointer;transition:.12s}
.wghead:hover{background:var(--card2);border-color:var(--line)}
.wghead .tri{flex:none;width:11px;font-size:9px;color:var(--mu);
  transition:transform .15s;display:inline-block}
.wgrp.fold .wghead .tri{transform:rotate(-90deg)}
.wghead .wn{flex:none;font-size:13.5px;font-weight:650}
.wghead .wp{flex:1;min-width:0;font-size:11.5px;color:var(--mu);
  font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wghead .wc{flex:none;font-size:11.5px;color:var(--mu)}
.wgrp.fold .wgbody{display:none}
.wgbody{padding-left:7px}

/* 文本输入框（全站第一个 —— 之前没有任何 <input>）。
   颜色沿用暖色板，聚焦时描边转深（不用蓝色光晕，整站无蓝）。 */
.tin{width:100%;padding:9px 12px;border-radius:var(--r2);border:1px solid var(--line2);
  background:var(--card2);font:13.5px var(--sans);color:var(--tx);outline:none;
  transition:.12s;display:block}
.tin::placeholder{color:var(--mu)}
.tin:focus{border-color:var(--dark)}

/* ---- 「合并后的名称」对话框（2026-09-29 第 10 轮）----
   ★ 为什么自己画一个、不用 window.prompt()：
     外壳（WBShell.swift 的 WKWebView）**默认不实现 prompt** —— 代理没实现时
     它会静默返回 null（＝用户点了取消），不报错也不弹框，症状是「点了没反应」；
     而且 prompt 在「菜单栏面板模式」和浏览器预览里也不可用。
   ★ z-index 120 > 整屏视图的 80：它是在合并视图**之上**弹的一层。 */
.dlg{position:fixed;inset:0;z-index:120;display:none;align-items:center;
  justify-content:center;background:rgba(27,25,22,.34);padding:22px}
.dlg.show{display:flex}
.dlg-card{width:min(540px,100%);max-height:88vh;overflow:auto;background:var(--bg);
  border:1px solid var(--line);border-radius:20px;padding:18px 20px;
  box-shadow:0 24px 60px rgba(27,25,22,.3)}
.dlg-card h3{margin:0 0 6px;font-size:15.5px;font-weight:650}
.dlg-card .lead{margin:0 0 10px;font-size:12px;color:var(--mu);line-height:1.6}
.dlg-sec{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:9px 12px;margin-bottom:12px}
.dlg-row{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:12.5px}
.dlg-row .tag{flex:none;font-size:11px;font-weight:600;color:var(--mu);
  background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:1px 7px}
.dlg-row .tt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dlg-row .mm{flex:none;font-size:11.5px;color:var(--mu);white-space:nowrap}
.dlg-foot{display:flex;align-items:center;gap:8px;margin-top:14px}
.dlg-foot .grow{flex:1}
/* 跨工作空间的风险提示：暖黄底 —— 是「看一眼再决定」的语气，不是报错。 */
.warnbox{font-size:12px;line-height:1.65;color:#8a5b18;background:#fdf4e3;
  border:1px solid #f0dcb4;border-radius:12px;padding:9px 11px;margin-bottom:12px}
.warnbox label{display:flex;align-items:flex-start;gap:8px;cursor:pointer;margin-top:8px;
  font-weight:600}
.warnbox input{flex:none;margin-top:2px}
/* 对话框里的那条状态/失败原因（空的时候不占位） */
.dlg-msg{font-size:12px;line-height:1.6;color:#b23c37;margin-top:9px}
.dlg-msg:empty{display:none}

/* 音效选择行（照 PommeToys：左标题，右一个动作） */
.snd{position:relative;display:flex;align-items:center;gap:12px;padding:9px 12px;
  border-radius:var(--r2);border:1px solid var(--line);background:var(--card);
  margin-bottom:6px;cursor:pointer;width:100%;text-align:left}
.snd:hover{background:var(--card2)}
.snd.on{border-color:var(--dark);background:#efeadf}
.snd .t{flex:1;min-width:0}
.snd .n{display:block;font-size:13.5px;font-weight:600}
.snd .d{display:block;font-size:12px;color:var(--mu);margin-top:3px;line-height:1.5}
.snd .rd{flex:none;width:20px;height:20px;border-radius:50%;
  border:1.5px solid var(--line2);display:flex;align-items:center;justify-content:center;
  font-size:12px;color:var(--dtx)}
.snd.on .rd{background:var(--dark);border-color:var(--dark);color:var(--dtx)}

/* ★ 2026-09-29（用户第 3 条）：顶栏那个 ⓘ 是**内联**的（跟在按钮后面），
   卡片上的 ⓘ 是**贴右上角**的（绝对定位）。同一个类，两种落位。 */
/* ★★★ 2026-10-05（Mac 端 · 实测修）：`display` 必须显式写成 **inline-flex**。
   来由：`.info` 的基础规则是 `display:flex`（那是给「贴右上角」那种绝对定位版本用的），
   `.info.inline` 只覆盖了 position/size，**没覆盖 display** ⇒ 这个 ⓘ 仍是**块级**的。
   后果在底部说明行（`#ovl-note` 里那段「已选 N 条…」）最明显：
   `.note` 作为 `.foot-line` 的 flex 项被块级化，里面的文字 span 与这个块级 ⓘ
   就**各占一行** —— 明明只想省版面，反倒多占了一行、把底栏撑高。
   CDP 实测（fix 前）：note 高 35px、ⓘ 落在文字下面一行；改 inline-flex 后同为一行。
   ⚠️ 在 `.card2 h3`（它本身是 flex 行）里用不受影响 —— flex 项会被自动块级化。 */
.info.inline{position:static;display:inline-flex;width:16px;height:16px;
  font-size:10.5px;flex:none;vertical-align:middle}
.tbgrp{display:inline-flex;align-items:center;gap:4px;flex:none}

/* ---------------- 提示条 ---------------- */
#toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(80px);
  background:var(--dark);border:1px solid var(--dark);color:var(--dtx);
  padding:10px 18px;border-radius:var(--r2);font-size:13px;opacity:0;
  transition:.22s;pointer-events:none;z-index:99;max-width:70vw;
  box-shadow:0 10px 30px rgba(40,32,18,.3);
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#stalebar{display:none;margin:0 0 12px;padding:11px 14px;border-radius:var(--r2);
  background:#f7f0dc;border:1px solid #e0cfa4;
  color:#7d5c14;font-size:13px;line-height:1.6}
#stalebar.on{display:block}
#stalebar b{color:#5f4409}
#stalebar .go{color:#3f6d9e;cursor:pointer;text-decoration:underline}

/* ---------------- 菜单栏面板模式（?panel=1） ----------------
   ★★ 2026-09-29（用户第 8 条）：屏幕顶部菜单栏那颗图标**点开的那块面板**。
      照 PommeToys 的做法 —— 它那块不是系统下拉菜单，而是一个**自定义面板窗口**
      （`MenuPanelWindowController` ＋ `MenuPanelView`，里面还有 Rail / LCD / Lever
      这些自制控件）；面板里放的正是它的防休眠那一套：
        Keep the display on                              → 屏幕保持常亮
        Stop when battery is low                         → 电量不足时自动停
        Stay awake with the lid closed                    → 合盖后保持唤醒
        Keep the built-in display on with the lid closed  → 合盖后内建显示器保持点亮
      所以这里把同一套「运行监测」控件原地复用，不另写一份。

   同一份 _ui.html 兼顾两种形态：
     · **整页**（默认）—— 顶栏 ＋ 状态板 ＋ 四个分页 ＋ 输出区
     · **面板**（`?panel=1`）—— 只剩「一排状态灯 ＋ 运行监测那张常驻黑卡 ＋ 一排动作」
   面板模式下 JS 侧**直接不渲染**顶栏/状态板/分页（见 renderTabs/renderStatus 的
   IS_PANEL 分支，以及 jsPanelBoot 里把 #power-card 搬去 #panbox 那一步），
   下面这段 CSS 只是兜底：万一哪天真漏了一个节点，它在面板里也不会冒出来。
   ⚠️ 廿七轮把 `#groups` / `.navrow` 换成了 `#ptabs` / `.page` ——
      CSS 的这份名单要跟着改（旧节点已经不在 HTML 里，留着等于没兜住）。 */
#panroot{display:none}
body.panel{background:transparent}
body.panel #panroot{display:block}
body.panel header,
body.panel #ptabs,
body.panel #statusbar,
body.panel #stalebar,
body.panel #aside,
body.panel .page{display:none !important}
body.panel .wrap{display:block;overflow:visible}
body.panel main{overflow:visible;padding:0;display:block}
/* 面板里那张黑卡去掉外边距，靠 #panbox 统一给内边距 */
body.panel .pcard{margin:0;border-radius:13px}
/* 面板外壳：圆角 + 描边。窗口本身设成透明、不画背景，好让圆角露出来
   （见 WBShell.swift 里 panel 的 isOpaque=false / backgroundColor=.clear）。 */
#panwrap{background:var(--bg);border:1px solid var(--line);border-radius:14px;
  overflow:hidden;display:flex;flex-direction:column}
/* ★★★ 2026-10-01（用户第 4 条）：面板**照 PommeToys 重做版式**。
   用户原话：「你就给我改成和 POMMETOYS 逻辑一致就行，ui 甚至可以照抄，
   除了这个窗口这一行和滚动这一行，其余的和他一模一样」。
   于是面板 = 「打开 XXX」标题行 ＋ 分隔线 ＋ 一个个开关行 ＋ 底部那排按钮
            （第卅五轮起开关**直接铺开**，见下面那段）。
   用户第 2/3 条：**监测信息（那排状态胶囊）与「刷新」按钮已从面板撤掉** ——
   两者只在主窗口（大界面）保留。 */
#panhead{display:block;padding:0;border-bottom:none}
/* 顶部标题行 = 打开主窗口（照 PommeToys 的「打开 PommeToys」）。
   ⚠️ 原来那颗「打开窗口」按钮已从底栏撤掉，职能并到这一行。 */
.pt-title{font-size:15px;font-weight:500;color:var(--tx);
  padding:14px 14px 12px;cursor:pointer;user-select:none;-webkit-user-select:none;
  transition:background .13s}
.pt-title:hover{background:var(--card2)}
.pt-title:active{background:var(--card2)}
.pt-sep{height:1px;background:var(--line);margin:0 14px}
#panbox{padding:0}
/* 面板里那张卡脱掉「黑卡」外衣，只当一行行的容器（PommeToys 的行式观感）。
   ⚠️ 只作用于面板 —— 主窗口那张卡照旧是黑卡（见 renderPower 的 IS_PANEL 分支）。 */
body.panel #power-card{background:transparent;border:none;border-radius:0;
  padding:0;margin:0;box-shadow:none}
/* ★★★ 2026-10-01（第卅五轮 · 用户）——**面板不再折叠，开关直接铺在上面**。
   用户原话：「你在菜单栏的小界面上同时放了『防休眠』『合盖后保持唤醒』
   『屏幕保持常亮』以及『完成后自动关机』这几个开关，不必把它收进去了」。
   ⇒ 撤掉上一轮那套「防休眠 运行中 ›」摘要行 + `.pc-body` 折叠体
     （`.pt-row` / `.pt-k` / `.pt-v` / `.pt-chev` / `.pc-body` / `.pc-open` 全删），
     开关按 PommeToys 面板的行式**一行一行平铺**：
     行内左边是名称、右边是胶囊开关；行与行之间一条细线；子项靠左缩进表层级。
   ⚠️⚠️ 面板底色是**浅色**（`body.panel #power-card` 已改成透明、露出米白底），
     而 `.pw-f` / `.pw-f-n` / `.act` / `.sld` 这套颜色是给**深色卡**写的
     （白字、白边、半透明白底、近黑轨道）—— 不逐条换成浅色版的话，
     开关的名字在面板里**完全看不见**。上一轮折叠着，没人把它翻出来过，
     所以这个「隐形」一直没暴露。 */
body.panel #power-card .pw-feats{margin:0}
/* ★ 行距：面板要「比 PommeToys 还小」（用户原话），所以上下各留 6px —— 
   一行 = 6 + 28(开关) + 6 + 1(分隔线) = 41px。PommeToys 那边一行要 60~75px。 */
body.panel #power-card .pw-f{
  border:none;border-bottom:1px solid var(--line);border-radius:0;
  background:transparent;margin-bottom:0;padding:6px 14px;gap:10px}
body.panel #power-card .pw-f:last-child{border-bottom:none}
/* ★★★ 2026-10-05（用户第 9 条）：面板里同构（浅色版）—— 缩进取 12 ＋ 12，
   线走在框外那条 12px 空白里，浅底上用更实的暖褐（`.55`），不刺眼但看得清。
   主卡那套 `.pw-kids` 是默认值，这里只覆盖"更窄的缩进"与"浅色线"。 */
body.panel #power-card .pw-kids{margin-left:12px;padding-left:12px}
body.panel #power-card .pw-kids::before{background:rgba(198,146,54,.55)}
body.panel #power-card .pw-kids>.pw-f::before{left:-12px;width:13px;
  background:rgba(198,146,54,.55)}
body.panel #power-card .pw-f-n{color:var(--tx)}
body.panel #power-card .pw-f-g{color:var(--mu);border-color:var(--line2)}
body.panel #power-card .pw-f.dis{opacity:.45}
body.panel #power-card .pw-f.na{opacity:.35}
/* 「时长」滑块也换浅色版（深色卡那套 `#4e4942` 轨道压在米白上像一道黑杠） */
/* ★ 2026-10-05（第 9 条）：面板内滑块跟着面板的窄缩进（容器已给 24px，再 14px
   即与「时长」文字对齐）。 */
body.panel #power-card .sldwrap{margin:0 14px 6px 14px}
body.panel #power-card .sld::-webkit-slider-runnable-track{
  background-image:
    radial-gradient(circle, #b3aa9c 0 1.5px, transparent 1.7px),
    linear-gradient(to right, #e0655e 0 var(--p, 0%), #d8d2c4 var(--p, 0%) 100%)}
body.panel #power-card .sld::-webkit-slider-thumb{border-color:#e0655e}
/* ★ 2026-10-02（第六十五轮）：`.as-left`（那行倒计时小字）已整条退役 ——
   面板里这条 margin 覆盖随之删掉。倒计时现在画在 `#sld-dur-v` 读数器里，
   面板浅底上的配色见上面 `.sld-val.cd .rd-c`。 */
/* 按钮（「停止监测」）也换浅色版 */
body.panel #power-card .act{background:var(--card);border-color:var(--line);color:var(--tx)}
body.panel #power-card .act:hover{background:var(--card2);border-color:var(--line2)}
body.panel #power-card .act.stop:hover{color:var(--err);border-color:#e8b6b0}
body.panel #power-card .pc-foot{padding:6px 14px 11px;margin-top:0}
/* 标题行也跟着收一点（14+12 → 12+10），面板总共能省 4px */
body.panel .pt-title{padding:12px 14px 10px}
/* ★ 面板上不放**常态**监测信息 —— `#sd-chip` 只在「你需要知道」的事上露头：
   「关机倒计时中」（fire）、「开关开着但守护没跑」（wait）、
   以及「开着、WorkBuddy 正在跑」（on，2026-10-01 第五十一轮加）。
   只有最纯粹的「关 · …」那一相（连 class 都没有）在面板里不占位。
   ★★★ 2026-10-01（第五十一轮 · 用户第 4 条）：原来 `.on` 那一相**也**被藏在
     这条 `display:none` 底下 —— 于是用户「打开跑完自动关机」之后面板上
     一个字都不显示，看不出「现在有人在跑、所以它不会关机」。现在放出来，
     并给它一套**绿色**（与 fire 的红、wait 的黄成三色）：
     绿＝正在跑·先不关，黄＝已停手·秒数在走，红＝已经在关机倒计时。 */
body.panel #sd-chip{display:none}
body.panel #sd-chip.on,body.panel #sd-chip.fire,body.panel #sd-chip.wait{
  display:inline-flex;background:rgba(223,168,60,.16);border-color:rgba(223,168,60,.5);
  color:#8a6314}
body.panel #sd-chip.on{background:rgba(118,209,115,.18);
  border-color:rgba(118,209,115,.5);color:#3d7a3b}
body.panel #sd-chip.fire{background:rgba(236,103,101,.16);
  border-color:rgba(236,103,101,.5);color:#b3271f}
/* 底部动作：**等宽三列网格**（照 PommeToys 面板那种「一排按键」的手感）。
   5 颗按钮 → 第一行 3 颗、第二行 2 颗，比让它们自由折行整齐得多。
   ⚠️ 别改成 flex-wrap：那样会拼出「4 颗 + 1 颗独自一行」的参差样子。 */
#panfoot{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;
  padding:9px 11px;border-top:1px solid var(--line)}
#panfoot .pbtn{padding:6px 4px;border-radius:9px;border:1px solid var(--line);
  background:var(--card);font-size:11.5px;font-weight:500;transition:.13s;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
#panfoot .pbtn:hover{background:var(--card2);border-color:var(--line2)}
/* ★ 2026-09-29（用户第 18 条）：面板底部这一排原来**只有 hover、没有 :active** ——
   而它恰恰是「从菜单栏点开面板后第一眼就要点」的那排，按下去毫无反应最刺眼。 */
#panfoot .pbtn:active{transform:translateY(1px) scale(.975);filter:brightness(.93)}
#panfoot .pbtn.danger:hover{color:var(--err);border-color:#e8b6b0}
</style>

<body>

<!-- ================= 菜单栏面板（?panel=1 时唯一可见的一块） =================
     ★★★ 2026-10-01（用户第 2/3/4 条）：面板**照 PommeToys 重做**。
       结构 = 标题行（打开主窗口）→ 分隔线 → 一个个开关行（防休眠那一套，
              **第卅五轮起直接铺开**，不再有「点一下展开」）→ 底部两颗按钮。
       用户明确撤掉的三样（都只在主窗口留）：
         · 顶部那排监测胶囊（服务 / 记忆线 / 跨机任务线 / 本机任务线 / 技能线）
         · 底部的「刷新」按钮
         · 底部的「打开窗口」按钮 —— 职能并到顶部标题行，好让底栏更短
     ★★★ 2026-10-01（第四十七轮 · 用户第 1 条）：底栏**再撤一颗** ——
       「关闭服务」与「退出」合并成同一颗「退出」。
       用户原话：「按理讲『关闭服务』和『退出』这两个操作应该都是一致的，
       应该直接退出程序，包括菜单栏的程序图标」。所以现在这一颗就是

<script>
'use strict';

var $ = function(id){ return document.getElementById(id); };
var toastTimer = null;

function toast(msg, ms){
  var t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('show'); }, ms || 2600);
}

/* ★★★ 2026-10-01（用户第 2 条）：提示**减噪**。
   用户原话：「类似这种跳出来的通知，如果不是那种特别严重的影响功能使用的问题
             就不要弹出来提醒了」（附了一张「「这一项」正在跑……不用再点」的截图）。
   于是把提示分成两档，**只有第一档才弹**：
     ① `toast()` —— **报错 / 有数据丢失风险 / 不处理就没法继续用**。
        这类必须弹：不弹用户会以为「点了没反应」或者「悄悄坏了」。
     ② `note()`  —— 其余一切（「正在跑」「已刷新」「已展开」这种纯陈述）。
        不弹，只在控制台留一行，排障时仍查得到。
   判断口径就一句：**弹之前先问「不弹的话，用户会不会因此做错事、或以为坏了？」
   不会 → 用 note()。** */
function note(msg){
  try { console.log('[note] ' + msg); } catch (e) {}
}

function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ★★ 2026-09-29（用户第 10 条补）：fetch 加超时 —— 之前没有超时，服务一旦卡住
   （比如正在跑很重的自检、socket 接了但不回话），点「状态与设置」这类要现取数的
   按钮就会**永远停在「正在读…」**，看起来就像按钮坏了。
   现在默认 20 秒放弃并报「请求超时」；个别慢接口用 opt.timeout 自己放宽（毫秒）。
   ⚠️ AbortController 在本项目的 WKWebView / Chromium --app 里都可用（Safari 12.1+）。 */
function api(path, opt){
  opt = opt || {};
  var ms = opt.timeout != null ? opt.timeout : 20000;
  var ctl = (typeof AbortController === 'function') ? new AbortController() : null;
  var opts = opt;
  if (ctl){
    opts = opt.signal ? opt : Object.assign({}, opt, { signal: ctl.signal });
    if (!opt.signal) setTimeout(function(){ ctl.abort(); }, ms);
  }
  return fetch(path, opts).then(function(r){ return r.json(); })
    .catch(function(e){
      /* 超时被 abort 时 Chrome 报 AbortError、WebKit 报 'AbortError' 或空 message —— 统一翻成人话 */
      if (ctl && (e && (e.name === 'AbortError' || /abort/i.test(String(e.message || '')))))
        throw new Error('请求超时（' + Math.round(ms / 1000) + ' 秒）—— 服务可能正忙，稍后再试');
      throw e;
    });
}

function bdItem(k, obj, icon, id){
  var lv = (obj && obj.level) || 'off';
  var full = (obj && obj.text) || '—';
  var v  = (obj && (obj.short || obj.text)) || '—';

       + '<span class="dot"></span>' + svgIcon(icon)
       + '<span class="k">' + esc(k) + '</span>'

     这是绝大多数情况（面板是外壳启动时预载的，预载那一次就把快照拿到了）：
     弹出走这条路就只剩「画 DOM + 量高度」，实测 1~2ms。真值随后异步补回来，
     内容若有细微变化就地更新；**高度一般不会变**（快照就是上次的真实内容），

  if (PANEL_LAST){
    try { checkVer(PANEL_LAST); renderStatus(PANEL_LAST); resumeJobs(PANEL_LAST.jobs); }
    catch (e) { /* 旧快照画不出来不影响下面那次真值 */ }
    panelPollOn();

  panelPollOn();

var SW_HELD  = false;   // 冻结期间有快照被挡下 → 松手后要补画一帧
var SW_FLUSH_T = null;
/* ★★★ 2026-10-11 实测补丁：**补画必须等这一下 click 派发完**。
   踩到的坑（真浏览器里实测复现）：松手时同步 `loadStatus()`，那一趟在
   pointerup 与 mouseup **之间**就把卡片重画了 ⇒ 刚松开的那颗节点成了孤儿

     一条 click 都没有）⇒ 冻了半天，最后这一下还是被自己的补画吃掉。

   本来是给**长任务卡片**写的（真实事故：2026-09-29 一分钟内 one1 被连点 9 次、
   env1 连点 4 次，每次都真起了任务）。可它对**开关**同样生效 —— 而开关的语义
   恰恰相反：**越点越要算数**（开 → 关）。被拦下时，本地乐观值已经翻过去了，
   3 秒后真值回来又把它打回原样 ⇒ 用户看到「弹一下 UI 又弹回去」。

     必然要弹一下。）

   **为什么不能"直接放行、随便点"**：后端 `wb_powerguard.cmd_toggle()` 是
   「load_conf() → 取反 → write_feats()」，**读-改-写**。两条命令并发时，
   两个子进程会各自读到**同一份旧值**、各自取反成同一个新值 ⇒ 净效果只翻一次
   （用户点了两下，却只变了一下）。

   ⇒ 治法：**放行（不再拦），但串行 + 以最后一次点击的意图收敛**。

     · `SW_CONF[k]`：后端**最近一次确认**的状态（每条 toggle 成功 = 翻一次）；
     · `SW_WANT[k]`：用户**最后一次**点击后的目标状态；
     收尾信号挂在 `pollJob()` 的 done 分支（`swDone()`）—— 那是唯一可靠的
     「这次命令真跑完了、后端已落盘」的时刻（`pwRelease` 也在那儿）。

   ⚠️ 于是"点 3 下"只会发 1 条命令（3 是奇数＝净翻一次），"点 2 下"会发 2 条
     —— 与用户看到的乐观翻动**完全一致**，且请求数最少。 */
var SW_BUSY = {};    // key -> 该开关有一条命令正在后端跑
var SW_WANT = {};    // key -> 用户最后一次点击后的目标状态
var SW_CONF = {};    // key -> 后端最近一次**确认**过的状态
var SW_SENT = {};    // key -> 「已经发出去的那一条」当时的目标（不能读 SW_WANT）
/* 点一下开关：`want` = 目标状态，`cur` = 点之前那一刻的真实状态。 */
function swToggle(k, want, cur){
  if (!SW_BUSY[k]) SW_CONF[k] = !!cur;   // 没有在途时才重设基准（有在途就别动基准）
  SW_WANT[k] = !!want;
  swFire(k);
}
/* 该发就发（不该发就直接返回）。返回 true = 确实发出了一条。 */
function swFire(k){
  if (SW_BUSY[k]) return false;                  // 有在途 → 等它收尾时补发
  if (SW_CONF[k] === SW_WANT[k]) return false;   // 已经到位，不用发
  SW_BUSY[k] = true;
  /* ★ 记下"这一条发出去时想要的到底是什么"。**不能等到 swDone 时再读 `SW_WANT`**
     —— 命令在飞的过程中用户完全可能又点了一下，那时 `SW_WANT` 已经是新的意图了，
     拿它当"这条命令的结果"会记错基准（下一次就会多发/少发一条）。 */
  SW_SENT[k] = SW_WANT[k];
  run({ key: k }, false, { sw: true });          // opts.sw：不受防连点保护、不占卡片
  return true;
}
/* 一条开关命令跑完（`pollJob` 的 done 分支调）。返回 true = 还要接着补发。 */
function swDone(k, ok){
  if (!k || !SW_BUSY[k]) return false;
  SW_BUSY[k] = false;
  if (!ok){                                      // 失败 → 放弃，交给真值去纠正 UI
    SW_WANT[k] = SW_CONF[k];
    return false;
  }
  SW_CONF[k] = SW_SENT[k];                       // 这条成功了 ⇒ 后端此刻就是这个状态
  return swFire(k);                              // 还没到最新意图 → 补发
}
function pwHold(k){
  if (k) PW_HOLD[k] = Date.now();
  /* ★★★ 2026-10-01（第五十三轮 · 用户「这个反应的时间能不能加速一下」）：
